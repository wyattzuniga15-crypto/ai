plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data { clientData() }
        // Boots a real server and runs the @GameTest methods — the only thing in the project
        // that verifies behaviour rather than compilation. Registered only under
        // -PwithGameTest, for the same reason the GeckoLib spike is: an unverified run type
        // that fails at configuration time would take the jar down with it, and the jar is
        // the deliverable. The gametest job passes the flag; nothing else does.
        if (project.hasProperty('withGameTest')) {
            gameTestServer { type = 'gameTestServer' }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // No unitTest {} block on purpose. src/test holds the Minecraft-free core suite, which
    // runs fine on a plain classpath — wiring it through the NeoForge test framework would
    // put a Minecraft bootstrap in the jar's critical path for nothing.
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // GeckoLib is NOT on Maven Central — mvnrepository lists it, but mvnrepository indexes
    // third-party repositories too. Cloudsmith is the only place it publishes.
    if (project.hasProperty('withGeckolib')) {
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        }
    }
}

// DECISIONS.md D-03. GeckoLib is compiled only under -PwithGeckolib, in its own CI job, so that
// an alpha-library break cannot take down the mod jar the rest of the project depends on.
def withGeckolib = project.hasProperty('withGeckolib')
if (withGeckolib) {
    sourceSets.main.java.srcDir 'src/spike/java'
}

// Same isolation, same reason. The GameTest sources are written against an API this project has
// not yet confirmed exists in 1.21.11 — the first attempt used net.minecraft.gametest.framework
// .GameTest, which the package no longer contains. Until the gametest job compiles them once,
// they stay out of the jar's way.
if (project.hasProperty('withGameTest')) {
    sourceSets.main.java.srcDir 'src/gametest/java'
}

dependencies {
    if (withGeckolib) {
        implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The core/ domain model imports no Minecraft types (ARCHITECTURE §2), so it is tested at
// unit-test speed rather than through a game server. This is the majority of the mod's decision
// logic: the Mist matrix, favour, energy, judgment, scent, prophecy, and the Labyrinth graph.
test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}

tasks.named('processResources', ProcessResources).configure {
    // Without this the em-dash in the license string comes out as mojibake in the shipped
    // mods.toml — Gradle filters with the platform default charset otherwise.
    filteringCharset = 'UTF-8'

    // The map must NOT be called `expand`: Groovy then resolves `expand props` against the map
    // itself rather than FileCopyDetails.expand, and fails with LinkedHashMap.call().
    def tokens = [
            minecraft_version   : minecraft_version,
            neo_version_range   : neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description,
    ]
    inputs.properties(tokens)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand tokens
    }
}

// Diagnostic. 1.21.11 renamed ResourceLocation and the migration primer does not say which package
// the new class lives in. Rather than guess a second time, ask the compile classpath directly.
tasks.register('whereIsIdentifier') {
    doLast {
        def hits = [] as Set
        sourceSets.main.compileClasspath.files.each { f ->
            if (!f.name.endsWith('.jar') || !f.exists()) return
            try {
                new java.util.zip.ZipFile(f).withCloseable { zip ->
                    zip.entries().each { e ->
                        if (e.name ==~ /.*\/(Identifier|ResourceLocation)\.class/) {
                            hits << e.name.replace('/', '.').replace('.class', '')
                        }
                    }
                }
            } catch (ignored) { }
        }
        println '=============== Identifier / ResourceLocation on the classpath ==============='
        hits.sort().each { println "  $it" }
        if (hits.isEmpty()) println '  (none found — the class is named something else entirely)'
        println '============================================================================='
    }
}

// Run 42 answered the first version of this question and the answer was not a rename. The whole
// net.minecraft.gametest tree is empty on the compile classpath, and the only test-shaped class
// anywhere is net.neoforged.fml.startup.GameTestServer — the launcher, not the framework. So the
// test framework is not a dependency this project has; it is one it lacks. This wider scan reports
// the jar count too, so an empty result can be told apart from a scan that found no jars to read.
tasks.register('gameTestApi') {
    doLast {
        def framework = [] as Set
        def annotations = [] as Set
        sourceSets.main.compileClasspath.files.each { f ->
            if (!f.name.endsWith('.jar') || !f.exists()) return
            try {
                new java.util.zip.ZipFile(f).withCloseable { zip ->
                    zip.entries().each { e ->
                        if (!e.name.endsWith('.class')) return
                        def fqn = e.name.replace('/', '.').replace('.class', '')
                        if (e.name.startsWith('net/minecraft/gametest/')) framework << fqn
                        if (e.name.toLowerCase().contains('test') && e.name.startsWith('net/neoforged/')) {
                            framework << fqn
                        }
                        if (e.name ==~ /.*(GameTest|TestHolder|TestInstance|TestFunction)[A-Za-z]*\.class/) {
                            annotations << fqn
                        }
                    }
                }
            } catch (ignored) { }
        }
        println '=============== net.minecraft.gametest.** and net.neoforged.**test** ==============='
        framework.sort().each { println "  $it" }
        if (framework.isEmpty()) println '  (nothing — the test framework is not on the compile classpath at all)'
        println "  [jars scanned: ${sourceSets.main.compileClasspath.files.count { it.name.endsWith('.jar') }}]"
        println '=============== anything test-shaped, either side of the split ==============='
        annotations.sort().each { println "  $it" }
        println '============================================================================='
    }
}

// The strongest discovery tool yet: reflect over named classes from the real classpath and print
// their public constructors and methods. Class-name scans say what exists; this says what it
// looks like. -Pdescribe=a.b.C,d.e.F — used by CI before any round of blind API writing.
tasks.register('describeClass') {
    doLast {
        def names = (project.findProperty('describe') ?: '').split(',').findAll { it }
        // The compile classpath's 80 jars turned out not to include the Minecraft artifact at
        // execution time — javap could not find EntityType itself. MDG materialises the game
        // somewhere under the build and cache directories, so sweep both and take everything.
        def jars = (sourceSets.main.compileClasspath.files
                + fileTree(dir: layout.buildDirectory.get().asFile, include: '**/*.jar').files
                + fileTree(dir: new File(gradle.gradleUserHomeDir, 'caches'), include: '**/neoforge*.jar').files)
                .findAll { it.name.endsWith('.jar') && it.exists() }
        println "[classpath: ${jars.size()} jars]"
        jars.findAll { it.name =~ /minecraft|neoforge|joined|client-extra/ }.each {
            println "[game jar: ${it.name}]"
        }
        def cp = jars.collect { it.absolutePath }.join(File.pathSeparator)
        def javap = new File(System.getProperty('java.home'), 'bin/javap').absolutePath
        names.each { name ->
            println "=============== ${name} ==============="
            def proc = new ProcessBuilder([javap, '-protected', '-cp', cp, name])
                    .redirectErrorStream(true).start()
            proc.inputStream.eachLine { println "  ${it}" }
            proc.waitFor()
        }
    }
}

// Same discovery trick that settled Identifier: if the GeckoLib 5 package layout differs from what
// the spike assumes, print what is actually in the jar rather than guessing a second time.
tasks.register('geckolibPackages') {
    doLast {
        configurations.compileClasspath.files.each { f ->
            if (!f.name.contains('geckolib') || !f.name.endsWith('.jar')) return
            println "jar: ${f.name}"
            def animation = []
            def playstate = []
            new java.util.zip.ZipFile(f).withCloseable { zip ->
                zip.entries().each { e ->
                    if (!e.name.endsWith('.class')) return
                    def fqn = e.name.replace('/', '.').replace('.class', '')
                    if (e.name.startsWith('software/bernie/geckolib/animation/')) animation << fqn
                    if (e.name.contains('PlayState')) playstate << fqn
                }
            }
            println '=============== anything named PlayState ==============='
            playstate.sort().each { println "  $it" }
            if (playstate.isEmpty()) println '  (nothing — it may be an enum nested in another class)'
            println '=============== software.bernie.geckolib.animation ==============='
            animation.sort().each { println "  $it" }
            println '================================================================='
        }
    }
}

// Discovery for the next round: KeyMapping wants a Category object in 1.21.11 rather than a
// String, and MobEffects was renamed. Print what is actually there instead of guessing.
tasks.register('whatIsAKeyCategory') {
    doLast {
        sourceSets.main.compileClasspath.files.each { f ->
            if (!f.name.endsWith('.jar') || !f.exists()) return
            try {
                new java.util.zip.ZipFile(f).withCloseable { zip ->
                    zip.entries().each { e ->
                        if (e.name ==~ /.*KeyMapping\$Category\.class/) println "  ${e.name}"
                    }
                }
            } catch (ignored) { }
        }
    }
}

// KeyMapping wants a Category object in 1.21.11 rather than a String. Print what the class
// actually offers, so a wrong guess costs one run instead of several.
tasks.register('keyCategories') {
    doLast {
        sourceSets.main.compileClasspath.files.each { f ->
            if (!f.name.endsWith('.jar') || !f.exists()) return
            try {
                new java.util.zip.ZipFile(f).withCloseable { zip ->
                    zip.entries().each { e ->
                        if (e.name ==~ /.*KeyMapping.*\.class/
                                || e.name ==~ /.*ClientPacketDistributor\.class/
                                || e.name ==~ /.*PacketDistributor\.class/) {
                            println "  ${e.name}"
                        }
                    }
                }
            } catch (ignored) { }
        }
    }
}
