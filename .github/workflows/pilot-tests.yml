name: pilot tests

on:
  # Restricted to the default branch: every change here arrives via a pull
  # request, so an unrestricted push trigger would run each job twice on the
  # same commit. This keeps post-merge validation without the duplicate.
  push:
    branches:
      - claude/game-expansion-levels-tiles-qya6lh
    paths:
      - 'pilot/**'
      - '.github/workflows/pilot-tests.yml'
  pull_request:
    paths:
      - 'pilot/**'
      - '.github/workflows/pilot-tests.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: pilot

jobs:
  # The suite is designed to run with no display, no API key and no Windows,
  # so the fast feedback loop lives on Linux.
  tests:
    name: headless suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pilot/requirements-dev.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes *.py tests/*.py
      - name: Run tests
        run: python tests/run_all.py

  # Pilot targets Windows, so prove the real dependency set installs there and
  # every module imports. This is the half that cannot be checked on Linux.
  windows:
    name: windows install and import
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pilot/requirements.txt
      - name: Install runtime dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Import every module
        run: python -c "import config, screen, controller, safety, tools, agent, main, ui; print('all modules import on windows')"
      - name: Check DPI awareness applies
        run: python -c "import screen; m = screen.enable_dpi_awareness(); print('dpi mode:', m); assert screen.dpi_awareness_is_usable(m), m"
      # These two go through ctypes into user32, so a wrong struct layout or
      # signature only shows up on the real OS. SendInput returns the number
      # of events it accepted, which is what proves cbSize is right.
      - name: Check unicode key injection reaches user32
        run: python -c "import ctypes, controller as c; assert ctypes.sizeof(c._INPUT) == 40, ctypes.sizeof(c._INPUT); n = c.send_unicode('ab\u2014\u00e9'); print('SendInput accepted', n, 'events'); assert n == 8, n"
      - name: Check horizontal wheel events reach user32
        run: python -c "import controller as c; c.send_hwheel(120); c.send_hwheel(-120); print('MOUSEEVENTF_HWHEEL sent')"
      - name: Run tests
        run: python tests/run_all.py
