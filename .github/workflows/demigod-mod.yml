name: demigod mod jar

# Builds the actual NeoForge mod. This must run on a GitHub runner rather than locally, because
# maven.neoforged.net, libraries.minecraft.net and piston-meta.mojang.com are unreachable from the
# development environment (see demigod/README.md).

on:
  push:
    paths: ['demigod/**', '.github/workflows/demigod-mod.yml']
  workflow_dispatch:

jobs:
  jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: demigod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The exact NeoForge 21.11 patch cannot be checked from the dev environment, so it is
      # resolved here rather than guessed. The chosen version is echoed loudly so it can then be
      # pinned in gradle.properties for reproducibility.
      - name: Resolve the latest NeoForge 21.11.x
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/meta.xml \
            https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml
          echo "--- all 21.11.x versions published ---"
          grep -oP '(?<=<version>)21\.11\.[^<]*' /tmp/meta.xml || echo "(none found)"
          RESOLVED=$(grep -oP '(?<=<version>)21\.11\.[^<]*' /tmp/meta.xml | tail -1)
          if [ -z "$RESOLVED" ]; then
            echo "::error::No 21.11.x NeoForge version exists on maven.neoforged.net"
            echo "--- the newest 20 versions of anything ---"
            grep -oP '(?<=<version>)[^<]*' /tmp/meta.xml | tail -20
            exit 1
          fi
          echo "::notice::Building against NeoForge $RESOLVED"
          sed -i "s/^neo_version=.*/neo_version=$RESOLVED/" gradle.properties
          grep '^neo_version' gradle.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      # Runs regardless of whether the build compiles: if the name is still wrong, this says what
      # it actually is instead of costing another blind round trip.
      - name: Where is Identifier?
        run: gradle whereIsIdentifier --no-daemon --console=plain -q || true

      # Reflection over the classes the custom-entity work needs: real signatures, not guesses.
      # Committed to /dist because job logs get truncated by every tool that reads them; a file
      # in git can be read whole, by any session, with nothing but git.
      - name: Entity and renderer API signatures
        run: |
          gradle describeClass --no-daemon --console=plain -q \
            -Pdescribe=net.minecraft.world.entity.EntityType\$Builder,net.minecraft.client.model.geom.builders.LayerDefinition,net.minecraft.client.model.geom.builders.CubeListBuilder,net.minecraft.client.model.geom.builders.PartDefinition,net.minecraft.client.model.geom.builders.MeshDefinition,net.minecraft.client.model.geom.ModelLayerLocation,net.minecraft.client.model.geom.ModelPart,net.minecraft.client.model.EntityModel,net.minecraft.client.renderer.entity.MobRenderer,net.minecraft.client.renderer.entity.LivingEntityRenderer,net.minecraft.client.renderer.entity.EntityRendererProvider\$Context,net.minecraft.client.renderer.entity.state.LivingEntityRenderState,net.neoforged.neoforge.client.event.EntityRenderersEvent\$RegisterRenderers,net.neoforged.neoforge.client.event.EntityRenderersEvent\$RegisterLayerDefinitions,net.neoforged.neoforge.event.entity.EntityAttributeCreationEvent,net.minecraft.world.entity.monster.Monster,net.minecraft.world.entity.EntityType \
            > /tmp/api_signatures.txt 2>&1 || true
          tail -5 /tmp/api_signatures.txt

      - name: Commit API signatures to /dist
        working-directory: .
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git checkout "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p dist
          cp /tmp/api_signatures.txt dist/API_SIGNATURES.txt
          git add dist/API_SIGNATURES.txt
          git commit -m "CI: entity/renderer API signatures for ${GITHUB_SHA} [skip ci]" || echo "no change"
          git push origin "HEAD:$GITHUB_REF_NAME" || echo "push raced; will retry next run"

      - name: Key mapping and packet distributor classes
        run: gradle keyCategories --no-daemon --console=plain -q || true

      # No --stacktrace: it buries javac's actual errors under 200 lines of Gradle internals,
      # and the log tail is the only part that gets read.
      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon --console=plain 2>&1 | tee /tmp/build.log

      # Runs last on failure so the errors are the final thing in the log, not the first.
      - name: Compile errors
        if: failure()
        run: |
          echo "=============== NeoForge version used ==============="
          grep '^neo_version=' gradle.properties || true
          echo "=============== javac errors ==============="
          grep -nE '\.java:[0-9]+: (error|warning):' /tmp/build.log | head -60 || echo "(no javac errors — failure was elsewhere)"
          echo "=============== what went wrong ==============="
          sed -n '/What went wrong/,/^\* Try:/p' /tmp/build.log | head -40 || true
          echo "=============== last 40 non-Gradle lines ==============="
          grep -v '^\s*at org.gradle' /tmp/build.log | tail -40 || true

      # Write failures back into the repo. Sessions without GitHub API access can then read the
      # compile errors with a plain git pull, which is the only channel guaranteed to work.
      - name: Commit build errors to /dist
        if: failure()
        working-directory: .
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git checkout "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p dist
          {
            echo "BUILD FAILED for ${GITHUB_SHA} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "=============== javac errors ==============="
            grep -nE '\.java:[0-9]+: error:' /tmp/build.log | head -60 || echo "(none matched)"
            echo
            echo "=============== detail ==============="
            grep -B2 -A6 -E '\.java:[0-9]+: error:' /tmp/build.log | head -160 || true
            echo
            echo "=============== what went wrong ==============="
            sed -n '/What went wrong/,/^\* Try:/p' /tmp/build.log | head -40 || true
          } > dist/LAST_BUILD_ERRORS.txt
          git add dist/LAST_BUILD_ERRORS.txt
          git commit -m "CI: build errors for ${GITHUB_SHA} [skip ci]" || echo "no change"
          git push origin "HEAD:$GITHUB_REF_NAME" || echo "push raced; will retry next run"

      - name: Show what was produced
        if: always()
        run: ls -la build/libs || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chronoly-mod-jar
          path: demigod/build/libs/*.jar
          if-no-files-found: error

      # Also commit the jar into the repo. Workflow artifacts live on blob.core.windows.net, which
      # some environments cannot reach; git over github.com is reachable anywhere the repo is.
      # Lands in /dist at the repo root, NOT under demigod/, so committing it does not retrigger
      # this workflow and spin forever.
      - name: Commit the jar to /dist
        if: success()
        working-directory: .
        run: |
          set -euo pipefail
          JAR=$(ls demigod/build/libs/*.jar | head -1)
          echo "publishing $(basename "$JAR")"
          cp "$JAR" /tmp/built.jar

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git checkout "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

          mkdir -p dist
          rm -f dist/*.jar
          cp /tmp/built.jar "dist/$(basename "$JAR")"
          echo "Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILD_INFO.txt

          # Clear a stale failure report. Without this the file survives the fix that resolved it,
          # and anything reading it later chases a problem that no longer exists.
          rm -f dist/LAST_BUILD_ERRORS.txt

          git add -A dist
          if git diff --cached --quiet; then
            echo "jar unchanged; nothing to commit"
          else
            git commit -m "Publish ${{ github.sha }} build to /dist [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

  # DECISIONS.md D-03. Separate job on purpose: the mod hard-depends on GeckoLib, the only 1.21.11
  # build is an alpha, and a break in it must not take down the jar the rest of the project needs.
  geckolib-spike:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: demigod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve NeoForge and GeckoLib versions
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/neo.xml \
            https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml
          NEO=$(grep -oP '(?<=<version>)21\.11\.[^<]*' /tmp/neo.xml | tail -1)
          sed -i "s/^neo_version=.*/neo_version=$NEO/" gradle.properties
          echo "::notice::NeoForge $NEO"

          # GeckoLib publishes ONLY to Cloudsmith, not Maven Central. Non-fatal: if the metadata
          # shape is wrong, let Gradle attempt resolution and name what it searched for, rather
          # than dying here with less information than the build would have given.
          GECKO_BASE=https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib
          for ART in geckolib-neoforge-1.21.11 geckolib-neoforge-1.21.10 geckolib-neoforge; do
            if curl -sSfL -o /tmp/gecko.xml "$GECKO_BASE/$ART/maven-metadata.xml" 2>/dev/null; then
              echo "--- versions published for $ART ---"
              grep -oP '(?<=<version>)[^<]*' /tmp/gecko.xml || true
              LATEST=$(grep -oP '(?<=<version>)[^<]*' /tmp/gecko.xml | tail -1)
              if [ -n "$LATEST" ]; then
                sed -i "s/^geckolib_version=.*/geckolib_version=$LATEST/" gradle.properties
                echo "::notice::GeckoLib $ART $LATEST"
              fi
              break
            else
              echo "no metadata at $GECKO_BASE/$ART/maven-metadata.xml"
            fi
          done
          grep '^geckolib_version' gradle.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: What does GeckoLib actually expose?
        run: gradle geckolibPackages -PwithGeckolib --no-daemon --console=plain -q || true

      - name: Compile against GeckoLib
        run: |
          set -o pipefail
          gradle compileJava -PwithGeckolib --no-daemon --console=plain 2>&1 | tee /tmp/gecko.log

      - name: Spike errors
        if: failure()
        run: |
          echo "=============== javac errors ==============="
          grep -nE '\.java:[0-9]+: error:' /tmp/gecko.log | head -40 || true
          echo "=============== what went wrong ==============="
          sed -n '/What went wrong/,/^\* Try:/p' /tmp/gecko.log | head -30 || true

  # The only job that verifies behaviour rather than compilation: boots a server, loads a world,
  # and runs the @GameTest methods. Non-blocking while it is new — a flaky harness must not stop
  # the jar shipping — but its result is reported plainly.
  gametest:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: demigod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve NeoForge
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/neo.xml \
            https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml
          NEO=$(grep -oP '(?<=<version>)21\.11\.[^<]*' /tmp/neo.xml | tail -1)
          sed -i "s/^neo_version=.*/neo_version=$NEO/" gradle.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      # The @GameTest annotation this project first reached for no longer exists in 1.21.11.
      # Print the real API before trying to use it, the same way Identifier was settled.
      - name: What the GameTest API actually looks like
        run: gradle gameTestApi --no-daemon --console=plain -q || true

      - name: Run GameTests
        run: |
          set -o pipefail
          gradle runGameTestServer -PwithGameTest --no-daemon --console=plain 2>&1 | tee /tmp/gametest.log

      - name: What the tests said
        if: always()
        run: |
          echo "=============== results ==============="
          grep -iE 'test .*(passed|failed)|All required tests passed|tests failed' /tmp/gametest.log | head -40 || true
          echo "=============== failures ==============="
          grep -iE 'Test .*failed|Exception|Caused by' /tmp/gametest.log | head -30 || true
