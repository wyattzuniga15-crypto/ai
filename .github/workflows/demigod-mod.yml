name: demigod mod jar

# Builds the actual NeoForge mod. This must run on a GitHub runner rather than locally, because
# maven.neoforged.net, libraries.minecraft.net and piston-meta.mojang.com are unreachable from the
# development environment (see demigod/README.md).

on:
  push:
    paths: ['demigod/**', '.github/workflows/demigod-mod.yml']
  workflow_dispatch:

jobs:
  jar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demigod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The exact NeoForge 21.11 patch cannot be checked from the dev environment, so it is
      # resolved here rather than guessed. The chosen version is echoed loudly so it can then be
      # pinned in gradle.properties for reproducibility.
      - name: Resolve the latest NeoForge 21.11.x
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/meta.xml \
            https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml
          echo "--- all 21.11.x versions published ---"
          grep -oP '(?<=<version>)21\.11\.[^<]*' /tmp/meta.xml || echo "(none found)"
          RESOLVED=$(grep -oP '(?<=<version>)21\.11\.[^<]*' /tmp/meta.xml | tail -1)
          if [ -z "$RESOLVED" ]; then
            echo "::error::No 21.11.x NeoForge version exists on maven.neoforged.net"
            echo "--- the newest 20 versions of anything ---"
            grep -oP '(?<=<version>)[^<]*' /tmp/meta.xml | tail -20
            exit 1
          fi
          echo "::notice::Building against NeoForge $RESOLVED"
          sed -i "s/^neo_version=.*/neo_version=$RESOLVED/" gradle.properties
          grep '^neo_version' gradle.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build
        run: gradle build --stacktrace --no-daemon

      - name: Show what was produced
        if: always()
        run: ls -la build/libs || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chronoly-mod-jar
          path: demigod/build/libs/*.jar
          if-no-files-found: error

      - name: Compiler output on failure
        if: failure()
        run: |
          find . -name '*.log' -newermt '-30 minutes' -print -exec tail -100 {} \; || true
