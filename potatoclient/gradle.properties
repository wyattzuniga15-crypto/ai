# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric — pinned to the Minecraft 1.21.4 toolchain.
# yarn_mappings / loader_version / fabric_version are the versions Fabric API
# itself ships for 1.21.4, so they are known-good together.
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.1
loader_version=0.16.9
fabric_version=0.119.4+1.21.4
loom_version=1.9.2

# Mod
mod_version=1.0.0
maven_group=dev.potatoclient
archives_base_name=potatoclient

# Optional Mod Menu integration. Set to false if you cannot reach
# maven.terraformersmc.com; the mod still builds and runs, you just lose the
# "Config" button inside Mod Menu (the F9 keybind always works).
enable_modmenu=true
modmenu_version=13.0.3
