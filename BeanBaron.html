<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1d0f08">
<title>Bean Baron</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Bean Baron commits to one look: a dark espresso counter with cream type
     and a burnt-orange accent. Every colour is painted explicitly so the page
     holds up on any host ground. */
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #1d0f08; color: #F6E7CF; }
  body { font-family: Nunito, "Segoe UI", system-ui, -apple-system, sans-serif; font-weight: 500; overscroll-behavior: none; }
  .font-display { font-family: Fredoka, Nunito, "Segoe UI", system-ui, sans-serif; }
  .tabular { font-variant-numeric: tabular-nums; }
  .noselect { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .scroll-soft { scrollbar-width: thin; scrollbar-color: #5a3a26 transparent; }
  button:focus-visible { outline: 3px solid #F2A65A; outline-offset: 2px; }

  @keyframes floatUp {
    0%   { transform: translate(-50%, 0) scale(.85); opacity: 0; }
    15%  { transform: translate(-50%, -10px) scale(1.08); opacity: 1; }
    100% { transform: translate(-50%, -84px) scale(1); opacity: 0; }
  }
  .floater { position: absolute; pointer-events: none; animation: floatUp .85s cubic-bezier(.2,.7,.3,1) forwards; text-shadow: 0 2px 0 #1d0f08; white-space: nowrap; }

  @keyframes steam {
    0%   { transform: translate(var(--sx), 0) scaleX(.7); opacity: 0; }
    25%  { opacity: .55; }
    100% { transform: translate(calc(var(--sx) * 1.8), -64px) scaleX(1.4) scaleY(1.2); opacity: 0; }
  }
  .steam { position: absolute; left: 50%; margin-left: -6px; width: 12px; height: 30px; border-radius: 50%;
           background: rgba(246,231,207,.8); filter: blur(5px); animation: steam 2.6s ease-out infinite; animation-delay: var(--sd); }

  @keyframes pulseOnce {
    0%   { box-shadow: 0 0 0 0 rgba(242,166,90,.9); }
    100% { box-shadow: 0 0 0 22px rgba(242,166,90,0); }
  }
  .pulse-ring { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; animation: pulseOnce .9s ease-out 1 forwards; }

  @keyframes modalIn { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-in { animation: modalIn .25s cubic-bezier(.2,.8,.3,1); }

  @keyframes cupPop { 0% { transform: scale(1); } 40% { transform: scale(.92); } 100% { transform: scale(1); } }
  .cup-pressed { animation: cupPop .16s ease-out; }

  @keyframes wobble {
    0%, 100% { transform: translate(-50%, -50%) rotate(-10deg) scale(1); }
    50%      { transform: translate(-50%, -50%) rotate(10deg) scale(1.1); }
  }
  .gold-bean { animation: wobble 1.1s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(242,166,90,.85)); }

  @keyframes burst {
    0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3); opacity: 0; }
  }
  .burst { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #F2A65A; pointer-events: none; animation: burst .7s cubic-bezier(.1,.8,.3,1) forwards; }

  @keyframes toastIn { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
  .toast-in { animation: toastIn .22s cubic-bezier(.2,.8,.3,1); }

  @keyframes glow { 0%, 100% { box-shadow: 0 8px 0 #6d2c0f, 0 0 24px 4px rgba(242,166,90,.45); } 50% { box-shadow: 0 8px 0 #6d2c0f, 0 0 44px 10px rgba(242,166,90,.75); } }
  .cup-rush { animation: glow 1.2s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .steam, .pulse-ring, .modal-in, .cup-pressed { animation: none; }
    .floater { animation-duration: .01s; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11/dist/index.global.js"></script>

    --color-bean: #1d0f08;

    --color-mocha: #6B4530;
    --color-cream: #F6E7CF;
    --color-latte: #E8D3B2;
    --color-foam: #FFF8EE;
    --color-ember: #D9642A;
    --color-amber: #F2A65A;
    --color-mint: #9CC98B;
  }
</style>

<body class="noselect">

<noscript><p style="padding:2rem;text-align:center">Bean Baron needs JavaScript. Open this file in Safari or Chrome directly.</p></noscript>
<script>
// ---- Bean Baron economy -------------------------------------------------
// Pure game rules: no DOM, no React. The page runs this block verbatim and
// tools/beanbaron_sim.js loads the very same text to balance the numbers.
const BeanBaronEconomy = (() => {
  const GROWTH = 1.15;
  const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  const MILESTONES = [10, 25, 50, 100];
  const EXTRA_MILESTONES = [150, 200, 300, 400];   // unlocked by the Overdrive perk
  const PRESTIGE_UNIT = 1e12;
  const OFFLINE_CAP = 4 * 3600;
  const OFFLINE_BASE = 0.5;
  const RUSH_MULT = 5, RUSH_SECS = 25;
  const FRENZY_MULT = 12, FRENZY_SECS = 15;
  const GOLD_LIFE = 13;                             // seconds a golden bean waits to be tapped
  const TIP_SECS = 300;                             // a big tip is worth up to this much production
  const GOLD_GAP = [180, 360];                      // seconds between golden beans

  const GENS = [
    { id: 'drip',       name: 'Drip Machine', plural: 'Drip Machines', base: 15,     rate: 0.1,   icon: 'Coffee',  blurb: 'A humble pot that never quite goes cold.' },
    { id: 'espresso',   name: 'Espresso Bar', plural: 'Espresso Bars', base: 100,    rate: 1,     icon: 'Zap',     blurb: 'Nine bars of pressure. Twenty-five seconds of hope.' },
    { id: 'barista',    name: 'Barista',      plural: 'Baristas',      base: 1100,   rate: 8,     icon: 'User',    blurb: 'Pours a fern into anything, including soup.' },
    { id: 'roaster',    name: 'Roaster',      plural: 'Roasters',      base: 12e3,   rate: 47,    icon: 'Flame',   blurb: 'Green beans in, first crack out.' },
    { id: 'van',        name: 'Delivery Van', plural: 'Delivery Vans', base: 130e3,  rate: 260,   icon: 'Truck',   blurb: 'Cold brew kegs to every office on the block.' },
    { id: 'franchise',  name: 'Franchise',    plural: 'Franchises',    base: 1.4e6,  rate: 1400,  icon: 'Store',   blurb: 'Same cup, new zip code.' },
    { id: 'plantation', name: 'Plantation',   plural: 'Plantations',   base: 20e6,   rate: 7800,  icon: 'Sprout',  blurb: 'Own the hillside the beans grow on.' },
    { id: 'empire',     name: 'Coffee Empire', plural: 'Coffee Empires', base: 330e6, rate: 44000, icon: 'Crown',  blurb: 'The sun never sets on your roast.' },
  ];

  // Cash upgrades. `kind` says what the multiplier applies to.
  //   price    - every cup sells for more (the "x all" family)
  //   tap      - value of one tap on the cup
  //   offline  - share of production earned while away
  //   gen      - one generator tier (needs `gen`)
  //   tapshare - each tap also brews this fraction of one second of output
  const UPGRADES = [];
  const BEANS = [
    ['Better Beans',      'Swap the bargain sack for something with a farm on the label.'],
    ['Arabica Blend',     'Smoother, sweeter, pricier. Customers notice.'],
    ['Single Origin',     'One farm, one harvest, one very long menu description.'],
    ['Fresh Roast Dates', 'Roasted Tuesday. Sold Wednesday. Bragged about Thursday.'],
    ['House Cold Brew',   'Twelve hours of patience in a keg.'],
    ['Signature Blend',   'Nobody knows what is in it. Everybody orders it.'],
    ['Geisha Reserve',    'Tastes like jasmine and quarterly profit.'],
    ['Barrel-Aged Beans', 'Rested in bourbon oak. Priced like it.'],
    ['Micro-lot Auction', 'You outbid three countries for a single hillside.'],
    ['Cup of Excellence', 'The trophy goes on the wall. The price goes on the board.'],
    ['Competition Roast', 'Your roaster wins nationals. Menus are reprinted.'],
    ['Legendary Harvest', 'A once-in-a-decade crop, and it is all yours.'],
    ['Mythic Bean',       'Grown on a volcano no map shows.'],
    ['Stardust Roast',    'Roasted with light from a distant sun.'],
  ];
  const BEANS_COST0 = 250, BEANS_RATIO = 11;
  BEANS.forEach(([name, desc], i) => UPGRADES.push({
    id: 'beans' + i, name, desc, kind: 'price', mult: 1.5, icon: 'Bean',
    cost: BEANS_COST0 * Math.pow(BEANS_RATIO, i),
    tier: i, family: 'beans',
    effect: 'x1.5 all income',
  }));
  const TAPS = [
    ['Loyalty App',  'Every tenth cup is free. Every cup is bigger.', 'Smartphone', 2,  400],
    ['Double Shot',  'Two shots in every pour, no extra time.',        'Zap',        2,  25e3],
    ['Tip Jar',      'A hand-lettered sign does wonders.',             'Coins',      2,  2e6],
    ['Latte Art',    'A swan on top adds a dollar on the bottom.',     'Sparkles',   2,  150e6],
    ['Golden Tamper','It does nothing. It costs a fortune. Tips triple.', 'Gem',    3,  20e9],
  ];
  TAPS.forEach(([name, desc, icon, mult, cost], i) => UPGRADES.push({
    id: 'tap' + i, name, desc, kind: 'tap', mult, icon, cost, tier: i, family: 'tap',
    effect: 'x' + mult + ' tap value',
  }));
  UPGRADES.push({ id: 'training', name: 'Barista Training', kind: 'tapshare', share: 0.02, icon: 'Hand',
    desc: 'Your own taps now brew a slice of the whole chain\'s output.', cost: 60e3, family: 'tap', tier: 99,
    effect: 'each tap adds 2% of your per-second income' });
  UPGRADES.push({ id: 'nightshift', name: 'Night Shift', kind: 'offline', mult: 1.25, icon: 'Moon',
    desc: 'Someone keeps the lights on while you sleep.', cost: 12e3, family: 'offline', tier: 0,
    effect: 'x1.25 offline earnings' });
  UPGRADES.push({ id: 'weekend', name: 'Weekend Crew', kind: 'offline', mult: 1.2, icon: 'Users',
    desc: 'The shop hums along even when you are not looking.', cost: 5e6, family: 'offline', tier: 1,
    effect: 'x1.2 offline earnings' });
  // Per-generator gear: unlocked by owning enough of the tier.
  const GEAR = [
    ['Paper Filters',     'Gold Filters'],
    ['Steam Wands',       'Dual Boilers'],
    ['Aprons',            'Latte Art School'],
    ['Drum Roaster',      'Fluid-bed Roaster'],
    ['GPS Routing',       'Electric Fleet'],
    ['Drive-thru Lanes',  'Airport Kiosks'],
    ['Shade Trees',       'Terraced Hills'],
    ['Trade Routes',      'Orbital Roastery'],
  ];
  GENS.forEach((g, gi) => {
    UPGRADES.push({ id: g.id + '_gear1', name: GEAR[gi][0], kind: 'gen', gen: gi, mult: 2, icon: g.icon,
      desc: 'Every ' + g.name + ' works twice as hard.', cost: g.base * 25, needs: 5, family: g.id, tier: 0,
      effect: 'x2 ' + g.name + ' output' });
    UPGRADES.push({ id: g.id + '_gear2', name: GEAR[gi][1], kind: 'gen', gen: gi, mult: 2, icon: g.icon,
      desc: 'Serious kit for a serious ' + g.name.toLowerCase() + ' operation.', cost: g.base * 700, needs: 30, family: g.id, tier: 1,
      effect: 'x2 ' + g.name + ' output' });
  });
  const UPG_BY_ID = Object.fromEntries(UPGRADES.map(u => [u.id, u]));

  // Perks are bought with Roast Points. Spending never lowers the +2% bonus,
  // which counts every point ever earned.
  const PERKS = [
    { id: 'headstart', name: 'Head Start',    cost: 1, icon: 'Rocket',   desc: 'Every new chain opens with $2,500 in the till and Better Beans already on the shelf.' },
    { id: 'goldhour',  name: 'Golden Hour',   cost: 2, icon: 'Sun',      desc: 'Golden beans show up 40% more often and wait 5 seconds longer.' },
    { id: 'regulars',  name: 'Regulars',      cost: 2, icon: 'Heart',    desc: 'A crowd that never leaves. +25% all income.' },
    { id: 'deepsleep', name: 'Deep Sleep',    cost: 2, icon: 'BedDouble', desc: 'Away earnings run for 8 hours instead of 4, at +25% rate.' },
    { id: 'memory',    name: 'Muscle Memory', cost: 3, icon: 'Brain',    desc: 'Loyalty App and Barista Training survive selling the chain.' },
    { id: 'sharpnose', name: 'Sharp Nose',    cost: 4, icon: 'Wind',     desc: 'You can smell a good lot a mile off. Bean upgrades cost 30% less.' },
    { id: 'overdrive', name: 'Overdrive',     cost: 5, icon: 'Gauge',    desc: 'Machines keep doubling at 150, 200, 300 and 400 owned.' },
    { id: 'rushhour',  name: 'Rush Hour',     cost: 6, icon: 'Timer',    desc: 'Rush buffs from golden beans last twice as long.' },
  ];
  const PERK_BY_ID = Object.fromEntries(PERKS.map(p => [p.id, p]));

  // Achievements. Each one earned adds +1% to all income (reputation).
  const ACH = [];
  GENS.forEach((g, gi) => {
    ACH.push({ id: g.id + '_1',   name: 'First ' + g.name,      desc: 'Own a ' + g.name.toLowerCase() + '.',         icon: g.icon, test: s => s.owned[gi] >= 1 });
    ACH.push({ id: g.id + '_50',  name: g.plural + ' ×50',       desc: 'Own 50 ' + g.plural.toLowerCase() + '.',      icon: g.icon, test: s => s.owned[gi] >= 50 });
    ACH.push({ id: g.id + '_100', name: g.plural + ' ×100',      desc: 'Own 100 ' + g.plural.toLowerCase() + '.',     icon: g.icon, test: s => s.owned[gi] >= 100 });
  });
  [['earn3', 'Pocket Money', 1e3], ['earn6', 'Millionaire', 1e6], ['earn9', 'Billionaire', 1e9], ['earn12', 'Trillionaire', 1e12], ['earn15', 'Quadrillionaire', 1e15], ['earn18', 'Quintillionaire', 1e18]]
    .forEach(([id, name, n]) => ACH.push({ id, name, desc: 'Earn $' + fmt(n) + ' all time.', icon: 'Wallet', test: s => s.lifetime >= n }));
  [['taps2', 'Warm Fingers', 100], ['taps3', 'Carpal Tunnel', 1000], ['taps4', 'Tap Legend', 10000]]
    .forEach(([id, name, n]) => ACH.push({ id, name, desc: 'Tap the cup ' + fmt(n) + ' times.', icon: 'Hand', test: s => s.taps >= n }));
  [['gold1', 'Lucky Bean', 1], ['gold10', 'Bean Hunter', 10], ['gold50', 'Golden Touch', 50]]
    .forEach(([id, name, n]) => ACH.push({ id, name, desc: 'Catch ' + n + ' golden bean' + (n > 1 ? 's' : '') + '.', icon: 'Star', test: s => s.goldCaught >= n }));
  ACH.push({ id: 'sold1', name: 'Cashed Out', desc: 'Sell the chain once.', icon: 'Sparkles', test: s => s.prestiges >= 1 });
  ACH.push({ id: 'sold3', name: 'Serial Founder', desc: 'Sell the chain three times.', icon: 'Sparkles', test: s => s.prestiges >= 3 });
  ACH.push({ id: 'beans_all', name: 'Connoisseur', desc: 'Buy every bean upgrade in one run.', icon: 'Bean', test: s => BEANS.every((_, i) => s.upgrades['beans' + i]) });
  ACH.push({ id: 'gear_all', name: 'Fully Kitted', desc: 'Install every piece of gear in one run.', icon: 'Wrench', test: s => GENS.every(g => s.upgrades[g.id + '_gear1'] && s.upgrades[g.id + '_gear2']) });
  ACH.push({ id: 'allgens', name: 'Full House', desc: 'Own at least one of every tier.', icon: 'Trophy', test: s => s.owned.every(n => n >= 1) });
  ACH.push({ id: 'rate6', name: 'Cash Machine', desc: 'Earn $1.00M per second.', icon: 'Gauge', test: s => cashPerSec(s) >= 1e6 });
  ACH.push({ id: 'rate9', name: 'Money Printer', desc: 'Earn $1.00B per second.', icon: 'Gauge', test: s => cashPerSec(s) >= 1e9 });

  function newState(now) {
    return {
      v: 1,
      cash: 0,
      owned: GENS.map(() => 0),
      upgrades: {},            // id -> true
      perks: {},               // id -> true, bought with Roast Points
      achievements: {},        // id -> true
      rp: 0,                   // Roast Points ever earned (drives the +2%)
      rpSpent: 0,
      prestiges: 0,
      lifetime: 0,             // all-time cash earned, survives prestige
      runEarned: 0,            // cash earned since last prestige
      cups: 0,                 // all-time cups brewed
      taps: 0,
      goldCaught: 0,
      bestRate: 0,
      playtime: 0,             // seconds of active play
      buffs: { rush: 0, frenzy: 0 },   // playtime at which each buff ends
      gold: null,              // { x, y, until } while a golden bean is on screen
      nextGold: 90,            // playtime at which the next golden bean appears
      events: [],              // one-shot notices for the UI to show, then clear
      savedAt: now,
      awayReport: null,        // { seconds, cash } shown by the "while you were away" modal
    };
  }

  const has = (s, id) => !!s.upgrades[id];
  const perk = (s, id) => !!s.perks[id];
  const rpAvailable = s => s.rp - s.rpSpent;
  const achCount = s => Object.keys(s.achievements).length;
  const buffActive = (s, b) => s.buffs[b] > s.playtime;
  const buffLeft = (s, b) => Math.max(0, s.buffs[b] - s.playtime);

  function genCost(gi, owned, n) {
    const g = GENS[gi];
    return g.base * Math.pow(GROWTH, owned) * (Math.pow(GROWTH, n) - 1) / (GROWTH - 1);
  }
  function maxAffordable(gi, owned, cash) {
    const g = GENS[gi];
    const unit = g.base * Math.pow(GROWTH, owned);
    if (cash < unit) return 0;
    return Math.floor(Math.log(cash * (GROWTH - 1) / unit + 1) / Math.log(GROWTH));
  }
  function milestonesFor(s) { return perk(s, 'overdrive') ? MILESTONES.concat(EXTRA_MILESTONES) : MILESTONES; }
  function milestoneMult(s, owned) {
    let m = 1;
    for (const t of milestonesFor(s)) if (owned >= t) m *= 2;
    return m;
  }
  function nextMilestone(s, owned) {
    for (const t of milestonesFor(s)) if (owned < t) return t;
    return null;
  }
  function gearMult(s, gi) {
    let m = 1;
    for (const u of UPGRADES) if (u.kind === 'gen' && u.gen === gi && has(s, u.id)) m *= u.mult;
    return m;
  }
  function genMult(s, gi) { return milestoneMult(s, s.owned[gi]) * gearMult(s, gi); }
  function genCups(s, gi) { return GENS[gi].rate * s.owned[gi] * genMult(s, gi); }
  function cupsPerSec(s) { let t = 0; for (let i = 0; i < GENS.length; i++) t += genCups(s, i); return t; }
  function priceMult(s) {
    let m = 1;
    for (const u of UPGRADES) if (u.kind === 'price' && has(s, u.id)) m *= u.mult;
    m *= 1 + 0.02 * s.rp;                 // Roast Points
    m *= 1 + 0.01 * achCount(s);          // reputation
    if (perk(s, 'regulars')) m *= 1.25;
    if (buffActive(s, 'rush')) m *= RUSH_MULT;
    return m;
  }
  function cupPrice(s) { return priceMult(s); }
  function cashPerSec(s) { return cupsPerSec(s) * cupPrice(s); }
  function tapMult(s) {
    let m = 1;
    for (const u of UPGRADES) if (u.kind === 'tap' && has(s, u.id)) m *= u.mult;
    if (buffActive(s, 'frenzy')) m *= FRENZY_MULT;
    return m;
  }
  function tapShare(s) {
    let sh = 0;
    for (const u of UPGRADES) if (u.kind === 'tapshare' && has(s, u.id)) sh += u.share;
    return sh;
  }
  function tapValue(s) { return cupPrice(s) * tapMult(s) + tapShare(s) * cashPerSec(s); }
  function offlineMult(s) {
    let m = OFFLINE_BASE;
    for (const u of UPGRADES) if (u.kind === 'offline' && has(s, u.id)) m *= u.mult;
    if (perk(s, 'deepsleep')) m *= 1.25;
    return m;
  }
  function offlineCap(s) { return perk(s, 'deepsleep') ? OFFLINE_CAP * 2 : OFFLINE_CAP; }
  function upgradeCost(s, u) { return u.kind === 'price' && perk(s, 'sharpnose') ? u.cost * 0.7 : u.cost; }
  function rpFor(lifetime) { return Math.floor(Math.sqrt(lifetime / PRESTIGE_UNIT)); }
  function rpGain(s) { return Math.max(0, rpFor(s.lifetime) - s.rp); }
  function prestigeUnlocked(s) { return s.lifetime >= PRESTIGE_UNIT; }

  function upgradeAvailable(s, u) {
    if (has(s, u.id)) return false;
    if (u.kind === 'gen') return s.owned[u.gen] >= u.needs;
    if (u.family === 'beans') return u.tier === 0 || has(s, 'beans' + (u.tier - 1));   // one rung at a time
    if (u.family === 'tap' && u.tier > 0 && u.tier < 99) return has(s, 'tap' + (u.tier - 1));
    if (u.id === 'weekend') return has(s, 'nightshift');
    return true;
  }
  function availableUpgrades(s) { return UPGRADES.filter(u => upgradeAvailable(s, u)).sort((a, b) => upgradeCost(s, a) - upgradeCost(s, b)); }

  // Time until `cost` is affordable at the current rate, in seconds (Infinity if never).
  function timeToAfford(s, cost) {
    if (cost <= s.cash) return 0;
    const r = cashPerSec(s);
    return r > 0 ? (cost - s.cash) / r : Infinity;
  }

  // --- mutations: all return a NEW state object ----------------------------
  function withEvent(s, ev) { return { ...s, events: s.events.concat([ev]) }; }
  function earn(s, amount) {
    return { ...s, cash: s.cash + amount, lifetime: s.lifetime + amount, runEarned: s.runEarned + amount };
  }
  function checkAchievements(s) {
    let n = s;
    for (const a of ACH) {
      if (!n.achievements[a.id] && a.test(n)) {
        n = withEvent({ ...n, achievements: { ...n.achievements, [a.id]: true } }, { type: 'achievement', id: a.id });
      }
    }
    return n;
  }
  // Random draws come from `rng` so the simulator can stay deterministic.
  function step(s, dt, rng) {
    rng = rng || Math.random;
    const cups = cupsPerSec(s) * dt;
    let n = earn(s, cups * cupPrice(s));
    n.cups = s.cups + cups;
    n.playtime = s.playtime + dt;
    const rate = cashPerSec(n);
    if (rate > n.bestRate) n.bestRate = rate;
    // golden beans
    if (n.gold && n.gold.until <= n.playtime) { n.gold = null; }
    if (!n.gold && n.playtime >= n.nextGold) {
      const life = GOLD_LIFE + (perk(n, 'goldhour') ? 5 : 0);

<script>
// ---- Bean Baron scene ---------------------------------------------------
// A little 2D café drawn on a canvas. It is decoration that reads the game:
// what you own decides how many machines, baristas, vans and plants appear
// and how busy the shop is. Nothing here changes the economy.
const BeanBaronScene = (() => {
  const W = 360;
  const NAMES = ['Maya', 'Theo', 'Priya', 'Jonas', 'Amara', 'Kai', 'Lena', 'Diego', 'Noor', 'Felix', 'Sana', 'Milo', 'Ada', 'Ravi', 'June', 'Omar', 'Ivy', 'Luca', 'Zoe', 'Nico', 'Hana', 'Sam', 'Rosa', 'Eli', 'Tomas', 'Wren'];
  const DRINKS = [
    { name: 'latte', color: '#e9c9a3', kind: 'espresso' }, { name: 'cappuccino', color: '#d9b48a', kind: 'espresso' },
    { name: 'flat white', color: '#f0d9bb', kind: 'espresso' }, { name: 'americano', color: '#5b3620', kind: 'espresso' },
    { name: 'mocha', color: '#7a4a2e', kind: 'espresso' }, { name: 'cortado', color: '#c9a077', kind: 'espresso' },
    { name: 'drip coffee', color: '#4a2a16', kind: 'drip' }, { name: 'pour-over', color: '#6a3d22', kind: 'drip' },
    { name: 'cold brew', color: '#3a2214', kind: 'drip' },
  ];
  const SKIN = ['#f2cba7', '#e0aa80', '#c68a5b', '#8d5a3b', '#5c3a25', '#f7dcc3'];
  const HAIR = ['#2b1b12', '#5a3a25', '#c78a3e', '#e8d3a0', '#1a1a1a', '#8a2f1f', '#d94f7a', '#6d6d6d'];
  const SHIRT = ['#3b6ea5', '#d95d39', '#5aa06a', '#8e5bb5', '#e2b53d', '#3f8f9f', '#c94c6d', '#6b6b6b', '#f1f1f1', '#2e2e2e', '#f2a65a'];
  const CARS = ['#d84a4a', '#3e78c2', '#f0c040', '#8fa8b8', '#f6f6f6', '#2c2c2c', '#5fae6a'];
  const rnd = (a, b) => a + Math.random() * (b - a);

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const TABLE_X = [45, 112, 180, 248, 316];

  function layout(H) {
    const extra = Math.max(0, H - 300);
    const bgBottom = Math.round(62 + extra * 0.5);
    const interiorTop = bgBottom + 4;
    const roadH = Math.round(34 + extra * 0.12), walkH = Math.round(16 + extra * 0.08), wallH = 8;
    const interiorBottom = H - roadH - walkH - wallH;
    const backY = interiorTop + 4;          // machines on the back wall
    const laneY = interiorTop + 24;         // where baristas walk
    const counterY = interiorTop + 32;      // counter top edge (14 tall)
    const queueY = counterY + 24;
    const tables = [];
    for (let y = queueY + 30, r = 0; y <= interiorBottom - 26 && r < 3; y += 44, r++) {

      walkY: interiorBottom + wallH + walkH / 2, roadTop: interiorBottom + wallH + walkH,
      lane1: H - roadH + 9 + (roadH - 34) * 0.3, lane2: H - roadH + 24 + (roadH - 34) * 0.7 };
  }

  function create(canvas, getGame, E) {
    const ctx = canvas.getContext('2d');
    const S = {
      t: 0, scale: 1, H: 277, L: layout(277),
      customers: [], baristas: [], vehicles: [], particles: [], log: [],
      machines: [], counts: null, spawnT: 1.5, passT: 2, tapJiggle: 0,
      served: 0, clouds: Array.from({ length: 5 }, (_, i) => ({ x: i * 80 + rnd(0, 40), y: 4 + rnd(0, 18), w: rnd(16, 30), v: rnd(2, 5) })),
    };
    let dpr = 1, cssW = 360, cssH = 277;

    function resize() {
      const r = canvas.getBoundingClientRect();

      for (const b of S.baristas) { b.state = 'idle'; b.customer = null; b.machine = null; b.cup = false; b.y = S.L.laneY; b.home.y = S.L.laneY; }

      rebuildMachines(true);
    }

    function log(text) { S.log.unshift({ text, t: S.t }); S.log.length = Math.min(S.log.length, 6); }

    // Machines along the back wall: drip machines, espresso bars, roasters.
    function rebuildMachines(force) {
      const g = getGame();
      const key = g.owned.join(',');
      if (!force && S.counts === key) return;
      S.counts = key;
      const drips = Math.min(4, g.owned[0]), esp = Math.min(3, g.owned[1]), roast = Math.min(2, g.owned[3]);
      const m = [];
      for (let i = 0; i < drips; i++) m.push({ type: 'drip', x: 112 + i * 20, busy: false, anim: 0 });
      for (let i = 0; i < esp; i++) m.push({ type: 'espresso', x: 202 + i * 30, busy: false, anim: 0 });
      for (let i = 0; i < roast; i++) m.push({ type: 'roaster', x: 306 + i * 30, busy: true, anim: rnd(0, 6) });
      // keep animation phases of survivors
      for (const n of m) { const o = S.machines.find(o => o.type === n.type && o.x === n.x); if (o) { n.anim = o.anim; n.busy = o.busy; } }
      S.machines = m;
      const nb = 1 + (g.owned[2] >= 1 ? 1 : 0) + (g.owned[2] >= 5 ? 1 : 0) + (g.owned[2] >= 20 ? 1 : 0) + (g.owned[2] >= 50 ? 1 : 0);
      while (S.baristas.length < nb) {
        const i = S.baristas.length;
        S.baristas.push({ x: S.L.registerX + 12 + i * 22, y: S.L.laneY, home: { x: S.L.registerX + 12 + i * 22, y: S.L.laneY }, state: 'idle', t: 0, cup: false, skin: pick(SKIN), hair: pick(HAIR), owner: i === 0, walk: 0 });
      }
      while (S.baristas.length > nb) { const b = S.baristas.pop(); if (b.customer) b.customer.state = 'queue'; if (b.machine) b.machine.busy = false; }

      while (vans.length < nv) { const v = { kind: 'van', x: rnd(-60, W + 60), lane: 1, speed: rnd(34, 44), color: '#D9642A', wheel: 0 }; S.vehicles.push(v); vans.push(v); }
      while (vans.length > nv) { const v = vans.pop(); S.vehicles.splice(S.vehicles.indexOf(v), 1); }
      while (S.vehicles.filter(v => v.kind === 'car').length < 2) S.vehicles.push({ kind: 'car', x: rnd(-80, W + 80), lane: Math.random() < 0.5 ? 1 : 2, speed: rnd(38, 60), color: pick(CARS), wheel: 0 });
    }

    // --- people -----------------------------------------------------------
    function person(extra) {
      return Object.assign({ name: pick(NAMES), skin: pick(SKIN), hair: pick(HAIR), shirt: pick(SHIRT), x: 0, y: 0, walk: 0, path: null, t: 0, holding: false, bubble: null, face: 1 }, extra);
    }
    function moveTo(e, tx, ty, speed, dt) {
      const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
      if (d < 0.6) { e.x = tx; e.y = ty; return true; }
      const step = Math.min(d, speed * dt);
      e.x += dx / d * step; e.y += dy / d * step;
      e.walk += dt * 10; if (Math.abs(dx) > 0.2) e.face = dx > 0 ? 1 : -1;
      return d - step < 0.6;
    }
    function followPath(e, speed, dt) {
      if (!e.path || !e.path.length) return true;
      if (moveTo(e, e.path[0].x, e.path[0].y, speed, dt)) e.path.shift();
      return e.path.length === 0;
    }
    const queueSpot = i => ({ x: S.L.registerX + i * 15, y: S.L.queueY });
    function queued() { return S.customers.filter(c => c.state === 'queue' || c.state === 'ordering').sort((a, b) => a.qi - b.qi); }
    function reindexQueue() { queued().forEach((c, i) => { c.qi = i; }); }
    function freeSeat() { const seats = []; for (const t of S.L.tables) for (const s of t.seats) if (!s.taken) seats.push({ t, s }); return seats.length ? pick(seats) : null; }

    function spawnCustomer(rush) {
      const L = S.L;
      const fromLeft = Math.random() < 0.5;
      const q = queued().length;
      const c = person({ drink: pick(DRINKS), x: fromLeft ? -12 : W + 12, y: L.walkY + rnd(-3, 3), state: 'arrive', qi: q });
      if (q >= 8) { c.state = 'passby'; c.path = [{ x: fromLeft ? W + 16 : -16, y: c.y }]; S.customers.push(c); return; }
      c.path = [{ x: L.doorX, y: L.walkY }, { x: L.doorX, y: L.bottomCorridor }, { x: L.aisleX, y: L.bottomCorridor }, { x: L.aisleX, y: L.queueY }, queueSpot(q)];
      c.state = 'arrive';
      S.customers.push(c);
    }
    function spawnPasserby() {
      const fromLeft = Math.random() < 0.5;
      const c = person({ x: fromLeft ? -12 : W + 12, y: S.L.walkY + rnd(-4, 4), state: 'passby' });
      c.path = [{ x: fromLeft ? W + 16 : -16, y: c.y }];
      S.customers.push(c);
    }

    function updatePeople(dt, g, rush) {
      const L = S.L;
      const speed = rush ? 44 : 30;
      for (const c of S.customers) {
        switch (c.state) {
          case 'passby': if (followPath(c, 26, dt)) c.dead = true; break;
          case 'arrive': if (followPath(c, speed, dt)) { c.state = 'queue'; c.bubble = c.drink; log(`${c.name} wants a ${c.drink.name}`); } break;

          case 'ordering': c.face = -1; break;
          case 'served': {
            const seat = Math.random() < 0.7 ? freeSeat() : null;
            if (seat) {

              c.path = [{ x: seat.s.x, y: L.queueY }, { x: seat.s.x, y: seat.s.y }];

          case 'toTable': if (followPath(c, speed, dt)) { c.state = 'sit'; c.t = rnd(7, 16); c.face = c.x < c.table.x ? 1 : -1; } break;
          case 'sit': c.t -= dt; if (c.t <= 0) { c.seat.taken = null; c.table.cup = null; c.holding = false; c.state = 'leave'; c.path = null; log(`${c.name} left happy`); } break;
          case 'leave': {
            if (!c.path) c.path = [{ x: c.x, y: L.bottomCorridor }, { x: L.doorX, y: L.bottomCorridor }, { x: L.doorX, y: L.walkY }, { x: Math.random() < 0.5 ? -16 : W + 16, y: L.walkY + rnd(-3, 3) }];
            if (followPath(c, speed, dt)) c.dead = true;
            break;

      }
      if (S.customers.some(c => c.dead)) { S.customers = S.customers.filter(c => !c.dead); reindexQueue(); }

      // baristas
      const bspeed = rush ? 70 : 46;
      for (const b of S.baristas) {
        b.walk += dt * (b.state === 'toMachine' || b.state === 'back' ? 10 : 0);
        switch (b.state) {
          case 'idle': {
            moveTo(b, b.home.x, b.home.y, bspeed, dt);
            const head = queued().find(c => c.state === 'queue' && c.qi === 0 && Math.abs(c.x - queueSpot(0).x) < 2);
            if (!head) break;
            let m = S.machines.filter(x => !x.busy && x.type === head.drink.kind)[0] || S.machines.filter(x => !x.busy && x.type !== 'roaster')[0] || null;
            if (!m && S.machines.some(x => x.type !== 'roaster')) break;    // all busy: wait
            head.state = 'ordering'; b.customer = head; b.machine = m; b.state = 'toMachine';
            if (m) m.busy = true;

          case 'back': if (moveTo(b, L.registerX + 4, L.laneY, bspeed, dt)) {
            const c = b.customer; b.cup = false; b.state = 'idle'; b.machine = null; b.customer = null;
            if (c && !c.dead) { c.holding = true; c.bubble = null; c.state = 'served'; c.qi = 99; reindexQueue(); S.served++;
              S.particles.push({ kind: 'text', text: '+' + E.fmtCash(E.cupPrice(g), E.cupPrice(g) < 10 ? 1 : undefined), x: L.registerX, y: L.counterY - 4, vy: -14, life: 1 });
              S.particles.push({ kind: 'text', text: '♥', x: c.x, y: c.y - 16, vy: -10, life: 1, color: '#e0506e' });

            break;
          }
        }
        if (b.state === 'brewing' && b.machine) b.machine.anim += dt;
      }

      for (const t of L.tables) { t.cup = null; for (const s of t.seats) if (s.taken && s.taken.state === 'sit') t.cup = s.taken.drink; }
    }

    function updateVehicles(dt) {
      for (const v of S.vehicles) {
        const dir = v.lane === 1 ? 1 : -1;
        v.x += v.speed * dir * dt; v.wheel += v.speed * dt * 0.3;
        if (dir > 0 && v.x > W + 70) { v.x = -70 - rnd(0, 120); if (v.kind === 'van' && Math.random() < 0.35) log('A van left on a delivery run'); }
        if (dir < 0 && v.x < -70) v.x = W + 70 + rnd(0, 120);
      }
    }

    function update(dt) {
      const g = getGame();
      S.t += dt;
      rebuildMachines(false);
      const rush = E.buffActive(g, 'rush');
      const cps = E.cupsPerSec(g);
      // busier shop as the chain grows; capped so it never turns into a mob
      const intensity = clamp(Math.log10(cps + 1) / 4.5, 0, 1);
      const gap = lerp(6.5, 0.8, intensity) / (rush ? 2.2 : 1);
      S.spawnT -= dt;
      if (S.spawnT <= 0) { spawnCustomer(rush); S.spawnT = gap * rnd(0.6, 1.4); }
      S.passT -= dt;
      if (S.passT <= 0) { spawnPasserby(); S.passT = rnd(4, 11); }
      updatePeople(dt, g, rush);
      updateVehicles(dt);
      for (const m of S.machines) if (m.type === 'roaster') m.anim += dt;
      for (const p of S.particles) { p.life -= dt * 0.9; p.y += p.vy * dt; }
      S.particles = S.particles.filter(p => p.life > 0);
      S.tapJiggle = Math.max(0, S.tapJiggle - dt * 4);

        if (!nightShift) { ctx.fillStyle = `rgba(10,8,30,${night * 0.25})`; ctx.fillRect(0, S.L.bgBottom, W, S.L.interiorBottom + 8 - S.L.bgBottom); }
      }
      if (E.buffActive(g, 'rush')) { ctx.fillStyle = `rgba(242,166,90,${0.08 + Math.sin(S.t * 6) * 0.04})`; ctx.fillRect(0, 0, W, S.H); }
      // particles
      ctx.font = 'bold 7px Fredoka, Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const p of S.particles) { ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.color || '#F2A65A'; ctx.fillText(p.text, p.x, p.y); }
      ctx.globalAlpha = 1;
    }

    let raf = 0, last = performance.now();
    function frame(now) {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      if (document.hidden) return;
      update(dt); draw();
    }
    resize();
    raf = requestAnimationFrame(frame);
    canvas.__scene = S;
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(resize) : null;
    if (ro) ro.observe(canvas);

    return {
      resize, state: S,
      tap() { S.tapJiggle = 1; },
      log: S.log,
      served: () => S.served,
      destroy() { cancelAnimationFrame(raf); if (ro) ro.disconnect(); },
    };
  }
  return { create };
})();
// ---- end scene ----------------------------------------------------------
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;
const E = BeanBaronEconomy;
const L = LucideReact;
const Icon = ({ name, ...p }) => { const C = L[name] || L.Coffee; return <C {...p} />; };
const ACH_BY_ID = Object.fromEntries(E.ACH.map(a => [a.id, a]));

// The save file. It lives in this variable for as long as the page does, so
// a reload starts fresh; use "Copy save code" in Stats to carry a game over.
let SAVE_SLOT = null;
const AWAY_MIN = 30;                 // seconds hidden before it counts as time away
const SAVE_EVERY = 5000;

const encodeSave = s => btoa(unescape(encodeURIComponent(JSON.stringify(s))));
function decodeSave(str) {
  try {
    const s = JSON.parse(decodeURIComponent(escape(atob(str.trim()))));
    if (!s || s.v !== 1 || !Array.isArray(s.owned) || s.owned.length !== E.GENS.length) return null;
    return s;
  } catch (e) { return null; }
}
// Older saves lack newer fields; defaults fill the gaps.
function resumeFrom(save) {
  const fresh = E.newState(Date.now());
  const s = { ...fresh, ...save, buffs: { ...fresh.buffs, ...(save.buffs || {}) }, gold: null, events: [], awayReport: null };
  const away = (Date.now() - (save.savedAt || Date.now())) / 1000;
  return away > AWAY_MIN ? E.applyOffline(s, away) : s;
}

// Tiny synth so the shop makes noises without shipping any audio files.
const Sound = (() => {
  let ctx = null, muted = false;
  const ensure = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function blip(freq, dur, type, gain, slide) {
    if (muted) return;
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
  }
  return {
    setMuted: m => { muted = m; if (!m) ensure(); },
    tap: () => blip(480 + Math.random() * 90, 0.07, 'triangle', 0.045, 760),
    buy: () => { blip(660, 0.1, 'square', 0.028, 900); setTimeout(() => blip(990, 0.14, 'square', 0.028, 1320), 60); },
    nope: () => blip(160, 0.12, 'sawtooth', 0.02, 110),
    gold: () => [0, 80, 160, 240].forEach((d, i) => setTimeout(() => blip(880 * Math.pow(1.2, i), 0.22, 'sine', 0.05), d)),
    chime: () => [0, 110].forEach((d, i) => setTimeout(() => blip(i ? 1318 : 1046, 0.3, 'sine', 0.045), d)),
  };
})();

const QTYS = [['1', 'x1'], ['10', 'x10'], ['100', 'x100'], ['max', 'MAX']];
const TABS = [['cafe', 'Café', 'Coffee'], ['shop', 'Shop', 'Store'], ['upgrades', 'Upgrades', 'TrendingUp'], ['prestige', 'Prestige', 'Sparkles'], ['stats', 'Stats', 'BarChart3']];
const TOAST_ICON = { milestone: 'ArrowUpCircle', ach: 'Trophy', gold: 'Star', info: 'Info' };

function rate(n) { return E.fmtCash(n, n < 100 ? 1 : undefined) + '/s'; }

// ---- small building blocks ---------------------------------------------
function FillBar({ ratio }) {
  const w = Math.max(0, Math.min(1, ratio)) * 100;
  return (
    <div className="absolute left-0 right-0 bottom-0 h-1.5 bg-bean/70">
      <div className={"h-full transition-[width] duration-150 ease-out " + (w >= 100 ? 'bg-amber' : 'bg-ember')} style={{ width: w + '%' }} />
    </div>
  );
}

function Card({ onClick, affordable, disabled, pulseKey, children, className }) {
  return (
    <button onClick={onClick} disabled={disabled}
      className={"relative w-full text-left rounded-2xl border overflow-hidden transition-transform duration-100 active:scale-[.98] disabled:active:scale-100 "
        + (affordable ? "bg-roast border-amber/70 shadow-[0_6px_0_#2B170D]" : "bg-espresso border-mocha/50 shadow-[0_4px_0_#150a05]")
        + (disabled ? " opacity-70" : "") + " " + (className || '')}>
      {pulseKey ? <span key={pulseKey} className="pulse-ring" /> : null}
      {children}
    </button>
  );
}

function Modal({ children, onClose }) {
  return (
    <div className="fixed inset-0 z-40 bg-black/70 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-3" onClick={onClose}>
      <div className="modal-in w-full max-w-md bg-roast border border-mocha rounded-3xl p-5 shadow-2xl" onClick={e => e.stopPropagation()} role="dialog" aria-modal="true">
        {children}
      </div>
    </div>
  );
}

function BigButton({ children, onClick, tone, disabled, className }) {
  const tones = {
    ember: "bg-ember text-foam shadow-[0_5px_0_#8a3a12] active:shadow-none active:translate-y-[5px]",
    quiet: "bg-mocha text-cream shadow-[0_5px_0_#2B170D] active:shadow-none active:translate-y-[5px]",
    ghost: "bg-transparent border border-mocha text-latte",
  };
  return (
    <button onClick={onClick} disabled={disabled}
      className={"font-display font-semibold text-lg rounded-2xl px-5 py-3 transition-all duration-75 disabled:opacity-40 disabled:shadow-none disabled:translate-y-0 " + tones[tone || 'ember'] + " " + (className || '')}>
      {children}
    </button>
  );
}

// Cash ticks toward its real value every frame instead of jumping 30 times a second.
function SmoothCash({ value }) {
  const [shown, setShown] = useState(value);
  const target = useRef(value); target.current = value;
  const cur = useRef(value);
  useEffect(() => {
    let raf;
    const loop = () => {
      raf = requestAnimationFrame(loop);
      const t = target.current, c = cur.current;
      if (c === t) return;
      const d = t - c;
      const next = Math.abs(d) < Math.max(0.005, Math.abs(t) * 1e-7) ? t : c + d * 0.22;
      cur.current = next; setShown(next);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);
  return <span>{E.fmtCash(shown)}</span>;
}

function BuffChip({ icon, label, left }) {
  return (
    <span className="inline-flex items-center gap-1 text-xs font-bold text-espresso bg-amber rounded-full px-2.5 py-1 tabular toast-in">
      <Icon name={icon} size={13} /> {label} · {Math.ceil(left)}s
    </span>
  );
}

// ---- the café scene --------------------------------------------------------
function Cafe({ gameRef, sceneRef }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const sc = BeanBaronScene.create(canvasRef.current, () => gameRef.current, E);
    sceneRef.current = sc;
    return () => { sc.destroy(); if (sceneRef.current === sc) sceneRef.current = null; };
  }, []);
  return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full block" aria-label="Your café" />;
}

function Ticker({ sceneRef }) {
  const [, force] = useState(0);
  useEffect(() => { const id = setInterval(() => force(n => n + 1), 700); return () => clearInterval(id); }, []);
  const log = sceneRef.current ? sceneRef.current.log : [];
  const served = sceneRef.current ? sceneRef.current.served() : 0;
  return (
    <div className="shrink-0 h-20 bg-espresso border-t border-mocha/50 px-3 py-2 text-xs leading-4 text-latte/80 flex flex-col justify-start gap-0.5 overflow-hidden">
      <div className="flex justify-between text-[10px] uppercase tracking-widest text-latte/50"><span>On the floor</span>{served > 0 && <span className="text-amber tabular normal-case tracking-normal">{served} order{served === 1 ? '' : 's'} served</span>}</div>
      {log.length === 0 && <div className="text-latte/50">The doors are open. Customers wander in as the chain grows.</div>}
      {log.slice(0, 3).map((l, i) => <div key={l.t + l.text} className={"truncate " + (i === 0 ? 'text-foam' : i === 1 ? 'text-latte/70' : 'text-latte/45')}>{l.text}</div>)}
    </div>
  );
}

// ---- the game ------------------------------------------------------------
function App() {
  const [game, setGame] = useState(() => SAVE_SLOT ? resumeFrom(SAVE_SLOT) : E.newState(Date.now()));
  const [tab, setTab] = useState('shop');
  const [qty, setQty] = useState('1');
  const [floaters, setFloaters] = useState([]);
  const [bursts, setBursts] = useState([]);
  const [pulses, setPulses] = useState({});
  const [toasts, setToasts] = useState([]);
  const [muted, setMuted] = useState(false);
  const [confirmPrestige, setConfirmPrestige] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const gameRef = useRef(game); gameRef.current = game;
  const sceneRef = useRef(null);
  const heroRef = useRef(null);
  const seq = useRef(0);

  // One requestAnimationFrame loop, delta-time based. Renders are committed at
  // ~30 Hz; a gap longer than AWAY_MIN means the tab was hidden, which is paid
  // out at the offline rate instead of the live one.
  useEffect(() => {
    let last = performance.now(), acc = 0, raf = 0;
    const loop = now => {
      raf = requestAnimationFrame(loop);
      const dt = (now - last) / 1000; last = now;
      if (dt > AWAY_MIN) { setGame(g => E.applyOffline(g, dt)); acc = 0; return; }
      acc += dt;
      if (acc >= 1 / 30) { const d = Math.min(acc, 5); acc = 0; setGame(g => E.step(g, d)); }
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);

  // Autosave into the in-memory slot.
  useEffect(() => {
    const save = () => { SAVE_SLOT = { ...gameRef.current, savedAt: Date.now(), awayReport: null, events: [], gold: null }; };
    const id = setInterval(save, SAVE_EVERY);
    const vis = () => { if (document.hidden) save(); };
    document.addEventListener('visibilitychange', vis);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', vis); };
  }, []);

  const showToast = useCallback((text, kind) => {
    const id = ++seq.current;
    setToasts(t => [...t.slice(-1), { id, text, kind: kind || 'info' }]);
    setTimeout(() => setToasts(t => t.filter(o => o.id !== id)), 2600);
  }, []);

  // Drain one-shot events the rules produced: milestones, achievements, golden beans.
  useEffect(() => {
    if (!game.events.length) return;
    for (const ev of game.events) {
      if (ev.type === 'milestone') { showToast(`${E.GENS[ev.gen].plural} doubled at ${ev.at}!`, 'milestone'); Sound.chime(); }
      else if (ev.type === 'achievement') { showToast(`${ACH_BY_ID[ev.id].name} · +1% income`, 'ach'); Sound.chime(); }
      else if (ev.type === 'gold') { showToast(ev.text, 'gold'); }
    }
    setGame(g => g.events.length ? { ...g, events: [] } : g);
  }, [game.events, showToast]);

  // Pulse anything that just became affordable.
  const prevAff = useRef(null);
  useEffect(() => {
    const now = {};
    for (const u of E.availableUpgrades(game)) now[u.id] = E.upgradeCost(game, u) <= game.cash;
    E.GENS.forEach((g, i) => { now['g' + i] = E.genCost(i, game.owned[i], 1) <= game.cash; });
    if (prevAff.current) {
      let changed = null;
      for (const id in now) if (now[id] && !prevAff.current[id]) (changed ||= {})[id] = Date.now();
      if (changed) setPulses(p => ({ ...p, ...changed }));
    }
    prevAff.current = now;
  }, [game]);

  const spawnFloater = useCallback((text, x, y, big) => {
    const id = ++seq.current;
    setFloaters(f => [...f.slice(-14), { id, x, y, text, big }]);
    setTimeout(() => setFloaters(f => f.filter(o => o.id !== id)), 900);
  }, []);

  const onTap = useCallback((xp, yp) => {
    const v = E.tapValue(gameRef.current);
    setGame(g => E.tap(g)[0]);
    const x = xp != null ? xp : 50 + (Math.random() * 2 - 1) * 22;
    const y = yp != null ? yp : 50 + (Math.random() * 2 - 1) * 6;
    spawnFloater('+' + E.fmtCash(v, v < 10 ? 1 : v < 1000 ? 0 : undefined), x + (Math.random() * 2 - 1) * 6, y);
    if (sceneRef.current) sceneRef.current.tap();
    Sound.tap();
    if (navigator.vibrate) navigator.vibrate(8);
  }, [spawnFloater]);
  const onHeroTap = useCallback(e => {
    if (e.button != null && e.button !== 0) return;
    const r = heroRef.current ? heroRef.current.getBoundingClientRect() : null;
    if (!r) return onTap();
    onTap(Math.max(6, Math.min(94, (e.clientX - r.left) / r.width * 100)), Math.max(10, Math.min(92, (e.clientY - r.top) / r.height * 100)));
  }, [onTap]);

  // Space bar taps too.
  useEffect(() => {
    const onKey = e => {
      if (e.code !== 'Space' || e.repeat) return;
      const t = e.target && e.target.tagName;
      if (t === 'TEXTAREA' || t === 'INPUT') return;
      e.preventDefault(); onTap();      // even with a button focused: space always brews
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onTap]);

  const onGold = useCallback(() => {
    const g = gameRef.current; if (!g.gold) return;
    const { x, y } = g.gold;
    setGame(s => E.catchGold(s) || s);
    const id = ++seq.current;
    setBursts(b => [...b, { id, x, y, parts: Array.from({ length: 10 }, (_, i) => ({ dx: Math.cos(i / 10 * Math.PI * 2) * (40 + Math.random() * 40), dy: Math.sin(i / 10 * Math.PI * 2) * (40 + Math.random() * 40) })) }]);
    setTimeout(() => setBursts(b => b.filter(o => o.id !== id)), 800);
    Sound.gold();
    if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
  }, []);

  const buyGen = gi => {
    const q = qty === 'max' ? 'max' : +qty;
    if (E.buyGen(gameRef.current, gi, q)) { setGame(g => E.buyGen(g, gi, q) || g); Sound.buy(); } else Sound.nope();
  };
  const buyUpgrade = id => {
    if (E.buyUpgrade(gameRef.current, id)) { setGame(g => E.buyUpgrade(g, id) || g); Sound.buy(); } else Sound.nope();
  };
  const buyPerk = id => {
    if (E.buyPerk(gameRef.current, id)) { setGame(g => E.buyPerk(g, id) || g); Sound.chime(); showToast(E.PERK_BY_ID[id].name + ' unlocked', 'ach'); }
  };
  const doPrestige = () => { setGame(g => E.prestige(g, Date.now()) || g); setConfirmPrestige(false); setTab('prestige'); showToast('Chain sold. Fresh start, stronger beans', 'gold'); Sound.gold(); };
  const doReset = () => { SAVE_SLOT = null; setGame(E.newState(Date.now())); setConfirmReset(false); setTab('shop'); };
  const toggleMute = () => { setMuted(m => { Sound.setMuted(!m); return !m; }); };

  const cps = E.cashPerSec(game);
  const tapV = E.tapValue(game);
  const rush = E.buffActive(game, 'rush'), frenzy = E.buffActive(game, 'frenzy');

  // A hint under the cup that follows what the player should do next.
  const hint = useMemo(() => {
    if (game.gold) return { text: 'A golden bean! Grab it before it rolls away.', hot: true };
    if (rush) return { text: `Rush hour: ×${E.RUSH_MULT} income for ${Math.ceil(E.buffLeft(game, 'rush'))}s`, hot: true };
    if (frenzy) return { text: `Tap frenzy: ×${E.FRENZY_MULT} per tap for ${Math.ceil(E.buffLeft(game, 'frenzy'))}s`, hot: true };
    if (game.owned.every(n => n === 0)) return { text: game.cash >= 15 ? 'A Drip Machine is affordable in the Shop' : 'Tap to brew · a Drip Machine costs $15' };
    const cheapUpg = E.availableUpgrades(game).find(u => E.upgradeCost(game, u) <= game.cash);
    if (cheapUpg && tab !== 'upgrades' && tab !== 'cafe') return { text: `${cheapUpg.name} is affordable in Upgrades` };
    if (E.rpGain(game) > 0 && tab !== 'prestige' && tab !== 'cafe') return { text: `Sell the chain for +${E.rpGain(game)} Roast Point${E.rpGain(game) > 1 ? 's' : ''}` };
    return { text: 'tap anywhere to brew', idle: true };
  }, [game, tab, rush, frenzy]);

  return (
    <div className="mx-auto max-w-md h-dvh flex flex-col bg-bean sm:border-x sm:border-mocha/40">
      {/* header */}
      <header className="px-4 pt-[max(env(safe-area-inset-top),12px)] pb-2 bg-espresso border-b border-mocha/50 shadow-[0_4px_12px_rgba(0,0,0,.35)] z-10">
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-2 text-amber">
            <Icon name="Bean" size={18} />
            <span className="font-display font-semibold tracking-wide">Bean Baron</span>
          </div>
          <div className="flex items-center gap-2">
            {game.rp > 0 && (
              <div className="flex items-center gap-1 text-xs text-amber bg-roast rounded-full px-2.5 py-1 border border-amber/40 tabular">
                <Icon name="Sparkles" size={13} /> {game.rp} RP · +{game.rp * 2}%
              </div>
            )}
            <button onClick={toggleMute} aria-label={muted ? 'Unmute' : 'Mute'} className="text-latte/60 hover:text-latte p-1 rounded-full"><Icon name={muted ? 'VolumeX' : 'Volume2'} size={18} /></button>
          </div>
        </div>
        <div className="font-display font-bold text-4xl tabular leading-tight mt-1 text-foam"><SmoothCash value={game.cash} /></div>
        <div className="text-latte/80 text-sm tabular flex items-center gap-2 flex-wrap min-h-[26px]">
          <span className={rush ? 'text-amber font-bold' : ''}>{rate(cps)}</span>
          <span className="text-latte/50">·</span>
          <span className={frenzy ? 'text-amber font-bold' : ''}>{E.fmtCash(tapV, tapV < 10 ? 1 : undefined)} per tap</span>
          {rush && <BuffChip icon="Flame" label={'×' + E.RUSH_MULT} left={E.buffLeft(game, 'rush')} />}
          {frenzy && <BuffChip icon="Zap" label={'×' + E.FRENZY_MULT + ' taps'} left={E.buffLeft(game, 'frenzy')} />}
        </div>
      </header>

      <div className="relative flex-1 min-h-0 flex flex-col">
        {/* toasts */}
        <div className="absolute bottom-2 left-3 right-3 z-30 flex flex-col gap-1.5 pointer-events-none">
          {toasts.map(t => (
            <div key={t.id} className={"toast-in flex items-center gap-2 rounded-2xl px-3.5 py-2 text-xs font-bold shadow-xl leading-tight " + (t.kind === 'gold' ? 'bg-amber text-espresso' : 'bg-foam text-espresso')}>
              <Icon name={TOAST_ICON[t.kind]} size={15} className={"shrink-0 " + (t.kind === 'gold' ? '' : 'text-ember')} /> <span>{t.text}</span>
            </div>
          ))}
        </div>

        {/* the café */}
        <section className={"relative shrink-0 flex flex-col " + (tab === 'cafe' ? 'flex-1 min-h-0' : 'h-72')}>
          <div ref={heroRef} onPointerDown={onHeroTap} className="relative flex-1 min-h-0 overflow-hidden bg-bean cursor-pointer">
            <Cafe gameRef={gameRef} sceneRef={sceneRef} />
            {floaters.map(f => (
              <span key={f.id} className={"floater font-display font-bold text-amber " + (frenzy ? 'text-3xl' : 'text-2xl')} style={{ left: f.x + '%', top: f.y + '%' }}>{f.text}</span>
            ))}
            <div className={"absolute top-2 left-2 right-12 text-xs tracking-wide truncate rounded-full px-3 py-1 bg-bean/70 backdrop-blur-[2px] w-fit max-w-full " + (hint.hot ? 'text-amber font-bold' : hint.idle ? 'text-latte/80 uppercase' : 'text-latte/90')}>{hint.text}</div>
            <button onPointerDown={e => e.stopPropagation()} onClick={() => setTab(tab === 'cafe' ? 'shop' : 'cafe')} aria-label={tab === 'cafe' ? 'Back to the shop' : 'Open the café view'}
              className="absolute top-1.5 right-2 w-8 h-8 rounded-full bg-bean/70 text-latte/80 flex items-center justify-center backdrop-blur-[2px]">
              <Icon name={tab === 'cafe' ? 'Minimize2' : 'Maximize2'} size={16} />
            </button>
          </div>
          {tab === 'cafe' && <Ticker sceneRef={sceneRef} />}
        </section>

        {/* tab panel */}
        {tab !== 'cafe' && <main className="flex-1 min-h-0 overflow-y-auto scroll-soft px-3 pt-3 pb-4">
          {tab === 'shop' && <Shop game={game} qty={qty} setQty={setQty} buy={buyGen} pulses={pulses} />}
          {tab === 'upgrades' && <Upgrades game={game} buy={buyUpgrade} pulses={pulses} />}
          {tab === 'prestige' && <Prestige game={game} onSell={() => setConfirmPrestige(true)} buyPerk={buyPerk} />}
          {tab === 'stats' && <Stats game={game} setGame={setGame} showToast={showToast} onReset={() => setConfirmReset(true)} />}
        </main>}

        {/* golden bean */}
        {game.gold && (
          <button aria-label="Golden bean" onPointerDown={onGold}
            className="gold-bean absolute z-30 w-16 h-16 rounded-full flex items-center justify-center"
            style={{ left: game.gold.x + '%', top: game.gold.y + '%',
              background: `conic-gradient(#F2A65A ${Math.max(0, (game.gold.until - game.playtime) / game.gold.life) * 360}deg, rgba(43,23,13,.6) 0)` }}>
            <span className="w-[52px] h-[52px] rounded-full bg-gradient-to-b from-[#ffd27a] to-[#e08a2a] text-espresso flex items-center justify-center shadow-inner">
              <Icon name="Bean" size={30} strokeWidth={2.4} />
            </span>
          </button>
        )}
        {bursts.map(b => b.parts.map((p, i) => (
          <span key={b.id + '-' + i} className="burst z-30" style={{ left: b.x + '%', top: b.y + '%', '--dx': p.dx + 'px', '--dy': p.dy + 'px' }} />
        )))}
      </div>

      {/* bottom tabs */}
      <nav className="shrink-0 bg-espresso border-t border-mocha/60 pb-[env(safe-area-inset-bottom)] grid grid-cols-5">
        {TABS.map(([id, label, icon]) => {
          const on = tab === id;
          const badge = (id === 'prestige' && (E.rpGain(game) > 0 || E.PERKS.some(p => !game.perks[p.id] && p.cost <= E.rpAvailable(game))))
            || (id === 'upgrades' && tab !== 'upgrades' && E.availableUpgrades(game).some(u => E.upgradeCost(game, u) <= game.cash));
          return (
            <button key={id} onClick={() => setTab(id)} aria-current={on ? 'page' : undefined}
              className={"relative flex flex-col items-center gap-0.5 py-2.5 text-[11px] font-bold uppercase tracking-wider transition-colors " + (on ? "text-amber" : "text-latte/60")}>
              <span className={"rounded-full px-4 py-1 transition-colors " + (on ? "bg-roast" : "")}><Icon name={icon} size={20} /></span>
              {label}
              {badge && <span className="absolute top-1.5 right-1/2 translate-x-5 w-2.5 h-2.5 rounded-full bg-amber shadow-[0_0_8px_#F2A65A]" />}
            </button>
          );
        })}
      </nav>

      {game.awayReport && game.awayReport.cash > 0 && (
        <Modal onClose={() => setGame(g => ({ ...g, awayReport: null }))}>
          <div className="flex items-center gap-2 text-amber mb-2"><Icon name="Moon" size={20} /><span className="text-xs font-bold uppercase tracking-widest">While you were away</span></div>
          <h2 className="font-display font-bold text-2xl text-foam mb-1">The shop kept brewing.</h2>
          <p className="text-latte/85">You were gone {E.fmtTime(game.awayReport.seconds)}{game.awayReport.capped ? ` (credited for the first ${E.fmtTime(game.awayReport.cap)})` : ''}. Your chain sold at {Math.round(E.offlineMult(game) * 100)}% speed and earned</p>
          <div className="font-display font-bold text-4xl text-amber tabular my-3">{E.fmtCash(game.awayReport.cash)}</div>
          <BigButton onClick={() => setGame(g => ({ ...g, awayReport: null }))} className="w-full">Collect</BigButton>
        </Modal>
      )}

      {confirmPrestige && (
        <Modal onClose={() => setConfirmPrestige(false)}>
          <div className="flex items-center gap-2 text-amber mb-2"><Icon name="Sparkles" size={20} /><span className="text-xs font-bold uppercase tracking-widest">Sell the chain</span></div>
          <h2 className="font-display font-bold text-2xl text-foam mb-2">Walk away with {E.rpGain(game)} Roast Point{E.rpGain(game) === 1 ? '' : 's'}?</h2>
          <p className="text-latte/85 mb-3">Everything goes: cash, every machine, every upgrade{E.perk(game, 'memory') ? ' except the ones Muscle Memory keeps' : ''}. You keep Roast Points, perks and achievements, and every point makes every cup worth 2% more, forever.</p>
          <div className="grid grid-cols-2 gap-2 text-sm mb-4">
            <div className="bg-espresso rounded-xl p-3"><div className="text-latte/60 text-xs uppercase tracking-wider">Now</div><div className="font-display text-xl text-foam">{game.rp} RP · +{game.rp * 2}%</div></div>
            <div className="bg-espresso rounded-xl p-3 border border-amber/50"><div className="text-amber text-xs uppercase tracking-wider">After</div><div className="font-display text-xl text-amber">{game.rp + E.rpGain(game)} RP · +{(game.rp + E.rpGain(game)) * 2}%</div></div>
          </div>
          <div className="flex gap-2">
            <BigButton tone="ghost" onClick={() => setConfirmPrestige(false)} className="flex-1">Keep brewing</BigButton>
            <BigButton onClick={doPrestige} className="flex-1">Sell it</BigButton>
          </div>
        </Modal>
      )}

      {confirmReset && (
        <Modal onClose={() => setConfirmReset(false)}>
          <h2 className="font-display font-bold text-2xl text-foam mb-2">Start over from nothing?</h2>
          <p className="text-latte/85 mb-4">This wipes the whole game, Roast Points and achievements included. Copy your save code first if you might want it back.</p>
          <div className="flex gap-2">
            <BigButton tone="ghost" onClick={() => setConfirmReset(false)} className="flex-1">Cancel</BigButton>
            <BigButton onClick={doReset} className="flex-1">Wipe it</BigButton>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ---- Shop ----------------------------------------------------------------
function Eta({ game, cost }) {
  const t = E.timeToAfford(game, cost);
  if (t <= 0 || !isFinite(t) || t > 30 * 86400) return null;
  return <div className="text-[10px] text-latte/50 tabular">in {E.fmtTime(t)}</div>;
}

function Shop({ game, qty, setQty, buy, pulses }) {
  const firstUnowned = game.owned.findIndex(n => n === 0);
  const visible = firstUnowned < 0 ? E.GENS.length : Math.min(E.GENS.length, firstUnowned + 2);
  const price = E.cupPrice(game);
  return (
    <div className="flex flex-col gap-2.5">
      <div className="flex items-center justify-between">
        <span className="text-xs font-bold uppercase tracking-widest text-latte/60">Buy</span>
        <div className="flex bg-espresso rounded-full p-1 border border-mocha/50">
          {QTYS.map(([q, label]) => (
            <button key={q} onClick={() => setQty(q)}
              className={"px-3 py-1 rounded-full text-xs font-bold tracking-wide transition-colors " + (qty === q ? "bg-ember text-foam" : "text-latte/70")}>{label}</button>
          ))}
        </div>
      </div>
      {E.GENS.slice(0, visible).map((g, gi) => {
        const owned = game.owned[gi];
        const locked = firstUnowned >= 0 && gi === firstUnowned + 1;
        const n = qty === 'max' ? Math.max(1, E.maxAffordable(gi, owned, game.cash)) : +qty;
        const cost = E.genCost(gi, owned, n);
        const affordable = cost <= game.cash;
        const mult = E.genMult(game, gi);
        const each = g.rate * mult * price;
        const next = E.nextMilestone(game, owned);
        if (locked) {
          return (
            <div key={g.id} className="relative rounded-2xl border border-dashed border-mocha/50 bg-espresso/50 px-4 py-3 flex items-center gap-3 text-latte/50">
              <span className="w-11 h-11 rounded-xl bg-bean flex items-center justify-center"><Icon name="Lock" size={20} /></span>
              <div>
                <div className="font-display font-semibold text-latte/70">{g.name}</div>
                <div className="text-xs">Opens once you own a {E.GENS[gi - 1].name.toLowerCase()}.</div>
              </div>
            </div>
          );
        }
        return (
          <Card key={g.id} onClick={() => buy(gi)} affordable={affordable} pulseKey={pulses['g' + gi]}>
            <div className="flex items-center gap-3 px-3 py-3 pb-4">
              <span className={"w-12 h-12 shrink-0 rounded-xl flex items-center justify-center " + (affordable ? "bg-ember text-foam" : "bg-bean text-latte/70")}><Icon name={g.icon} size={26} /></span>
              <div className="min-w-0 flex-1">
                <div className="flex items-baseline gap-2">
                  <span className="font-display font-semibold text-lg text-foam truncate">{g.name}</span>
                  <span className="text-xs text-latte/60 tabular">×{mult}</span>
                </div>
                <div className="text-xs text-latte/70 tabular truncate">
                  {rate(each)} each{owned > 0 && <span> · {rate(each * owned)} total</span>}
                </div>
                <div className="text-[11px] text-latte/50 tabular mt-0.5">
                  {next ? `${owned}/${next} → ×2 at ${next}` : 'All milestones reached'}
                </div>
              </div>
              <div className="text-right shrink-0">
                <div className="font-display font-bold text-3xl tabular leading-none text-foam">{owned}</div>
                <div className={"text-sm font-bold tabular mt-1 " + (affordable ? "text-amber" : "text-latte/60")}>{E.fmtCash(cost)}</div>
                {affordable ? <div className="text-[10px] text-latte/50 uppercase tracking-wider">buy {n}</div> : <Eta game={game} cost={cost} />}
              </div>
            </div>
            <FillBar ratio={game.cash / cost} />
          </Card>
        );
      })}
      <p className="text-center text-xs text-latte/40 px-6 pt-1">{E.GENS[firstUnowned < 0 ? E.GENS.length - 1 : Math.max(0, firstUnowned)].blurb}</p>
    </div>
  );
}

// ---- Upgrades ------------------------------------------------------------
function Upgrades({ game, buy, pulses }) {
  const list = E.availableUpgrades(game);
  const bought = E.UPGRADES.filter(u => E.has(game, u.id));
  return (
    <div className="flex flex-col gap-2.5">
      <div className="flex items-center justify-between">
        <span className="text-xs font-bold uppercase tracking-widest text-latte/60">Available</span>
        <span className="text-xs text-latte/50 tabular">{bought.length}/{E.UPGRADES.length} owned</span>
      </div>
      {list.length === 0 && <div className="text-center text-latte/50 py-8">Nothing on the shelf right now. Own more machines to unlock their gear.</div>}
      {list.map(u => {
        const cost = E.upgradeCost(game, u);
        const affordable = cost <= game.cash;
        return (
          <Card key={u.id} onClick={() => buy(u.id)} affordable={affordable} pulseKey={pulses[u.id]}>
            <div className="flex items-center gap-3 px-3 py-3 pb-4">
              <span className={"w-12 h-12 shrink-0 rounded-xl flex items-center justify-center " + (affordable ? "bg-amber text-espresso" : "bg-bean text-latte/70")}><Icon name={u.icon} size={24} /></span>
              <div className="min-w-0 flex-1">
                <div className="font-display font-semibold text-lg text-foam leading-tight">{u.name}</div>
                <div className="text-xs font-bold text-mint">{u.effect}</div>
                <div className="text-xs text-latte/60 leading-snug mt-0.5">{u.desc}</div>
              </div>
              <div className="text-right shrink-0">
                <div className={"font-bold tabular " + (affordable ? "text-amber" : "text-latte/60")}>{E.fmtCash(cost)}</div>
                {!affordable && <Eta game={game} cost={cost} />}
              </div>
            </div>
            <FillBar ratio={game.cash / cost} />
          </Card>
        );
      })}
      {bought.length > 0 && (
        <div className="mt-2">
          <div className="text-xs font-bold uppercase tracking-widest text-latte/60 mb-1.5">Installed</div>
          <div className="flex flex-wrap gap-1.5">
            {bought.map(u => <span key={u.id} className="text-xs bg-espresso border border-mocha/50 text-latte/80 rounded-full px-2.5 py-1 flex items-center gap-1"><Icon name="Check" size={12} className="text-mint" />{u.name}</span>)}
          </div>
        </div>
      )}
    </div>
  );
}

// ---- Prestige ------------------------------------------------------------
function Prestige({ game, onSell, buyPerk }) {
  const unlocked = E.prestigeUnlocked(game);
  const gain = E.rpGain(game);
  const total = E.rpFor(game.lifetime);
  const nextAt = Math.pow(total + 1, 2) * E.PRESTIGE_UNIT;
  const prog = unlocked ? (game.lifetime - Math.pow(total, 2) * E.PRESTIGE_UNIT) / (nextAt - Math.pow(total, 2) * E.PRESTIGE_UNIT) : game.lifetime / E.PRESTIGE_UNIT;
  const avail = E.rpAvailable(game);
  return (
    <div className="flex flex-col gap-3">
      <div className="rounded-3xl bg-gradient-to-b from-roast to-espresso border border-mocha/60 p-5 text-center">
        <div className="text-xs font-bold uppercase tracking-widest text-amber flex items-center justify-center gap-1"><Icon name="Sparkles" size={14} /> Roast Points</div>
        <div className="font-display font-bold text-6xl text-foam tabular mt-1">{game.rp}</div>
        <div className="text-latte/80">+{game.rp * 2}% on every cup, forever</div>
        {game.rp > 0 && <div className="text-xs text-latte/50 tabular mt-1">{avail} unspent · {game.rpSpent} in perks</div>}
      </div>

      <div className="rounded-2xl bg-espresso border border-mocha/50 p-4">
        <div className="flex justify-between text-sm">
          <span className="text-latte/70">Lifetime earnings</span>
          <span className="font-bold tabular text-foam">{E.fmtCash(game.lifetime)}</span>
        </div>
        <div className="h-3 rounded-full bg-bean mt-2 overflow-hidden">
          <div className="h-full bg-gradient-to-r from-ember to-amber transition-[width] duration-300" style={{ width: Math.min(100, prog * 100) + '%' }} />
        </div>
        <div className="text-xs text-latte/60 mt-1.5 tabular">
          {unlocked ? `Next point at ${E.fmtCash(nextAt)}` : `Sell unlocks at ${E.fmtCash(E.PRESTIGE_UNIT)} lifetime earnings`}
          {!unlocked && isFinite(E.timeToAfford(game, E.PRESTIGE_UNIT - game.lifetime + game.cash)) && ` · about ${E.fmtTime(E.timeToAfford(game, E.PRESTIGE_UNIT - game.lifetime + game.cash))} at this rate`}
        </div>
      </div>

      <div className="rounded-2xl bg-roast border border-amber/40 p-4 flex items-center justify-between">
        <div>
          <div className="text-xs uppercase tracking-widest text-latte/60">If you sell now</div>
          <div className={"font-display font-bold text-3xl tabular " + (gain > 0 ? "text-amber" : "text-latte/50")}>+{gain} RP</div>
        </div>
        <div className="text-right text-xs text-latte/60 tabular">
          <div>{game.rp} → {game.rp + gain} RP</div>
          <div>+{game.rp * 2}% → +{(game.rp + gain) * 2}%</div>
        </div>
      </div>

      <BigButton onClick={onSell} disabled={!unlocked || gain <= 0} className="w-full flex items-center justify-center gap-2">
        {unlocked ? (gain > 0 ? <>Sell the Chain</> : <>Earn more before selling</>) : <><Icon name="Lock" size={18} /> Locked until $1.00T earned</>}
      </BigButton>
      <div className="text-center text-xs text-latte/50">
        Selling resets cash, machines and upgrades. Points banked: √(lifetime ÷ $1T). Sold {game.prestiges} time{game.prestiges === 1 ? '' : 's'} so far.
      </div>

      <div className="flex items-center justify-between mt-2">
        <span className="text-xs font-bold uppercase tracking-widest text-latte/60">Perks</span>
        <span className="text-xs text-amber tabular font-bold">{avail} RP to spend</span>
      </div>
      <p className="text-xs text-latte/60 -mt-1">Spend Roast Points on permanent perks. Spending never shrinks your +2% bonus.</p>
      {E.PERKS.map(p => {
        const owned = !!game.perks[p.id];
        const can = !owned && p.cost <= avail;
        return (
          <Card key={p.id} onClick={() => !owned && buyPerk(p.id)} affordable={can} disabled={owned} className={owned ? 'opacity-100' : ''}>
            <div className="flex items-center gap-3 px-3 py-3">
              <span className={"w-12 h-12 shrink-0 rounded-xl flex items-center justify-center " + (owned ? "bg-mint text-espresso" : can ? "bg-amber text-espresso" : "bg-bean text-latte/70")}><Icon name={owned ? 'Check' : p.icon} size={24} /></span>
              <div className="min-w-0 flex-1">
                <div className="font-display font-semibold text-lg text-foam leading-tight">{p.name}</div>
                <div className="text-xs text-latte/70 leading-snug mt-0.5">{p.desc}</div>
              </div>
              <div className={"text-right shrink-0 font-bold tabular " + (owned ? "text-mint text-xs uppercase" : can ? "text-amber" : "text-latte/50")}>{owned ? 'owned' : p.cost + ' RP'}</div>
            </div>
          </Card>
        );
      })}
    </div>
  );
}

// ---- Stats ---------------------------------------------------------------
function Stats({ game, setGame, showToast, onReset }) {
  const [showImport, setShowImport] = useState(false);
  const [code, setCode] = useState('');
  const [exported, setExported] = useState(null);
  const [showAch, setShowAch] = useState(true);
  const cps = E.cashPerSec(game);
  const achN = E.achCount(game);
  const rows = [
    ['Cash on hand', E.fmtCash(game.cash)],
    ['Income', rate(cps)],
    ['Best income', rate(game.bestRate)],
    ['Cups per second', E.fmt(E.cupsPerSec(game), 1)],
    ['Price per cup', E.fmtCash(E.cupPrice(game), 2)],
    ['Tap value', E.fmtCash(E.tapValue(game), 2)],
    ['Cups brewed', E.fmt(game.cups)],
    ['Taps', E.fmt(game.taps)],
    ['Golden beans caught', game.goldCaught],
    ['Earned this run', E.fmtCash(game.runEarned)],
    ['Earned all time', E.fmtCash(game.lifetime)],
    ['Time played', E.fmtTime(game.playtime)],
    ['Offline rate', Math.round(E.offlineMult(game) * 100) + '% for up to ' + E.fmtTime(E.offlineCap(game))],
    ['Reputation', '+' + achN + '% from achievements'],
    ['Roast Points', game.rp + ' (+' + game.rp * 2 + '%)'],
    ['Chains sold', game.prestiges],
  ];
  const copySave = async () => {
    const s = encodeSave({ ...game, savedAt: Date.now(), awayReport: null, events: [], gold: null });
    try { await navigator.clipboard.writeText(s); showToast('Save code copied'); }
    catch (e) { setExported(s); }
  };
  const loadSave = () => {
    const s = decodeSave(code);
    if (!s) { showToast('That code did not read as a Bean Baron save'); return; }
    setGame(resumeFrom(s)); setCode(''); setShowImport(false); showToast('Save loaded');
  };
  return (
    <div className="flex flex-col gap-3">
      <div className="rounded-2xl bg-espresso border border-mocha/50 divide-y divide-mocha/30">
        {rows.map(([k, v]) => (
          <div key={k} className="flex justify-between px-4 py-2 text-sm"><span className="text-latte/70">{k}</span><span className="font-bold tabular text-foam">{v}</span></div>
        ))}
      </div>

      <button onClick={() => setShowAch(v => !v)} className="flex items-center justify-between mt-1">
        <span className="text-xs font-bold uppercase tracking-widest text-latte/60">Achievements · {achN}/{E.ACH.length}</span>
        <Icon name={showAch ? 'ChevronUp' : 'ChevronDown'} size={16} className="text-latte/60" />
      </button>
      {showAch && (
        <div className="grid grid-cols-2 gap-2">
          {E.ACH.map(a => {
            const on = !!game.achievements[a.id];
            return (
              <div key={a.id} className={"rounded-xl border px-3 py-2 flex items-center gap-2 " + (on ? "bg-roast border-amber/50" : "bg-espresso/60 border-mocha/30 opacity-50")}>
                <span className={"w-8 h-8 shrink-0 rounded-lg flex items-center justify-center " + (on ? "bg-amber text-espresso" : "bg-bean text-latte/60")}><Icon name={a.icon} size={16} /></span>
                <div className="min-w-0">
                  <div className="text-xs font-bold text-foam leading-tight">{a.name}</div>
                  <div className="text-[11px] text-latte/60 leading-tight">{a.desc}</div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div className="text-xs font-bold uppercase tracking-widest text-latte/60 mt-1">The chain</div>
      <div className="rounded-2xl bg-espresso border border-mocha/50 divide-y divide-mocha/30">
        {E.GENS.map((g, gi) => {
          const c = E.genCups(game, gi) * E.cupPrice(game);
          const share = cps > 0 ? c / cps : 0;
          return (
            <div key={g.id} className="px-4 py-2 text-sm">
              <div className="flex justify-between"><span className="flex items-center gap-2 text-latte/85"><Icon name={g.icon} size={16} className="text-amber" />{g.name} <span className="text-latte/50 tabular">×{game.owned[gi]}</span></span><span className="font-bold tabular text-foam">{rate(c)}</span></div>
              <div className="h-1 rounded-full bg-bean mt-1.5 overflow-hidden"><div className="h-full bg-ember" style={{ width: share * 100 + '%' }} /></div>
            </div>
          );
        })}
      </div>

      <div className="text-xs font-bold uppercase tracking-widest text-latte/60 mt-1">Save</div>
      <p className="text-xs text-latte/60 -mt-1">Your game autosaves in memory while this page is open. Copy a save code to keep it across reloads or move it to another device.</p>
      <div className="grid grid-cols-2 gap-2">
        <BigButton tone="quiet" onClick={copySave} className="text-base flex items-center justify-center gap-2"><Icon name="ClipboardCopy" size={18} /> Copy save code</BigButton>
        <BigButton tone="quiet" onClick={() => setShowImport(v => !v)} className="text-base flex items-center justify-center gap-2"><Icon name="Upload" size={18} /> Load save code</BigButton>
      </div>
      {exported && (
        <div className="rounded-2xl bg-espresso border border-mocha/50 p-3 text-xs">
          <div className="text-latte/70 mb-1">Clipboard was unavailable. Copy this by hand:</div>
          <textarea readOnly value={exported} onFocus={e => e.target.select()} className="w-full h-20 bg-bean text-latte rounded-lg p-2 font-mono text-[10px]" />
        </div>
      )}
      {showImport && (
        <div className="rounded-2xl bg-espresso border border-mocha/50 p-3 flex flex-col gap-2">
          <textarea value={code} onChange={e => setCode(e.target.value)} placeholder="Paste a save code" className="w-full h-20 bg-bean text-latte rounded-lg p-2 font-mono text-[10px] placeholder:text-latte/40" />
          <BigButton onClick={loadSave} disabled={!code.trim()} className="text-base">Load</BigButton>
        </div>
      )}
      <button onClick={onReset} className="text-xs text-latte/50 underline underline-offset-4 py-2 flex items-center justify-center gap-1"><Icon name="RotateCcw" size={12} /> Start over from nothing</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
