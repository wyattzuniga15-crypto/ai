function Orders({ game, qty, setQty, buyStock, onFill }) {
  const orders = game.orders || [];
  const mult = E.streakMult(game);
  const nextIn = Math.max(0, (game.nextOrder || 0) - game.playtime);
  return (
    <div className="flex flex-col gap-2.5">
      <div className="rounded-2xl bg-gradient-to-b from-roast to-espresso border border-mocha/60 p-4 flex items-center justify-between">
        <div>
          <div className="text-xs font-bold uppercase tracking-widest text-amber flex items-center gap-1"><Icon name="Receipt" size={14} /> Order board</div>
          <div className="font-display font-bold text-3xl text-foam tabular">{orders.length}<span className="text-latte/50 text-lg">/{E.ORDER_MAX}</span> <span className="text-base text-latte/70 font-semibold">open</span></div>
        </div>
        <div className="text-right text-xs text-latte/70 tabular">
          <div className={game.streak > 0 ? 'text-amber font-bold' : ''}>streak ×{mult.toFixed(2)}{game.streak > 0 ? ` · ${game.streak} in a row` : ''}</div>
          <div>{game.ordersFilled || 0} filled · {game.ordersMissed || 0} missed</div>
          {orders.length < E.ORDER_MAX && <div className="text-latte/50">next customer in {E.fmtTime(nextIn)}</div>}
        </div>
      </div>
      {orders.length === 0 && (
        <div className="rounded-2xl bg-espresso border border-dashed border-mocha/50 p-5 text-center text-latte/60 text-sm">
          Nobody is ordering right now. The next ticket arrives in <span className="text-foam font-bold tabular">{E.fmtTime(nextIn)}</span>. Stock up below so you can give it straight away.
        </div>
      )}
      {orders.map(o => <OrderCard key={o.id} game={game} o={o} onFill={onFill} />)}
      <div className="flex items-center justify-between mt-2">
        <span className="text-xs font-bold uppercase tracking-widest text-latte/60">Buy</span>
        <QtyToggle qty={qty} setQty={setQty} />
      </div>
      <Pantry game={game} qty={qty} buyStock={buyStock} />
      <p className="text-xs text-latte/50 px-1">Each order pays its ingredients ×3 plus six seconds of your income, times your streak. A ticket that runs out resets the streak.</p>
    </div>
  );
}

// ---- order tickets ---------------------------------------------------------
function Ticket({ game, o, onFill }) {
  const total = o.expires - o.created, left = Math.max(0, o.expires - game.playtime), frac = total > 0 ? left / total : 0;
  const missing = E.orderMissing(game, o);
  const missKeys = Object.keys(missing);
  const fillable = missKeys.length === 0;
  const missCost = fillable ? 0 : E.orderMissingCost(game, o);
  const canBuy = !fillable && missCost <= game.cash;
  const payout = o.reward * E.streakMult(game);
  return (
    <button onClick={() => onFill(o.id, !fillable)} disabled={!fillable && !canBuy}
      className={"relative shrink-0 w-[168px] text-left rounded-xl border px-2.5 pt-2 pb-3 overflow-hidden transition-transform active:scale-[.97] disabled:active:scale-100 "
        + (fillable ? "bg-roast border-mint/70" : canBuy ? "bg-roast border-amber/60" : "bg-espresso border-mocha/50")}>
      <div className="flex justify-between items-baseline text-[11px]"><span className="font-bold text-foam truncate">{o.vip && <Icon name="Star" size={10} className="inline text-amber -mt-0.5 mr-0.5" />}{o.name}{o.vip ? ' · critic' : ''}</span><span className={"tabular " + (left < 15 ? 'text-ember font-bold' : 'text-latte/60')}>{Math.ceil(left)}s</span></div>
      <div className="mt-1 flex flex-col gap-0.5">
        {o.items.map(it => { const r = E.RECIPE_BY_ID[it.recipe]; return (
          <div key={it.recipe} className="flex items-center gap-1 text-xs text-latte/90"><Icon name={r.icon} size={12} className="text-amber shrink-0" /><span className="tabular">{it.n}×</span><span className="truncate">{r.name}</span></div>
        ); })}
      </div>
      {!fillable && <div className="text-[10px] text-amber mt-1 leading-tight">need {missKeys.map(k => `${missing[k]} ${E.ING_BY_ID[k].name.toLowerCase()}`).join(', ')}</div>}
      <div className="mt-1.5 flex items-baseline justify-between gap-1">
        <span className="font-display font-bold text-sm tabular text-foam">{E.fmtCash(payout, payout < 100 ? 2 : undefined)}</span>
        <span className="text-[9px] text-latte/50 uppercase tracking-wider">payout</span>
      </div>
      <div className={"text-[10px] font-bold uppercase tracking-wider truncate " + (fillable ? 'text-mint' : canBuy ? 'text-amber' : 'text-latte/40')}>{fillable ? 'tap to fill' : canBuy ? `buy ${E.fmtCash(missCost, missCost < 100 ? 2 : undefined)} & fill` : `need ${E.fmtCash(missCost, missCost < 100 ? 2 : undefined)} more`}</div>
      <div className="absolute left-0 right-0 bottom-0 h-1.5 bg-bean/70"><div className={"h-full " + (left < 15 ? 'bg-ember' : 'bg-amber/80')} style={{ width: frac * 100 + '%' }} /></div>
    </button>
  );
}

function OrderRail({ game, onFill }) {
  const [open, setOpen] = useState(true);
  const orders = game.orders || [];
  const mult = E.streakMult(game);
  return (
    <div className="shrink-0 bg-white/92 backdrop-blur-[3px] border-t border-mocha px-2 pt-1.5 pb-[max(env(safe-area-inset-bottom),8px)]">
      <button onPointerDown={e => e.stopPropagation()} onClick={() => setOpen(v => !v)} className="w-full flex justify-between items-center text-[10px] uppercase tracking-widest text-latte px-1 mb-1">
        <span className="flex items-center gap-1"><Icon name="Receipt" size={11} /> Tickets {orders.length}/{E.ORDER_MAX}</span>
        <span className="flex items-center gap-2"><span className={game.streak > 0 ? 'text-amber' : ''}>streak ×{mult.toFixed(2)}{game.streak > 0 ? ` · ${game.streak} in a row` : ''}</span><Icon name={open ? 'ChevronDown' : 'ChevronUp'} size={12} /></span>
      </button>
      {open && (
        <div onPointerDown={e => e.stopPropagation()} className="flex gap-2 overflow-x-auto scroll-soft pb-0.5 h-[108px] items-start">
          {orders.length === 0 && <div className="text-xs text-latte/50 px-1 py-3">No open tickets. Customers order every half minute or so; stock the pantry in the Shop so you can fill them fast.</div>}
          {orders.map(o => <Ticket key={o.id} game={game} o={o} onFill={onFill} />)}
        </div>
      )}
    </div>
  );
}

function SideButton({ icon, label, onClick, dot, badge }) {
  return (
    <button onPointerDown={e => e.stopPropagation()} onClick={onClick}
      className="relative w-14 h-14 rounded-2xl bg-white shadow-[0_3px_0_#c9d3de] flex flex-col items-center justify-center gap-0.5 active:translate-y-[2px] active:shadow-none">
      <Icon name={icon} size={22} className="text-foam" />
      <span className="text-[9px] font-bold uppercase tracking-wide text-latte">{label}</span>
      {dot && !badge && <span className="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-[#ff5c5c] border-2 border-white" />}
      {badge > 0 && <span className="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-[#ff5c5c] text-white text-[10px] font-bold flex items-center justify-center border-2 border-white">{badge}</span>}
    </button>
  );
}

function Sheet({ title, onClose, children }) {
  return (
    <div className="absolute inset-0 z-40 bg-black/40 flex items-end justify-center" onClick={onClose}>
      <div className="modal-in w-full max-h-[88%] bg-espresso rounded-t-3xl shadow-2xl flex flex-col" onClick={e => e.stopPropagation()} role="dialog" aria-modal="true">
        <div className="shrink-0 flex items-center justify-between px-4 pt-3 pb-2 border-b border-mocha">
          <h2 className="font-display font-bold text-2xl text-foam">{title}</h2>
          <button onClick={onClose} aria-label="Close" className="w-10 h-10 rounded-xl bg-[#ff5c5c] text-white font-display font-bold text-lg shadow-[0_3px_0_#c73c3c] active:translate-y-[2px] active:shadow-none">X</button>
        </div>
        {children}
      </div>
    </div>
  );
}

const PANEL_TITLES = { shop: 'Shop', staff: 'Staff', orders: 'Orders', upgrades: 'Upgrades', prestige: 'Sell the Chain', stats: 'Stats & settings' };

// ---- the game ------------------------------------------------------------
function App() {
  const [game, setGame] = useState(() => SAVE_SLOT ? resumeFrom(SAVE_SLOT) : E.newState(Date.now()));
  const [tab, setTab] = useState('shop');
  const [qty, setQty] = useState('1');
  const [floaters, setFloaters] = useState([]);
  const [bursts, setBursts] = useState([]);
  const [pulses, setPulses] = useState({});
  const [toasts, setToasts] = useState([]);
  const [muted, setMuted] = useState(false);
  const [music, setMusic] = useState(true);
  const [heroH, setHeroH] = useState(UI_PREFS.heroH);
  const drag = useRef(null);
  useEffect(() => { UI_PREFS.heroH = heroH; }, [heroH]);
  const heroMax = () => Math.min(560, Math.round((window.innerHeight || 800) * 0.62));
  const onGripDown = useCallback(e => { drag.current = { y: e.clientY, h: heroH }; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} }, [heroH]);
  const onGripMove = useCallback(e => { if (!drag.current) return; setHeroH(Math.max(HERO_MIN, Math.min(heroMax(), drag.current.h + (e.clientY - drag.current.y)))); }, []);
  const onGripUp = useCallback(() => { drag.current = null; }, []);
  const toggleHero = useCallback(() => setHeroH(h => h > HERO_MIN + 40 ? HERO_MIN : HERO_DEFAULT), []);
  const musicRef = useRef(true);
  const [confirmPrestige, setConfirmPrestige] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const [confirmMove, setConfirmMove] = useState(false);
  const gameRef = useRef(game); gameRef.current = game;
  const sceneRef = useRef(null);
  const heroRef = useRef(null);
  const mainRef = useRef(null);
  const seq = useRef(0);
  useEffect(() => { if (mainRef.current) mainRef.current.scrollTop = 0; }, [tab]);

  // One requestAnimationFrame loop, delta-time based. Renders are committed at
  // ~30 Hz; a gap longer than AWAY_MIN means the tab was hidden, which is paid
  // out at the offline rate instead of the live one.
  useEffect(() => {
    let last = performance.now(), acc = 0, raf = 0;
    const loop = now => {
      raf = requestAnimationFrame(loop);
      const dt = (now - last) / 1000; last = now;
      if (dt > AWAY_MIN) { setGame(g => E.applyOffline(g, dt)); acc = 0; return; }
      acc += dt;
      if (acc >= 1 / 30) { const d = Math.min(acc, 5); acc = 0; setGame(g => E.step(g, d)); }
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);

  // Autosave into the in-memory slot.
  useEffect(() => {
    const save = () => { SAVE_SLOT = { ...gameRef.current, savedAt: Date.now(), awayReport: null, events: [], gold: null }; };
    const id = setInterval(save, SAVE_EVERY);
    const vis = () => { if (document.hidden) save(); };
    document.addEventListener('visibilitychange', vis);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', vis); };
  }, []);

  const showToast = useCallback((text, kind) => {
    const id = ++seq.current;
    setToasts(t => [...t.slice(-1), { id, text, kind: kind || 'info' }]);
    setTimeout(() => setToasts(t => t.filter(o => o.id !== id)), 2600);
  }, []);

  const confetti = useCallback((x, y, count) => {
    const id = ++seq.current;
    setBursts(b => [...b, { id, x, y, parts: Array.from({ length: count || 18 }, (_, i) => ({ dx: Math.cos(i / (count || 18) * Math.PI * 2) * (50 + Math.random() * 70), dy: Math.sin(i / (count || 18) * Math.PI * 2) * (50 + Math.random() * 70) - 30 })) }]);
    setTimeout(() => setBursts(b => b.filter(o => o.id !== id)), 900);
  }, []);
  // Drain one-shot events the rules produced: milestones, achievements, golden beans.
  useEffect(() => {
    if (!game.events.length) return;
    for (const ev of game.events) {
      if (ev.type === 'milestone') { showToast(`${E.GENS[ev.gen].plural} doubled at ${ev.at}!`, 'milestone'); Sound.chime(); }
      else if (ev.type === 'achievement') { showToast(`${ACH_BY_ID[ev.id].name} · +1% income`, 'ach'); Sound.chime(); }
      else if (ev.type === 'gold') { showToast(ev.text, 'gold'); }
      else if (ev.type === 'cafe') { showToast(`Welcome to your ${E.CAFES[ev.tier].name}`, 'gold'); Sound.gold(); confetti(50, 45, 24); }
      else if (ev.type === 'order-new') { showToast(`New ticket from ${ev.name}`, 'order'); Sound.bell(); }
      else if (ev.type === 'order-filled') { showToast(`${ev.vip ? 'The critic ' : ''}${ev.name} paid ${E.fmtCash(ev.payout)}`, 'gold'); Sound.chime(); if (sceneRef.current) sceneRef.current.cheer('+' + E.fmtCash(ev.payout)); }
      else if (ev.type === 'review') { showToast(ev.text, 'gold'); Sound.gold(); confetti(50, 40, 20); }
      else if (ev.type === 'staff') { const r = E.STAFF_BY_ID[ev.id]; showToast(ev.level > 1 ? `${r.name} promoted to level ${ev.level}` : `${r.name} hired`, 'ach'); Sound.chime(); }
      else if (ev.type === 'order-missed') { showToast(`${ev.name} gave up waiting. Streak reset.`, 'miss'); Sound.nope(); }
    }
    setGame(g => g.events.length ? { ...g, events: [] } : g);
  }, [game.events, showToast, confetti]);

  // Pulse anything that just became affordable.
  const prevAff = useRef(null);
  useEffect(() => {
    const now = {};
    for (const u of E.availableUpgrades(game)) now[u.id] = E.upgradeCost(game, u) <= game.cash;
    E.GENS.forEach((g, i) => { now['g' + i] = !E.cafeFull(game, i) && E.genCost(i, game.owned[i], 1) <= game.cash; });
    const nx = E.nextCafe(game); now.cafe = !!nx && nx.cost <= game.cash;
    for (const r of E.STAFF) { const sn = E.staffNext(game, r.id); now['staff_' + r.id] = !!sn && sn.cost <= game.cash; }
    if (prevAff.current) {
      let changed = null;
      for (const id in now) if (now[id] && !prevAff.current[id]) (changed ||= {})[id] = Date.now();
      if (changed) setPulses(p => ({ ...p, ...changed }));
    }
    prevAff.current = now;
  }, [game]);

  const spawnFloater = useCallback((text, x, y, big) => {
    const id = ++seq.current;
    setFloaters(f => [...f.slice(-14), { id, x, y, text, big }]);
    setTimeout(() => setFloaters(f => f.filter(o => o.id !== id)), 900);
  }, []);

  const onTap = useCallback((xp, yp) => {
    const v = E.tapValue(gameRef.current);
    setGame(g => E.tap(g)[0]);
    const x = xp != null ? xp : 50 + (Math.random() * 2 - 1) * 22;
    const y = yp != null ? yp : 50 + (Math.random() * 2 - 1) * 6;
    spawnFloater('+' + E.fmtCash(v, v < 10 ? 1 : v < 1000 ? 0 : undefined), x + (Math.random() * 2 - 1) * 6, y);
    if (sceneRef.current) sceneRef.current.tap();
    Sound.tap();
    if (navigator.vibrate) navigator.vibrate(8);
  }, [spawnFloater]);
  const onHeroTap = useCallback(e => {
    if (e.button != null && e.button !== 0) return;
    const r = heroRef.current ? heroRef.current.getBoundingClientRect() : null;
    if (!r) return onTap();
    const xp = (e.clientX - r.left) / r.width * 100, yp = (e.clientY - r.top) / r.height * 100;
    if (sceneRef.current) sceneRef.current.poke(xp, yp);
    onTap(Math.max(6, Math.min(94, xp)), Math.max(10, Math.min(92, yp)));
  }, [onTap]);

  // Space bar taps too.
  useEffect(() => {
    const onKey = e => {
      if (e.code !== 'Space' || e.repeat) return;
      const t = e.target && e.target.tagName;
      if (t === 'TEXTAREA' || t === 'INPUT') return;
      e.preventDefault(); onTap();      // even with a button focused: space always brews
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onTap]);

  const onGold = useCallback(() => {
    const g = gameRef.current; if (!g.gold) return;
    const { x, y } = g.gold;
    setGame(s => E.catchGold(s) || s);
    const id = ++seq.current;
    setBursts(b => [...b, { id, x, y, parts: Array.from({ length: 10 }, (_, i) => ({ dx: Math.cos(i / 10 * Math.PI * 2) * (40 + Math.random() * 40), dy: Math.sin(i / 10 * Math.PI * 2) * (40 + Math.random() * 40) })) }]);
    setTimeout(() => setBursts(b => b.filter(o => o.id !== id)), 800);
    Sound.gold();
    if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
  }, []);

  const buyGen = gi => {
    const q = qty === 'max' ? 'max' : +qty;
    if (E.buyGen(gameRef.current, gi, q)) { setGame(g => E.buyGen(g, gi, q) || g); Sound.buy(); } else Sound.nope();
  };
  const buyUpgrade = id => {
    if (E.buyUpgrade(gameRef.current, id)) { setGame(g => E.buyUpgrade(g, id) || g); Sound.buy(); } else Sound.nope();
  };
  const buyStock = id => {
    const q = qty === 'max' ? 'max' : +qty;
    if (E.buyStock(gameRef.current, id, q)) { setGame(g => E.buyStock(g, id, q) || g); Sound.buy(); } else Sound.nope();
  };
  const fillOrder = (id, buyMissing) => {
    if (E.fillOrder(gameRef.current, id, buyMissing)) setGame(g => E.fillOrder(g, id, buyMissing) || g); else Sound.nope();
  };
  const hire = id => {
    if (E.hireStaff(gameRef.current, id)) { setGame(g => E.hireStaff(g, id) || g); Sound.buy(); } else Sound.nope();
  };
  const buyPerk = id => {
    if (E.buyPerk(gameRef.current, id)) { setGame(g => E.buyPerk(g, id) || g); Sound.chime(); showToast(E.PERK_BY_ID[id].name + ' unlocked', 'ach'); }
  };
  const doMove = () => { setGame(g => E.expandCafe(g) || g); setConfirmMove(false); setTab('cafe'); };
  const doPrestige = () => { setGame(g => E.prestige(g, Date.now()) || g); setConfirmPrestige(false); setTab('prestige'); showToast('Chain sold. Fresh start, stronger beans', 'gold'); Sound.gold(); confetti(50, 45, 28); };
  const doReset = () => { SAVE_SLOT = null; setGame(E.newState(Date.now())); setConfirmReset(false); setTab('shop'); };
  const toggleMute = () => { setMuted(m => { Sound.setMuted(!m); return !m; }); };
  const toggleMusic = () => { setMusic(m => { const on = !m; musicRef.current = on; if (on) Music.start(); else Music.stop(); return on; }); };
  // browsers only allow audio after a gesture: the first tap anywhere starts the music
  useEffect(() => {
    const first = () => { if (musicRef.current) Music.start(); window.removeEventListener('pointerdown', first); window.removeEventListener('keydown', first); };
    window.addEventListener('pointerdown', first); window.addEventListener('keydown', first);
    return () => { window.removeEventListener('pointerdown', first); window.removeEventListener('keydown', first); };
  }, []);

  const cps = E.cashPerSec(game);
  const tapV = E.tapValue(game);
  const rush = E.buffActive(game, 'rush'), frenzy = E.buffActive(game, 'frenzy'), review = E.buffActive(game, 'review');
  useEffect(() => { Music.setTempo(rush ? 108 : 84); }, [rush]);

  // A hint under the cup that follows what the player should do next.
  const hint = useMemo(() => {
    if (game.gold) return { text: 'A golden bean! Grab it before it rolls away.', hot: true };
    if (rush) return { text: `Rush hour: ×${E.RUSH_MULT} income for ${Math.ceil(E.buffLeft(game, 'rush'))}s`, hot: true };
    if (frenzy) return { text: `Tap frenzy: ×${E.FRENZY_MULT} per tap for ${Math.ceil(E.buffLeft(game, 'frenzy'))}s`, hot: true };
    if (game.owned.every(n => n === 0)) return { text: game.cash >= 15 ? 'A Drip Machine is affordable in the Shop' : 'Tap to brew · a Drip Machine costs $15' };
    const ready = (game.orders || []).find(o => E.canFill(game, o));
    if (ready) return { text: `${ready.name}'s ticket is ready · tap Orders`, hot: true };
    const nx = E.nextCafe(game);
    if (nx && nx.cost <= game.cash && E.GENS.some((g, i) => E.cafeFull(game, i)) && tab !== 'shop') return { text: `Your ${E.cafeOf(game).name} is full · move up in the Shop` };
    if ((game.orders || []).length && tab !== 'shop' && tab !== 'orders') return { text: `${game.orders[0].name}'s ticket · tap Orders` };
    if ((game.orders || []).length && tab === 'orders') return { text: `Stock the pantry below to give ${game.orders[0].name}'s order` };
    const hireable = E.STAFF.find(r => !E.staffLevel(game, r.id) && E.staffNext(game, r.id).cost <= game.cash);
    if (hireable && tab !== 'shop') return { text: `You can hire a ${hireable.name} in the Shop` };
    const cheapUpg = E.availableUpgrades(game).find(u => E.upgradeCost(game, u) <= game.cash);
    if (cheapUpg && tab !== 'upgrades' && tab !== 'cafe') return { text: `${cheapUpg.name} is affordable in Upgrades` };
    if (E.rpGain(game) > 0 && tab !== 'prestige' && tab !== 'cafe') return { text: `Sell the chain for +${E.rpGain(game)} Roast Point${E.rpGain(game) > 1 ? 's' : ''}` };
    return { text: 'tap anywhere to brew', idle: true };
  }, [game, tab, rush, frenzy]);

  return (
    <div className="mx-auto max-w-md h-dvh flex flex-col bg-bean sm:border-x sm:border-mocha relative overflow-hidden">
      {/* top bar */}
      <header className="shrink-0 px-3 pt-[max(env(safe-area-inset-top),8px)] pb-2 bg-[#15181d] text-white z-20 flex items-center gap-2">
        <div className="flex items-center gap-2 bg-white rounded-full pl-1 pr-3 py-1 shadow-[0_3px_0_#0b0d10]">
          <span className="w-7 h-7 rounded-full bg-gradient-to-b from-[#ffd54a] to-[#f2a100] border-2 border-[#c47d00] flex items-center justify-center text-[#7a4a00] font-display font-bold text-sm">$</span>
          <span className="font-display font-bold text-xl text-foam tabular leading-none"><SmoothCash value={game.cash} /></span>
          <span className={"text-[10px] tabular leading-none " + (rush || review ? 'text-amber font-bold' : 'text-latte')}>{rate(cps)}</span>
        </div>
        <div className="flex-1" />
        {game.rp > 0 && <span className="flex items-center gap-1 text-xs bg-white/10 rounded-full px-2.5 py-1 tabular text-amber"><Icon name="Sparkles" size={13} /> {game.rp} RP</span>}
        <button onClick={toggleMusic} aria-label={music ? 'Music off' : 'Music on'} className="p-1.5 rounded-full"><Icon name="Music" size={18} className={music ? 'text-amber' : 'text-white/40'} /></button>
        <button onClick={toggleMute} aria-label={muted ? 'Unmute' : 'Mute'} className="p-1.5 rounded-full text-white/80"><Icon name={muted ? 'VolumeX' : 'Volume2'} size={18} /></button>
        <button onClick={() => setTab('stats')} aria-label="Settings and stats" className="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center"><Icon name="Settings" size={20} /></button>
      </header>

      <div className="relative flex-1 min-h-0">
        {/* the café */}
        <div ref={heroRef} onPointerDown={onHeroTap} className="absolute inset-0 overflow-hidden bg-bean cursor-pointer">
          <Cafe gameRef={gameRef} sceneRef={sceneRef} />
          {floaters.map(f => (
            <span key={f.id} className={"floater font-display font-bold text-amber " + (frenzy ? 'text-3xl' : 'text-2xl')} style={{ left: f.x + '%', top: f.y + '%' }}>{f.text}</span>
          ))}
        </div>
        {/* buffs and the hint */}
        <div className="absolute top-2 left-1/2 -translate-x-1/2 w-[56%] flex flex-col items-center gap-1 pointer-events-none z-20">
          {(rush || frenzy || review) && <div className="flex gap-1 flex-wrap justify-center">
            {rush && <BuffChip icon="Flame" label={'×' + E.RUSH_MULT} left={E.buffLeft(game, 'rush')} />}
            {frenzy && <BuffChip icon="Zap" label={'×' + E.FRENZY_MULT + ' taps'} left={E.buffLeft(game, 'frenzy')} />}
            {review && <BuffChip icon="Newspaper" label={'×' + E.REVIEW_MULT + ' review'} left={E.buffLeft(game, 'review')} />}
          </div>}
          <div className={"text-[11px] text-center truncate max-w-full rounded-full px-3 py-1 bg-white/90 shadow-[0_2px_0_#c9d3de] " + (hint.hot ? 'text-ember font-bold' : hint.idle ? 'text-latte uppercase tracking-wide' : 'text-foam')}>{hint.text}</div>
        </div>
        {/* floating buttons */}
        <div className="absolute left-2 top-2 flex flex-col gap-2 z-20">
          <SideButton icon="Store" label="Shop" onClick={() => setTab('shop')} dot={E.nextCafe(game) && E.nextCafe(game).cost <= game.cash && E.GENS.some((g, i) => E.cafeFull(game, i))} />
          <SideButton icon="Users" label="Staff" onClick={() => setTab('staff')} dot={E.STAFF.some(r => !E.staffLevel(game, r.id) && E.staffNext(game, r.id).cost <= game.cash)} />
          <SideButton icon="TrendingUp" label="Boosts" onClick={() => setTab('upgrades')} dot={E.availableUpgrades(game).some(u => E.upgradeCost(game, u) <= game.cash)} />
        </div>
        <div className="absolute right-2 top-2 flex flex-col gap-2 z-20">
          <SideButton icon="Receipt" label="Orders" onClick={() => setTab('orders')} badge={(game.orders || []).length} dot={(game.orders || []).some(o => E.canFill(game, o))} />
          <SideButton icon="Sparkles" label="Sell" onClick={() => setTab('prestige')} dot={E.rpGain(game) > 0 || E.PERKS.some(p => !game.perks[p.id] && p.cost <= E.rpAvailable(game))} />
          <SideButton icon="BarChart3" label="Stats" onClick={() => setTab('stats')} />
        </div>
        {/* toasts */}
        <div className="absolute bottom-[132px] left-3 right-3 z-30 flex flex-col gap-1.5 pointer-events-none">
          {toasts.map(t => (
            <div key={t.id} className={"toast-in flex items-center gap-2 rounded-2xl px-3.5 py-2 text-xs font-bold shadow-xl leading-tight " + (t.kind === 'gold' ? 'bg-amber text-white' : 'bg-foam text-white')}>
              <Icon name={TOAST_ICON[t.kind]} size={15} className={"shrink-0 " + (t.kind === 'gold' ? '' : 'text-amber')} /> <span>{t.text}</span>
            </div>
          ))}
        </div>
        {/* golden bean */}
        {game.gold && (
          <button aria-label="Golden bean" onPointerDown={onGold}
            className="gold-bean absolute z-30 w-16 h-16 rounded-full flex items-center justify-center"
            style={{ left: game.gold.x + '%', top: game.gold.y + '%',
              background: `conic-gradient(#F2A65A ${Math.max(0, (game.gold.until - game.playtime) / game.gold.life) * 360}deg, rgba(43,23,13,.6) 0)` }}>
            <span className="w-[52px] h-[52px] rounded-full bg-gradient-to-b from-[#ffd27a] to-[#e08a2a] text-[#3a2214] flex items-center justify-center shadow-inner">
              <Icon name="Bean" size={30} strokeWidth={2.4} />
            </span>
          </button>
        )}
        {bursts.map(b => b.parts.map((p, i) => (
          <span key={b.id + '-' + i} className="burst z-30" style={{ left: b.x + '%', top: b.y + '%', '--dx': p.dx + 'px', '--dy': p.dy + 'px' }} />
        )))}
        <div className="absolute bottom-0 left-0 right-0 z-20"><OrderRail game={game} onFill={fillOrder} /></div>

        {tab !== 'cafe' && (
          <Sheet title={PANEL_TITLES[tab] || ''} onClose={() => setTab('cafe')}>
            <main ref={mainRef} className="min-h-0 overflow-y-auto scroll-soft px-3 pt-3 pb-[max(env(safe-area-inset-bottom),20px)]">
              {tab === 'shop' && <Shop game={game} qty={qty} setQty={setQty} buy={buyGen} buyStock={buyStock} hire={hire} pulses={pulses} onMove={() => setConfirmMove(true)} />}
              {tab === 'staff' && <div className="flex flex-col gap-2.5"><StaffSection game={game} hire={hire} pulses={pulses} /></div>}
              {tab === 'orders' && <Orders game={game} qty={qty} setQty={setQty} buyStock={buyStock} onFill={fillOrder} />}
              {tab === 'upgrades' && <Upgrades game={game} buy={buyUpgrade} pulses={pulses} />}
              {tab === 'prestige' && <Prestige game={game} onSell={() => setConfirmPrestige(true)} buyPerk={buyPerk} />}
              {tab === 'stats' && <Stats game={game} setGame={setGame} showToast={showToast} onReset={() => setConfirmReset(true)} />}
            </main>
          </Sheet>
        )}
      </div>

      {game.awayReport && game.awayReport.cash > 0 && (
        <Modal onClose={() => setGame(g => ({ ...g, awayReport: null }))}>
          <div className="flex items-center gap-2 text-amber mb-2"><Icon name="Moon" size={20} /><span className="text-xs font-bold uppercase tracking-widest">While you were away</span></div>
          <h2 className="font-display font-bold text-2xl text-foam mb-1">The shop kept brewing.</h2>
          <p className="text-latte/85">You were gone {E.fmtTime(game.awayReport.seconds)}{game.awayReport.capped ? ` (credited for the first ${E.fmtTime(game.awayReport.cap)})` : ''}. Your chain sold at {Math.round(E.offlineMult(game) * 100)}% speed and earned</p>
          <div className="font-display font-bold text-4xl text-amber tabular my-3">{E.fmtCash(game.awayReport.cash)}</div>
          <BigButton onClick={() => setGame(g => ({ ...g, awayReport: null }))} className="w-full">Collect</BigButton>
        </Modal>
      )}

      {confirmMove && E.nextCafe(game) && (() => { const nx = E.nextCafe(game), cur = E.cafeOf(game); return (
        <Modal onClose={() => setConfirmMove(false)}>
          <div className="flex items-center gap-2 text-amber mb-2"><Icon name="Building2" size={20} /><span className="text-xs font-bold uppercase tracking-widest">Bigger premises</span></div>
          <h2 className="font-display font-bold text-2xl text-foam mb-2">Move into a {nx.name}?</h2>
          <p className="text-latte/85 mb-3">Your money comes with you: <strong className="text-foam tabular">{E.fmtCash(game.cash - nx.cost)}</strong> after the {E.fmtCash(nx.cost)} move. Everything else starts fresh: machines, staff, pantry and upgrades{E.perk(game, 'memory') ? ' except what Muscle Memory keeps' : ''}. Roast Points, perks and achievements stay.</p>
          <div className="grid grid-cols-2 gap-2 text-sm mb-3">
            <div className="bg-espresso rounded-xl p-3"><div className="text-latte/60 text-xs uppercase tracking-wider">{cur.name}</div><div className="font-display text-xl text-foam">×{cur.mult} per cup</div></div>
            <div className="bg-espresso rounded-xl p-3 border border-amber/50"><div className="text-amber text-xs uppercase tracking-wider">{nx.name}</div><div className="font-display text-xl text-amber">×{nx.mult} per cup</div></div>
          </div>
          <div className="text-xs text-latte/70 mb-4 leading-relaxed">Room for {nx.caps ? E.GENS.map((g, i) => nx.caps[i] > 0 ? `${nx.caps[i]} ${nx.caps[i] === 1 ? g.name : g.plural}` : null).filter(Boolean).join(', ') : 'everything, with no limits'}.</div>
          <div className="flex gap-2">
            <BigButton tone="ghost" onClick={() => setConfirmMove(false)} className="flex-1">Stay put</BigButton>
            <BigButton onClick={doMove} className="flex-1">Move in</BigButton>
          </div>
        </Modal>
      ); })()}

      {confirmPrestige && (
        <Modal onClose={() => setConfirmPrestige(false)}>
          <div className="flex items-center gap-2 text-amber mb-2"><Icon name="Sparkles" size={20} /><span className="text-xs font-bold uppercase tracking-widest">Sell the chain</span></div>
          <h2 className="font-display font-bold text-2xl text-foam mb-2">Walk away with {E.rpGain(game)} Roast Point{E.rpGain(game) === 1 ? '' : 's'}?</h2>
          <p className="text-latte/85 mb-3">Everything goes: cash, every machine, every upgrade{E.perk(game, 'memory') ? ' except the ones Muscle Memory keeps' : ''}{E.perk(game, 'landlord') ? '' : ', and you are back to a coffee cart'}{E.perk(game, 'crew') ? '' : '; the staff move on'}. You keep Roast Points, perks and achievements, and every point makes every cup worth 2% more, forever.</p>
          <div className="grid grid-cols-2 gap-2 text-sm mb-4">
            <div className="bg-espresso rounded-xl p-3"><div className="text-latte/60 text-xs uppercase tracking-wider">Now</div><div className="font-display text-xl text-foam">{game.rp} RP · +{game.rp * 2}%</div></div>
            <div className="bg-espresso rounded-xl p-3 border border-amber/50"><div className="text-amber text-xs uppercase tracking-wider">After</div><div className="font-display text-xl text-amber">{game.rp + E.rpGain(game)} RP · +{(game.rp + E.rpGain(game)) * 2}%</div></div>
          </div>
          <div className="flex gap-2">
            <BigButton tone="ghost" onClick={() => setConfirmPrestige(false)} className="flex-1">Keep brewing</BigButton>
            <BigButton onClick={doPrestige} className="flex-1">Sell it</BigButton>
          </div>
        </Modal>
      )}

      {confirmReset && (
        <Modal onClose={() => setConfirmReset(false)}>
          <h2 className="font-display font-bold text-2xl text-foam mb-2">Start over from nothing?</h2>
          <p className="text-latte/85 mb-4">This wipes the whole game, Roast Points and achievements included. Copy your save code first if you might want it back.</p>
          <div className="flex gap-2">
            <BigButton tone="ghost" onClick={() => setConfirmReset(false)} className="flex-1">Cancel</BigButton>
            <BigButton onClick={doReset} className="flex-1">Wipe it</BigButton>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ---- Shop ----------------------------------------------------------------
function Eta({ game, cost }) {
  const t = E.timeToAfford(game, cost);
  if (t <= 0 || !isFinite(t) || t > 30 * 86400) return null;
  return <div className="text-[10px] text-latte/50 tabular">in {E.fmtTime(t)}</div>;
}

function Shop({ game, qty, setQty, buy, buyStock, hire, pulses, onMove }) {
  const firstUnowned = game.owned.findIndex(n => n === 0);
  const visible = firstUnowned < 0 ? E.GENS.length : Math.min(E.GENS.length, firstUnowned + 2);
  const price = E.cupPrice(game);
  const cur = E.cafeOf(game), nx = E.nextCafe(game);
  const anyFull = E.GENS.some((g, i) => E.cafeFull(game, i));
  const canMove = !!nx && nx.cost <= game.cash;
  return (
    <div className="flex flex-col gap-2.5">
      <Card onClick={() => nx && onMove()} affordable={canMove} disabled={!nx} pulseKey={pulses.cafe} className={!nx ? 'opacity-100' : ''}>
        <div className="flex items-center gap-3 px-3 py-3 pb-4">
          <span className={"w-12 h-12 shrink-0 rounded-xl flex items-center justify-center " + (canMove ? "bg-amber text-espresso" : "bg-bean text-latte/70")}><Icon name={['ShoppingCart', 'Store', 'Coffee', 'Building2', 'Crown'][game.cafe]} size={24} /></span>
          <div className="min-w-0 flex-1">
            <div className="flex items-baseline gap-2"><span className="font-display font-semibold text-lg text-foam truncate">{cur.name}</span><span className="text-xs text-mint font-bold">×{cur.mult} per cup</span></div>
            {nx ? <div className="text-xs text-latte/70 leading-snug">{anyFull ? <span className="text-amber font-bold">Full up. </span> : null}Move to a {nx.name} for ×{nx.mult} per cup. You keep your money; machines and upgrades start over.</div>
                : <div className="text-xs text-latte/70">{cur.blurb}</div>}
          </div>
          {nx && <div className="text-right shrink-0">
            <div className={"font-bold tabular " + (canMove ? "text-amber" : "text-latte/60")}>{E.fmtCash(nx.cost)}</div>
            <div className="text-[10px] text-latte/50 uppercase tracking-wider">{canMove ? 'move up' : 'to move'}</div>
          </div>}
        </div>
        {nx && <FillBar ratio={game.cash / nx.cost} />}
      </Card>
      <div className="flex items-center justify-between">
        <span className="text-xs font-bold uppercase tracking-widest text-latte/60">Buy</span>
        <div className="flex bg-espresso rounded-full p-1 border border-mocha/50">
          {QTYS.map(([q, label]) => (
            <button key={q} onClick={() => setQty(q)}
              className={"px-3 py-1 rounded-full text-xs font-bold tracking-wide transition-colors " + (qty === q ? "bg-ember text-foam" : "text-latte/70")}>{label}</button>
          ))}
        </div>
      </div>
      <Pantry game={game} qty={qty} buyStock={buyStock} />
      <div className="flex items-center justify-between mt-1">
        <span className="text-xs font-bold uppercase tracking-widest text-latte/60">Machines</span>
        <span className="text-[11px] text-latte/50">brew cups by themselves</span>
      </div>
      {E.GENS.slice(0, visible).map((g, gi) => {
        const owned = game.owned[gi];
        const cap = E.cafeCap(game, gi);
        const needs = cap === 0 ? E.cafeFor(gi) : null;
        const locked = needs || (firstUnowned >= 0 && gi === firstUnowned + 1);
        const full = !needs && owned >= cap;
        const n = full ? 0 : Math.max(1, E.buyCount(game, gi, qty === 'max' ? 'max' : +qty));
        const cost = E.genCost(gi, owned, n);
        const affordable = !full && cost <= game.cash;
        const mult = E.genMult(game, gi);
        const each = g.rate * mult * price;
        const next = E.nextMilestone(game, owned);
        if (locked) {
          return (
            <div key={g.id} className="relative rounded-2xl border border-dashed border-mocha/50 bg-espresso/50 px-4 py-3 flex items-center gap-3 text-latte/50">
              <span className="w-11 h-11 rounded-xl bg-bean flex items-center justify-center"><Icon name="Lock" size={20} /></span>
              <div>
                <div className="font-display font-semibold text-latte/70">{g.name}</div>
                <div className="text-xs">{needs ? `Needs a ${needs.name}.` : `Opens once you own a ${E.GENS[gi - 1].name.toLowerCase()}.`}</div>
              </div>
            </div>
          );
        }
        return (
          <Card key={g.id} onClick={() => !full && buy(gi)} affordable={affordable} pulseKey={pulses['g' + gi]} className={full ? 'opacity-80' : ''}>
            <div className="flex items-center gap-3 px-3 py-3 pb-4">
              <span className={"w-12 h-12 shrink-0 rounded-xl flex items-center justify-center " + (affordable ? "bg-ember text-foam" : "bg-bean text-latte/70")}><Icon name={g.icon} size={26} /></span>
              <div className="min-w-0 flex-1">
                <div className="flex items-baseline gap-2">
                  <span className="font-display font-semibold text-lg text-foam truncate">{g.name}</span>
                  <span className="text-xs text-latte/60 tabular">×{mult}</span>
                </div>
                <div className="text-xs text-latte/70 tabular truncate">
                  {rate(each)} each{owned > 0 && <span> · {rate(each * owned)} total</span>}
                </div>
                <div className="text-[11px] text-latte/50 tabular mt-0.5">
                  {isFinite(cap) ? `${owned}/${cap} fit here · ` : ''}{next ? `×2 at ${next}` : 'all milestones reached'}
                </div>
              </div>
              <div className="text-right shrink-0">
                <div className="font-display font-bold text-3xl tabular leading-none text-foam">{owned}</div>
                {full ? <div className="text-xs font-bold text-amber mt-1">Full</div> : <div className={"text-sm font-bold tabular mt-1 " + (affordable ? "text-amber" : "text-latte/60")}>{E.fmtCash(cost)}</div>}
                {full ? <div className="text-[10px] text-latte/50 uppercase tracking-wider">bigger café</div> : affordable ? <div className="text-[10px] text-latte/50 uppercase tracking-wider">buy {n}</div> : <Eta game={game} cost={cost} />}
              </div>
            </div>
            <FillBar ratio={full ? 1 : game.cash / cost} />
          </Card>
        );
      })}
      <StaffSection game={game} hire={hire} pulses={pulses} />
      <p className="text-center text-xs text-latte/40 px-6 pt-1">{E.GENS[firstUnowned < 0 ? E.GENS.length - 1 : Math.max(0, firstUnowned)].blurb}</p>
    </div>
  );
}

// ---- Upgrades ------------------------------------------------------------
function Upgrades({ game, buy, pulses }) {
  const list = E.availableUpgrades(game);
  const bought = E.UPGRADES.filter(u => E.has(game, u.id));
  return (
    <div className="flex flex-col gap-2.5">
      <div className="flex items-center justify-between">
        <span className="text-xs font-bold uppercase tracking-widest text-latte/60">Available</span>
        <span className="text-xs text-latte/50 tabular">{bought.length}/{E.UPGRADES.length} owned</span>
      </div>
      {list.length === 0 && <div className="text-center text-latte/50 py-8">Nothing on the shelf right now. Own more machines to unlock their gear.</div>}
      {list.map(u => {
        const cost = E.upgradeCost(game, u);
        const affordable = cost <= game.cash;
        return (
          <Card key={u.id} onClick={() => buy(u.id)} affordable={affordable} pulseKey={pulses[u.id]}>
            <div className="flex items-center gap-3 px-3 py-3 pb-4">
              <span className={"w-12 h-12 shrink-0 rounded-xl flex items-center justify-center " + (affordable ? "bg-amber text-espresso" : "bg-bean text-latte/70")}><Icon name={u.icon} size={24} /></span>
              <div className="min-w-0 flex-1">
                <div className="font-display font-semibold text-lg text-foam leading-tight">{u.name}</div>
                <div className="text-xs font-bold text-mint">{u.effect}</div>
                <div className="text-xs text-latte/60 leading-snug mt-0.5">{u.desc}</div>
              </div>
              <div className="text-right shrink-0">
                <div className={"font-bold tabular " + (affordable ? "text-amber" : "text-latte/60")}>{E.fmtCash(cost)}</div>
                {!affordable && <Eta game={game} cost={cost} />}
              </div>
            </div>
            <FillBar ratio={game.cash / cost} />
          </Card>
        );
      })}
      {bought.length > 0 && (
        <div className="mt-2">
          <div className="text-xs font-bold uppercase tracking-widest text-latte/60 mb-1.5">Installed</div>
          <div className="flex flex-wrap gap-1.5">
            {bought.map(u => <span key={u.id} className="text-xs bg-espresso border border-mocha/50 text-latte/80 rounded-full px-2.5 py-1 flex items-center gap-1"><Icon name="Check" size={12} className="text-mint" />{u.name}</span>)}
          </div>
        </div>
      )}
    </div>
  );
}

// ---- Prestige ------------------------------------------------------------
function Prestige({ game, onSell, buyPerk }) {
  const unlocked = E.prestigeUnlocked(game);
  const gain = E.rpGain(game);
  const total = E.rpFor(game.lifetime);
  const nextAt = Math.pow(total + 1, 2) * E.PRESTIGE_UNIT;
  const prog = unlocked ? (game.lifetime - Math.pow(total, 2) * E.PRESTIGE_UNIT) / (nextAt - Math.pow(total, 2) * E.PRESTIGE_UNIT) : game.lifetime / E.PRESTIGE_UNIT;
  const avail = E.rpAvailable(game);
  return (
    <div className="flex flex-col gap-3">
      <div className="rounded-3xl bg-gradient-to-b from-roast to-espresso border border-mocha/60 p-5 text-center">
        <div className="text-xs font-bold uppercase tracking-widest text-amber flex items-center justify-center gap-1"><Icon name="Sparkles" size={14} /> Roast Points</div>
        <div className="font-display font-bold text-6xl text-foam tabular mt-1">{game.rp}</div>
        <div className="text-latte/80">+{game.rp * 2}% on every cup, forever</div>
        {game.rp > 0 && <div className="text-xs text-latte/50 tabular mt-1">{avail} unspent · {game.rpSpent} in perks</div>}
      </div>

      <div className="rounded-2xl bg-espresso border border-mocha/50 p-4">
        <div className="flex justify-between text-sm">
          <span className="text-latte/70">Lifetime earnings</span>
          <span className="font-bold tabular text-foam">{E.fmtCash(game.lifetime)}</span>
        </div>
        <div className="h-3 rounded-full bg-bean mt-2 overflow-hidden">
          <div className="h-full bg-gradient-to-r from-ember to-amber transition-[width] duration-300" style={{ width: Math.min(100, prog * 100) + '%' }} />
        </div>
        <div className="text-xs text-latte/60 mt-1.5 tabular">
          {unlocked ? `Next point at ${E.fmtCash(nextAt)}` : `Sell unlocks at ${E.fmtCash(E.PRESTIGE_UNIT)} lifetime earnings`}
          {!unlocked && isFinite(E.timeToAfford(game, E.PRESTIGE_UNIT - game.lifetime + game.cash)) && ` · about ${E.fmtTime(E.timeToAfford(game, E.PRESTIGE_UNIT - game.lifetime + game.cash))} at this rate`}
        </div>
      </div>

      <div className="rounded-2xl bg-roast border border-amber/40 p-4 flex items-center justify-between">
        <div>
          <div className="text-xs uppercase tracking-widest text-latte/60">If you sell now</div>
          <div className={"font-display font-bold text-3xl tabular " + (gain > 0 ? "text-amber" : "text-latte/50")}>+{gain} RP</div>
        </div>
        <div className="text-right text-xs text-latte/60 tabular">
          <div>{game.rp} → {game.rp + gain} RP</div>
          <div>+{game.rp * 2}% → +{(game.rp + gain) * 2}%</div>
        </div>
      </div>

      <BigButton onClick={onSell} disabled={!unlocked || gain <= 0} className="w-full flex items-center justify-center gap-2">
        {unlocked ? (gain > 0 ? <>Sell the Chain</> : <>Earn more before selling</>) : <><Icon name="Lock" size={18} /> Locked until $1.00T earned</>}
      </BigButton>
      <div className="text-center text-xs text-latte/50">
        Selling resets cash, machines and upgrades. Points banked: √(lifetime ÷ $1T). Sold {game.prestiges} time{game.prestiges === 1 ? '' : 's'} so far.
      </div>

      <div className="flex items-center justify-between mt-2">
        <span className="text-xs font-bold uppercase tracking-widest text-latte/60">Perks</span>
        <span className="text-xs text-amber tabular font-bold">{avail} RP to spend</span>
      </div>
      <p className="text-xs text-latte/60 -mt-1">Spend Roast Points on permanent perks. Spending never shrinks your +2% bonus.</p>
      {E.PERKS.map(p => {
        const owned = !!game.perks[p.id];
        const can = !owned && p.cost <= avail;
        return (
          <Card key={p.id} onClick={() => !owned && buyPerk(p.id)} affordable={can} disabled={owned} className={owned ? 'opacity-100' : ''}>
            <div className="flex items-center gap-3 px-3 py-3">
              <span className={"w-12 h-12 shrink-0 rounded-xl flex items-center justify-center " + (owned ? "bg-mint text-espresso" : can ? "bg-amber text-espresso" : "bg-bean text-latte/70")}><Icon name={owned ? 'Check' : p.icon} size={24} /></span>
              <div className="min-w-0 flex-1">
                <div className="font-display font-semibold text-lg text-foam leading-tight">{p.name}</div>
                <div className="text-xs text-latte/70 leading-snug mt-0.5">{p.desc}</div>
              </div>
              <div className={"text-right shrink-0 font-bold tabular " + (owned ? "text-mint text-xs uppercase" : can ? "text-amber" : "text-latte/50")}>{owned ? 'owned' : p.cost + ' RP'}</div>
            </div>
          </Card>
        );
      })}
    </div>
  );
}

// ---- Stats ---------------------------------------------------------------
function Stats({ game, setGame, showToast, onReset }) {
  const [showImport, setShowImport] = useState(false);
  const [code, setCode] = useState('');
  const [exported, setExported] = useState(null);
  const [showAch, setShowAch] = useState(true);
  const cps = E.cashPerSec(game);
  const achN = E.achCount(game);
  const rows = [
    ['Premises', E.cafeOf(game).name + ' (×' + E.cafeOf(game).mult + ')'],
    ['Moves', game.moves || 0],
    ['Cash on hand', E.fmtCash(game.cash)],
    ['Income', rate(cps)],
    ['Best income', rate(game.bestRate)],
    ['Cups per second', E.fmt(E.cupsPerSec(game), 1)],
    ['Price per cup', E.fmtCash(E.cupPrice(game), 2)],
    ['Tap value', E.fmtCash(E.tapValue(game), 2)],
    ['Cups brewed', E.fmt(game.cups)],
    ['Taps', E.fmt(game.taps)],
    ['Golden beans caught', game.goldCaught],
    ['Orders filled', game.ordersFilled || 0],
    ['Orders missed', game.ordersMissed || 0],
    ['Best order streak', game.bestStreak || 0],
    ['Rave reviews', game.reviews || 0],
    ['Staff', E.STAFF.filter(r => E.staffLevel(game, r.id)).map(r => `${r.name} ${E.staffLevel(game, r.id)}`).join(', ') || 'none yet'],
    ['Earned this run', E.fmtCash(game.runEarned)],
    ['Earned all time', E.fmtCash(game.lifetime)],
    ['Time played', E.fmtTime(game.playtime)],
    ['Offline rate', Math.round(E.offlineMult(game) * 100) + '% for up to ' + E.fmtTime(E.offlineCap(game))],
    ['Reputation', '+' + achN + '% from achievements'],
    ['Roast Points', game.rp + ' (+' + game.rp * 2 + '%)'],
    ['Chains sold', game.prestiges],
  ];
  const copySave = async () => {
    const s = encodeSave({ ...game, savedAt: Date.now(), awayReport: null, events: [], gold: null });
    try { await navigator.clipboard.writeText(s); showToast('Save code copied'); }
    catch (e) { setExported(s); }
  };
  const loadSave = () => {
    const s = decodeSave(code);
    if (!s) { showToast('That code did not read as a Bean Baron save'); return; }
    setGame(resumeFrom(s)); setCode(''); setShowImport(false); showToast('Save loaded');
  };
  return (
    <div className="flex flex-col gap-3">
      <div className="rounded-2xl bg-espresso border border-mocha/50 divide-y divide-mocha/30">
        {rows.map(([k, v]) => (
          <div key={k} className="flex justify-between px-4 py-2 text-sm"><span className="text-latte/70">{k}</span><span className="font-bold tabular text-foam">{v}</span></div>
        ))}
      </div>

      <button onClick={() => setShowAch(v => !v)} className="flex items-center justify-between mt-1">
        <span className="text-xs font-bold uppercase tracking-widest text-latte/60">Achievements · {achN}/{E.ACH.length}</span>
        <Icon name={showAch ? 'ChevronUp' : 'ChevronDown'} size={16} className="text-latte/60" />
      </button>
      {showAch && (
        <div className="grid grid-cols-2 gap-2">
          {E.ACH.map(a => {
            const on = !!game.achievements[a.id];
            return (
              <div key={a.id} className={"rounded-xl border px-3 py-2 flex items-center gap-2 " + (on ? "bg-roast border-amber/50" : "bg-espresso/60 border-mocha/30 opacity-50")}>
                <span className={"w-8 h-8 shrink-0 rounded-lg flex items-center justify-center " + (on ? "bg-amber text-espresso" : "bg-bean text-latte/60")}><Icon name={a.icon} size={16} /></span>
                <div className="min-w-0">
                  <div className="text-xs font-bold text-foam leading-tight">{a.name}</div>
                  <div className="text-[11px] text-latte/60 leading-tight">{a.desc}</div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div className="text-xs font-bold uppercase tracking-widest text-latte/60 mt-1">The chain</div>
      <div className="rounded-2xl bg-espresso border border-mocha/50 divide-y divide-mocha/30">
        {E.GENS.map((g, gi) => {
          const c = E.genCups(game, gi) * E.cupPrice(game);
          const share = cps > 0 ? c / cps : 0;
          return (
            <div key={g.id} className="px-4 py-2 text-sm">
              <div className="flex justify-between"><span className="flex items-center gap-2 text-latte/85"><Icon name={g.icon} size={16} className="text-amber" />{g.name} <span className="text-latte/50 tabular">×{game.owned[gi]}</span></span><span className="font-bold tabular text-foam">{rate(c)}</span></div>
              <div className="h-1 rounded-full bg-bean mt-1.5 overflow-hidden"><div className="h-full bg-ember" style={{ width: share * 100 + '%' }} /></div>
            </div>
          );
        })}
      </div>

      <div className="text-xs font-bold uppercase tracking-widest text-latte/60 mt-1">Save</div>
      <p className="text-xs text-latte/60 -mt-1">Your game autosaves in memory while this page is open. Copy a save code to keep it across reloads or move it to another device.</p>
      <div className="grid grid-cols-2 gap-2">
        <BigButton tone="quiet" onClick={copySave} className="text-base flex items-center justify-center gap-2"><Icon name="ClipboardCopy" size={18} /> Copy save code</BigButton>
        <BigButton tone="quiet" onClick={() => setShowImport(v => !v)} className="text-base flex items-center justify-center gap-2"><Icon name="Upload" size={18} /> Load save code</BigButton>
      </div>
      {exported && (
        <div className="rounded-2xl bg-espresso border border-mocha/50 p-3 text-xs">
          <div className="text-latte/70 mb-1">Clipboard was unavailable. Copy this by hand:</div>
          <textarea readOnly value={exported} onFocus={e => e.target.select()} className="w-full h-20 bg-bean text-latte rounded-lg p-2 font-mono text-[10px]" />
        </div>
      )}
      {showImport && (
        <div className="rounded-2xl bg-espresso border border-mocha/50 p-3 flex flex-col gap-2">
          <textarea value={code} onChange={e => setCode(e.target.value)} placeholder="Paste a save code" className="w-full h-20 bg-bean text-latte rounded-lg p-2 font-mono text-[10px] placeholder:text-latte/40" />
          <BigButton onClick={loadSave} disabled={!code.trim()} className="text-base">Load</BigButton>
        </div>
      )}
      <button onClick={onReset} className="text-xs text-latte/50 underline underline-offset-4 py-2 flex items-center justify-center gap-1"><Icon name="RotateCcw" size={12} /> Start over from nothing</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Offline support when served from a real site (not from a file or the artifact host).
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude\.ai$/.test(location.hostname)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
