<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#15181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bean Baron">
<meta name="description" content="Tap to brew, fill orders, grow a coffee chain from a cart to a palace.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/bean-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/bean-192.png">
<title>Bean Baron</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Bean Baron commits to one look: a dark espresso counter with cream type
     and a burnt-orange accent. Every colour is painted explicitly so the page
     holds up on any host ground. */
  :root { color-scheme: light; }
  html, body { margin: 0; background: #e9eef4; color: #1f2430; }
  body { font-family: Nunito, "Segoe UI", system-ui, -apple-system, sans-serif; font-weight: 500; overscroll-behavior: none; }
  .font-display { font-family: Fredoka, Nunito, "Segoe UI", system-ui, sans-serif; }
  .tabular { font-variant-numeric: tabular-nums; }
  .noselect { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .scroll-soft { scrollbar-width: thin; scrollbar-color: #c9d3de transparent; }
  button:focus-visible { outline: 3px solid #F2A65A; outline-offset: 2px; }

  @keyframes floatUp {
    0%   { transform: translate(-50%, 0) scale(.85); opacity: 0; }
    15%  { transform: translate(-50%, -10px) scale(1.08); opacity: 1; }
    100% { transform: translate(-50%, -84px) scale(1); opacity: 0; }
  }
  .floater { position: absolute; pointer-events: none; animation: floatUp .85s cubic-bezier(.2,.7,.3,1) forwards; text-shadow: 0 2px 0 #fff, 0 0 6px #fff; white-space: nowrap; }

  @keyframes steam {
    0%   { transform: translate(var(--sx), 0) scaleX(.7); opacity: 0; }
    25%  { opacity: .55; }
    100% { transform: translate(calc(var(--sx) * 1.8), -64px) scaleX(1.4) scaleY(1.2); opacity: 0; }
  }
  .steam { position: absolute; left: 50%; margin-left: -6px; width: 12px; height: 30px; border-radius: 50%;
           background: rgba(246,231,207,.8); filter: blur(5px); animation: steam 2.6s ease-out infinite; animation-delay: var(--sd); }

  @keyframes pulseOnce {
    0%   { box-shadow: 0 0 0 0 rgba(242,166,90,.9); }
    100% { box-shadow: 0 0 0 22px rgba(242,166,90,0); }
  }
  .pulse-ring { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; animation: pulseOnce .9s ease-out 1 forwards; }

  @keyframes modalIn { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-in { animation: modalIn .25s cubic-bezier(.2,.8,.3,1); }

  @keyframes cupPop { 0% { transform: scale(1); } 40% { transform: scale(.92); } 100% { transform: scale(1); } }
  .cup-pressed { animation: cupPop .16s ease-out; }

  @keyframes wobble {
    0%, 100% { transform: translate(-50%, -50%) rotate(-10deg) scale(1); }
    50%      { transform: translate(-50%, -50%) rotate(10deg) scale(1.1); }
  }
  .gold-bean { animation: wobble 1.1s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(242,166,90,.85)); }

  @keyframes burst {
    0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3); opacity: 0; }
  }
  .burst { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #F2A65A; pointer-events: none; animation: burst .7s cubic-bezier(.1,.8,.3,1) forwards; }

  @keyframes toastIn { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
  .toast-in { animation: toastIn .22s cubic-bezier(.2,.8,.3,1); }

  @keyframes glow { 0%, 100% { box-shadow: 0 8px 0 #6d2c0f, 0 0 24px 4px rgba(242,166,90,.45); } 50% { box-shadow: 0 8px 0 #6d2c0f, 0 0 44px 10px rgba(242,166,90,.75); } }
  .cup-rush { animation: glow 1.2s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .steam, .pulse-ring, .modal-in, .cup-pressed { animation: none; }
    .floater { animation-duration: .01s; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11/dist/index.global.js"></script>
<style type="text/tailwindcss">
  @theme {
    --color-espresso: #ffffff;
    --color-bean: #e9eef4;
    --color-roast: #eaf6ff;
    --color-mocha: #d6dde6;
    --color-cream: #1f2430;
    --color-latte: #5b6573;
    --color-foam: #141821;
    --color-ember: #2fa8f0;
    --color-amber: #f0a020;
    --color-mint: #34c05f;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/lucide-react@0.468.0/dist/umd/lucide-react.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
</head>

<noscript><p style="padding:2rem;text-align:center">Bean Baron needs JavaScript. Open this file in Safari or Chrome directly.</p></noscript>
<script>
// ---- Bean Baron economy -------------------------------------------------
// Pure game rules: no DOM, no React. The page runs this block verbatim and
// tools/beanbaron_sim.js loads the very same text to balance the numbers.
const BeanBaronEconomy = (() => {
  const GROWTH = 1.15;
  const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  const MILESTONES = [10, 25, 50, 100];
  const EXTRA_MILESTONES = [150, 200, 300, 400];   // unlocked by the Overdrive perk
  const PRESTIGE_UNIT = 1e12;
  const OFFLINE_CAP = 4 * 3600;
  const OFFLINE_BASE = 0.5;
  const RUSH_MULT = 5, RUSH_SECS = 25;
  const FRENZY_MULT = 12, FRENZY_SECS = 15;
  const GOLD_LIFE = 13;                             // seconds a golden bean waits to be tapped
  const TIP_SECS = 300;                             // a big tip is worth up to this much production
  const GOLD_GAP = [180, 360];                      // seconds between golden beans

  const GENS = [
    { id: 'drip',       name: 'Drip Machine', plural: 'Drip Machines', base: 15,     rate: 0.1,   icon: 'Coffee',  blurb: 'A humble pot that never quite goes cold.' },
    { id: 'espresso',   name: 'Espresso Bar', plural: 'Espresso Bars', base: 100,    rate: 1,     icon: 'Zap',     blurb: 'Nine bars of pressure. Twenty-five seconds of hope.' },
    { id: 'barista',    name: 'Barista',      plural: 'Baristas',      base: 1100,   rate: 8,     icon: 'User',    blurb: 'Pours a fern into anything, including soup.' },
    { id: 'roaster',    name: 'Roaster',      plural: 'Roasters',      base: 12e3,   rate: 47,    icon: 'Flame',   blurb: 'Green beans in, first crack out.' },
    { id: 'van',        name: 'Delivery Van', plural: 'Delivery Vans', base: 130e3,  rate: 260,   icon: 'Truck',   blurb: 'Cold brew kegs to every office on the block.' },
    { id: 'franchise',  name: 'Franchise',    plural: 'Franchises',    base: 1.4e6,  rate: 1400,  icon: 'Store',   blurb: 'Same cup, new zip code.' },
    { id: 'plantation', name: 'Plantation',   plural: 'Plantations',   base: 20e6,   rate: 7800,  icon: 'Sprout',  blurb: 'Own the hillside the beans grow on.' },
    { id: 'empire',     name: 'Coffee Empire', plural: 'Coffee Empires', base: 330e6, rate: 44000, icon: 'Crown',  blurb: 'The sun never sets on your roast.' },
  ];

  // Cash upgrades. `kind` says what the multiplier applies to.
  //   price    - every cup sells for more (the "x all" family)
  //   tap      - value of one tap on the cup
  //   offline  - share of production earned while away
  //   gen      - one generator tier (needs `gen`)
  //   tapshare - each tap also brews this fraction of one second of output
  const UPGRADES = [];
  const BEANS = [
    ['Better Beans',      'Swap the bargain sack for something with a farm on the label.'],
    ['Arabica Blend',     'Smoother, sweeter, pricier. Customers notice.'],
    ['Single Origin',     'One farm, one harvest, one very long menu description.'],
    ['Fresh Roast Dates', 'Roasted Tuesday. Sold Wednesday. Bragged about Thursday.'],
    ['House Cold Brew',   'Twelve hours of patience in a keg.'],
    ['Signature Blend',   'Nobody knows what is in it. Everybody orders it.'],
    ['Geisha Reserve',    'Tastes like jasmine and quarterly profit.'],
    ['Barrel-Aged Beans', 'Rested in bourbon oak. Priced like it.'],
    ['Micro-lot Auction', 'You outbid three countries for a single hillside.'],
    ['Cup of Excellence', 'The trophy goes on the wall. The price goes on the board.'],
    ['Competition Roast', 'Your roaster wins nationals. Menus are reprinted.'],
    ['Legendary Harvest', 'A once-in-a-decade crop, and it is all yours.'],
    ['Mythic Bean',       'Grown on a volcano no map shows.'],
    ['Stardust Roast',    'Roasted with light from a distant sun.'],
  ];
  const BEANS_COST0 = 250, BEANS_RATIO = 11;
  BEANS.forEach(([name, desc], i) => UPGRADES.push({
    id: 'beans' + i, name, desc, kind: 'price', mult: 1.5, icon: 'Bean',
    cost: BEANS_COST0 * Math.pow(BEANS_RATIO, i),
    tier: i, family: 'beans',
    effect: 'x1.5 all income',
  }));
  const TAPS = [
    ['Loyalty App',  'Every tenth cup is free. Every cup is bigger.', 'Smartphone', 2,  400],
    ['Double Shot',  'Two shots in every pour, no extra time.',        'Zap',        2,  25e3],
    ['Tip Jar',      'A hand-lettered sign does wonders.',             'Coins',      2,  2e6],
    ['Latte Art',    'A swan on top adds a dollar on the bottom.',     'Sparkles',   2,  150e6],
    ['Golden Tamper','It does nothing. It costs a fortune. Tips triple.', 'Gem',    3,  20e9],
  ];
  TAPS.forEach(([name, desc, icon, mult, cost], i) => UPGRADES.push({
    id: 'tap' + i, name, desc, kind: 'tap', mult, icon, cost, tier: i, family: 'tap',
    effect: 'x' + mult + ' tap value',
  }));
  UPGRADES.push({ id: 'training', name: 'Barista Training', kind: 'tapshare', share: 0.02, icon: 'Hand',
    desc: 'Your own taps now brew a slice of the whole chain\'s output.', cost: 60e3, family: 'tap', tier: 99,
    effect: 'each tap adds 2% of your per-second income' });
  UPGRADES.push({ id: 'nightshift', name: 'Night Shift', kind: 'offline', mult: 1.25, icon: 'Moon',
    desc: 'Someone keeps the lights on while you sleep.', cost: 12e3, family: 'offline', tier: 0,
    effect: 'x1.25 offline earnings' });
  UPGRADES.push({ id: 'weekend', name: 'Weekend Crew', kind: 'offline', mult: 1.2, icon: 'Users',
    desc: 'The shop hums along even when you are not looking.', cost: 5e6, family: 'offline', tier: 1,
    effect: 'x1.2 offline earnings' });
  // Per-generator gear: unlocked by owning enough of the tier.
  const GEAR = [
    ['Paper Filters',     'Gold Filters'],
    ['Steam Wands',       'Dual Boilers'],
    ['Aprons',            'Latte Art School'],
    ['Drum Roaster',      'Fluid-bed Roaster'],
    ['GPS Routing',       'Electric Fleet'],
    ['Drive-thru Lanes',  'Airport Kiosks'],
    ['Shade Trees',       'Terraced Hills'],
    ['Trade Routes',      'Orbital Roastery'],
  ];
  GENS.forEach((g, gi) => {
    UPGRADES.push({ id: g.id + '_gear1', name: GEAR[gi][0], kind: 'gen', gen: gi, mult: 2, icon: g.icon,
      desc: 'Every ' + g.name + ' works twice as hard.', cost: g.base * 25, needs: 5, family: g.id, tier: 0,
      effect: 'x2 ' + g.name + ' output' });
    UPGRADES.push({ id: g.id + '_gear2', name: GEAR[gi][1], kind: 'gen', gen: gi, mult: 2, icon: g.icon,
      desc: 'Serious kit for a serious ' + g.name.toLowerCase() + ' operation.', cost: g.base * 700, needs: 30, family: g.id, tier: 1,
      effect: 'x2 ' + g.name + ' output' });
  });
  const UPG_BY_ID = Object.fromEntries(UPGRADES.map(u => [u.id, u]));

  // The premises. Each size caps how many of each generator fit (0 = that
  // tier does not exist here yet) and sells every cup for more. Moving up
  // keeps your cash and resets everything else.
  const CAFES = [
    { id: 'cart',   name: 'Coffee Cart',       cost: 0,     mult: 1,   caps: [10, 5, 2, 0, 0, 0, 0, 0],        blurb: 'A cart, an umbrella and a dream.' },
    { id: 'kiosk',  name: 'Corner Kiosk',      cost: 8e3,   mult: 1.2, caps: [25, 15, 10, 3, 0, 0, 0, 0],      blurb: 'Four walls, two tables and one very loud grinder.' },
    { id: 'cafe',   name: 'Neighborhood Café', cost: 1e6,   mult: 1.5, caps: [50, 50, 30, 25, 10, 0, 0, 0],    blurb: 'Regulars, a rug and a roaster out back.' },
    { id: 'grand',  name: 'Grand Café',        cost: 100e6, mult: 2,   caps: [100, 100, 100, 50, 50, 25, 10, 0], blurb: 'Three rows of tables and a fleet outside.' },
    { id: 'palace', name: 'Coffee Palace',     cost: 10e9,  mult: 2.5,   caps: null,                             blurb: 'No limits. Gold trim. A chandelier nobody asked for.' },
  ];
  const cafeOf = s => CAFES[Math.min(s.cafe || 0, CAFES.length - 1)];
  const nextCafe = s => CAFES[(s.cafe || 0) + 1] || null;
  const cafeCap = (s, gi) => { const c = cafeOf(s); return c.caps ? c.caps[gi] : Infinity; };
  const cafeFor = gi => CAFES.find(c => !c.caps || c.caps[gi] > 0);
  const cafeFull = (s, gi) => { const c = cafeCap(s, gi); return c > 0 && isFinite(c) && s.owned[gi] >= c; };

  // Orders. Customers ask for drinks and pastries; the player fills the
  // ticket from a pantry stocked in the shop. Payouts scale with income so
  // filling orders stays worth the attention at any stage.
  const INGREDIENTS = [
    { id: 'beans',  name: 'Beans',    icon: 'Bean',      base: 2 },
    { id: 'milk',   name: 'Milk',     icon: 'Milk',      base: 1.5 },
    { id: 'cups',   name: 'Cups',     icon: 'CupSoda',   base: 0.5 },
    { id: 'syrup',  name: 'Syrup',    icon: 'Droplet',   base: 3 },
    { id: 'pastry', name: 'Pastries', icon: 'Croissant', base: 4 },
  ];
  const ING_BY_ID = Object.fromEntries(INGREDIENTS.map(i => [i.id, i]));
  const RECIPES = [
    { id: 'drip',      name: 'Drip Coffee', icon: 'Coffee',    needs: { beans: 1, cups: 1 } },
    { id: 'latte',     name: 'Latte',       icon: 'Milk',      needs: { beans: 1, milk: 1, cups: 1 } },
    { id: 'mocha',     name: 'Mocha',       icon: 'Candy',     needs: { beans: 1, milk: 1, syrup: 1, cups: 1 } },
    { id: 'coldbrew',  name: 'Cold Brew',   icon: 'Snowflake', needs: { beans: 2, cups: 1 } },
    { id: 'croissant', name: 'Croissant',   icon: 'Croissant', needs: { pastry: 1 } },
    { id: 'cookie',    name: 'Cookie',      icon: 'Cookie',    needs: { pastry: 1 } },
  ];
  const RECIPE_BY_ID = Object.fromEntries(RECIPES.map(r => [r.id, r]));
  const ORDER_NAMES = ['Maya', 'Theo', 'Priya', 'Jonas', 'Amara', 'Kai', 'Lena', 'Diego', 'Noor', 'Felix', 'Sana', 'Milo', 'Ada', 'Ravi', 'June', 'Omar', 'Ivy', 'Luca', 'Zoe', 'Nico', 'Hana', 'Sam', 'Rosa', 'Eli'];
  const ORDER_MAX = 3, ORDER_LIFE = 90, ORDER_GAP = [25, 45], ORDER_FIRST = 20;
  const ORDER_MARKUP = 3, ORDER_SECONDS = 6;      // payout = ingredients x markup + this many seconds of income
  const VIP_CHANCE = 0.12, VIP_MULT = 3, REVIEW_MULT = 2, REVIEW_SECS = 45;   // food critics

  // Staff. Each role automates a bit of the busywork; promotions make them faster.
  const STAFF = [
    { id: 'tapper',  name: 'Tapper',        icon: 'Hand',           blurb: 'Keeps the cup warm so you do not have to.',
      levels: [{ cost: 500, rate: 1 }, { cost: 25e3, rate: 3 }, { cost: 2e6, rate: 6 }], effect: l => `${l.rate} tap${l.rate > 1 ? 's' : ''} a second` },
    { id: 'runner',  name: 'Order Runner',  icon: 'Bike',           blurb: 'Hands over any ticket the pantry can cover.',
      levels: [{ cost: 2e3, every: 15 }, { cost: 100e3, every: 5 }, { cost: 10e6, every: 1 }], effect: l => `gives a ready ticket every ${l.every}s` },
    { id: 'clerk',   name: 'Stock Clerk',   icon: 'ShoppingBasket', blurb: 'Tops up the pantry from the till.',
      levels: [{ cost: 3e3, keep: 5 }, { cost: 200e3, keep: 25 }, { cost: 20e6, keep: 100 }], effect: l => `keeps ${l.keep} of each ingredient stocked` },
    { id: 'greeter', name: 'Greeter',       icon: 'Smile',          blurb: 'Has an eye for golden beans.',
      levels: [{ cost: 50e3, chance: 0.5 }, { cost: 5e6, chance: 1 }], effect: l => `catches golden beans ${Math.round(l.chance * 100)}% of the time` },
    { id: 'manager', name: 'Shift Manager', icon: 'ClipboardList',  blurb: 'Runs a tighter shop every promotion.',
      levels: [{ cost: 10e3, bonus: 0.05 }, { cost: 1e6, bonus: 0.1 }, { cost: 100e6, bonus: 0.15 }, { cost: 10e9, bonus: 0.2 }, { cost: 1e12, bonus: 0.25 }], effect: l => `+${Math.round(l.bonus * 100)}% all income` },
  ];
  const STAFF_BY_ID = Object.fromEntries(STAFF.map(r => [r.id, r]));
  const staffLevel = (s, id) => (s.staff && s.staff[id]) || 0;
  const staffCfg = (s, id) => { const lv = staffLevel(s, id); return lv ? STAFF_BY_ID[id].levels[lv - 1] : null; };
  const staffNext = (s, id) => STAFF_BY_ID[id].levels[staffLevel(s, id)] || null;

  // Perks are bought with Roast Points. Spending never lowers the +2% bonus,
  // which counts every point ever earned.
  const PERKS = [
    { id: 'headstart', name: 'Head Start',    cost: 1, icon: 'Rocket',   desc: 'Every new chain opens with $2,500 in the till and Better Beans already on the shelf.' },
    { id: 'goldhour',  name: 'Golden Hour',   cost: 2, icon: 'Sun',      desc: 'Golden beans show up 40% more often and wait 5 seconds longer.' },
    { id: 'regulars',  name: 'Regulars',      cost: 2, icon: 'Heart',    desc: 'A crowd that never leaves. +25% all income.' },
    { id: 'deepsleep', name: 'Deep Sleep',    cost: 2, icon: 'BedDouble', desc: 'Away earnings run for 8 hours instead of 4, at +25% rate.' },
    { id: 'memory',    name: 'Muscle Memory', cost: 3, icon: 'Brain',    desc: 'Loyalty App and Barista Training survive selling the chain.' },
    { id: 'sharpnose', name: 'Sharp Nose',    cost: 4, icon: 'Wind',     desc: 'You can smell a good lot a mile off. Bean upgrades cost 30% less.' },
    { id: 'overdrive', name: 'Overdrive',     cost: 5, icon: 'Gauge',    desc: 'Machines keep doubling at 150, 200, 300 and 400 owned.' },
    { id: 'rushhour',  name: 'Rush Hour',     cost: 6, icon: 'Timer',    desc: 'Rush buffs from golden beans last twice as long.' },
    { id: 'landlord',  name: 'Landlord',      cost: 3, icon: 'Building2', desc: 'You own the building. Selling the chain keeps your café.' },
    { id: 'patience',  name: 'Patient Regulars', cost: 2, icon: 'ClipboardList', desc: 'Order tickets wait 50% longer before the customer gives up.' },
    { id: 'crew',      name: 'Loyal Crew',    cost: 3, icon: 'Users',     desc: 'Your staff follow you when you sell the chain.' },
  ];
  const PERK_BY_ID = Object.fromEntries(PERKS.map(p => [p.id, p]));

  // Achievements. Each one earned adds +1% to all income (reputation).
  const ACH = [];
  GENS.forEach((g, gi) => {
    ACH.push({ id: g.id + '_1',   name: 'First ' + g.name,      desc: 'Own a ' + g.name.toLowerCase() + '.',         icon: g.icon, test: s => s.owned[gi] >= 1 });
    ACH.push({ id: g.id + '_50',  name: g.plural + ' ×50',       desc: 'Own 50 ' + g.plural.toLowerCase() + '.',      icon: g.icon, test: s => s.owned[gi] >= 50 });
    ACH.push({ id: g.id + '_100', name: g.plural + ' ×100',      desc: 'Own 100 ' + g.plural.toLowerCase() + '.',     icon: g.icon, test: s => s.owned[gi] >= 100 });
  });
  [['earn3', 'Pocket Money', 1e3], ['earn6', 'Millionaire', 1e6], ['earn9', 'Billionaire', 1e9], ['earn12', 'Trillionaire', 1e12], ['earn15', 'Quadrillionaire', 1e15], ['earn18', 'Quintillionaire', 1e18]]
    .forEach(([id, name, n]) => ACH.push({ id, name, desc: 'Earn $' + fmt(n) + ' all time.', icon: 'Wallet', test: s => s.lifetime >= n }));
  [['taps2', 'Warm Fingers', 100], ['taps3', 'Carpal Tunnel', 1000], ['taps4', 'Tap Legend', 10000]]
    .forEach(([id, name, n]) => ACH.push({ id, name, desc: 'Tap the cup ' + fmt(n) + ' times.', icon: 'Hand', test: s => s.taps >= n }));
  [['gold1', 'Lucky Bean', 1], ['gold10', 'Bean Hunter', 10], ['gold50', 'Golden Touch', 50]]
    .forEach(([id, name, n]) => ACH.push({ id, name, desc: 'Catch ' + n + ' golden bean' + (n > 1 ? 's' : '') + '.', icon: 'Star', test: s => s.goldCaught >= n }));
  ACH.push({ id: 'sold1', name: 'Cashed Out', desc: 'Sell the chain once.', icon: 'Sparkles', test: s => s.prestiges >= 1 });
  ACH.push({ id: 'sold3', name: 'Serial Founder', desc: 'Sell the chain three times.', icon: 'Sparkles', test: s => s.prestiges >= 3 });
  ACH.push({ id: 'beans_all', name: 'Connoisseur', desc: 'Buy every bean upgrade in one run.', icon: 'Bean', test: s => BEANS.every((_, i) => s.upgrades['beans' + i]) });
  ACH.push({ id: 'gear_all', name: 'Fully Kitted', desc: 'Install every piece of gear in one run.', icon: 'Wrench', test: s => GENS.every(g => s.upgrades[g.id + '_gear1'] && s.upgrades[g.id + '_gear2']) });
  ACH.push({ id: 'allgens', name: 'Full House', desc: 'Own at least one of every tier.', icon: 'Trophy', test: s => s.owned.every(n => n >= 1) });
  ACH.push({ id: 'rate6', name: 'Cash Machine', desc: 'Earn $1.00M per second.', icon: 'Gauge', test: s => cashPerSec(s) >= 1e6 });
  ACH.push({ id: 'rate9', name: 'Money Printer', desc: 'Earn $1.00B per second.', icon: 'Gauge', test: s => cashPerSec(s) >= 1e9 });

  function newState(now) {

  function genCost(gi, owned, n) {

<script>
// ---- Bean Baron scene ---------------------------------------------------
// A little 2D café drawn on a canvas. It is decoration that reads the game:

const BeanBaronScene = (() => {
  const W = 360;
  const MIN_WORLD_H = 250;          // below this the view scrolls instead of squashing the room
  const NAMES = ['Maya', 'Theo', 'Priya', 'Jonas', 'Amara', 'Kai', 'Lena', 'Diego', 'Noor', 'Felix', 'Sana', 'Milo', 'Ada', 'Ravi', 'June', 'Omar', 'Ivy', 'Luca', 'Zoe', 'Nico', 'Hana', 'Sam', 'Rosa', 'Eli', 'Tomas', 'Wren'];
  const DRINKS = [
    { name: 'latte', color: '#e9c9a3', kind: 'espresso' }, { name: 'cappuccino', color: '#d9b48a', kind: 'espresso' },
    { name: 'flat white', color: '#f0d9bb', kind: 'espresso' }, { name: 'americano', color: '#5b3620', kind: 'espresso' },
    { name: 'mocha', color: '#7a4a2e', kind: 'espresso' }, { name: 'cortado', color: '#c9a077', kind: 'espresso' },
    { name: 'drip coffee', color: '#4a2a16', kind: 'drip' }, { name: 'pour-over', color: '#6a3d22', kind: 'drip' },
    { name: 'cold brew', color: '#3a2214', kind: 'drip' },
  ];
  const SKIN = ['#f2cba7', '#e0aa80', '#c68a5b', '#8d5a3b', '#5c3a25', '#f7dcc3'];
  const HAIR = ['#2b1b12', '#5a3a25', '#c78a3e', '#e8d3a0', '#1a1a1a', '#8a2f1f', '#d94f7a', '#6d6d6d'];
  const SHIRT = ['#3b6ea5', '#d95d39', '#5aa06a', '#8e5bb5', '#e2b53d', '#3f8f9f', '#c94c6d', '#6b6b6b', '#f1f1f1', '#2e2e2e', '#f2a65a'];
  const CARS = ['#d84a4a', '#3e78c2', '#f0c040', '#8fa8b8', '#f6f6f6', '#2c2c2c', '#5fae6a'];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  // What each premises size looks like: building extents, table rows, how
  // many machines of each kind fit on the back wall.
  const TIERS = [
    { x0: 0,  x1: 360, interior: false, rows: 0, slots: [1, 1, 0], registerX: 124 },
    { x0: 40, x1: 220, interior: true,  rows: 1, slots: [2, 1, 1] },
    { x0: 20, x1: 300, interior: true,  rows: 2, slots: [3, 2, 1] },
    { x0: 0,  x1: 360, interior: true,  rows: 3, slots: [4, 3, 2] },
    { x0: 0,  x1: 360, interior: true,  rows: 3, slots: [4, 3, 2], fancy: true },
  ];

  function layout(H, tier) {
    const T = TIERS[Math.max(0, Math.min(tier || 0, TIERS.length - 1))];
    const extra = Math.max(0, H - 300);
    const bgBottom = Math.round(62 + extra * 0.36);
    const interiorTop = bgBottom + 4;
    const roadH = Math.round(34 + extra * 0.1), walkH = Math.round(18 + extra * 0.07), wallH = 8;
    // the room is only as deep as its tables need; anything left becomes street and park
    const need = 36 + 28 + 36 + T.rows * 56 + 34;
    const interiorBottom = Math.min(H - roadH - walkH - wallH, interiorTop + need);
    const backY = interiorTop + 4;          // machines on the back wall
    const laneY = interiorTop + 26;         // where baristas walk
    const counterY = interiorTop + 36;      // counter top edge (14 tall)
    const queueY = counterY + 28;
    const tables = [];
    for (let y = queueY + 36, r = 0; y <= interiorBottom - 32 && r < T.rows; y += 56, r++) {
      for (let x = T.x0 + 44; x <= T.x1 - 30; x += 72) tables.push({ x, y, seats: [{ x: x - 18, y: y + 1, taken: null }, { x: x + 18, y: y + 1, taken: null }] });
    }
    const registerX = T.registerX != null ? T.registerX : T.x0 + 84;
    const wide = T.x1 - T.x0 >= 300;
    let cx = T.interior ? T.x0 + (wide ? 100 : 60) : registerX + 4;
    const slots = { drip: [], espresso: [], roaster: [] };
    for (let i = 0; i < T.slots[0]; i++) { cx += 10; slots.drip.push(cx); cx += 10; }
    for (let i = 0; i < T.slots[1]; i++) { cx += 14; slots.espresso.push(cx); cx += 16; }
    for (let i = 0; i < T.slots[2]; i++) { cx += 14; slots.roaster.push(cx); cx += 16; }
    const doorX = T.interior ? T.x0 + 73.5 : registerX - 18;     // between the first two table columns, a step from the register
    const maxQueue = Math.max(2, Math.min(8, Math.floor((T.x1 - 8 - registerX) / 18)));
    return { H, T, tier, extra, wide, bgBottom, interiorTop, interiorBottom, backY, laneY, counterY, queueY, tables, slots, maxQueue,
      doorX, registerX, aisleX: doorX, bottomCorridor: interiorBottom - 12,
      walkY: interiorBottom + wallH + walkH / 2, roadTop: interiorBottom + wallH + walkH,
      roadH, lane1: interiorBottom + wallH + walkH + 9 + (roadH - 34) * 0.3, lane2: interiorBottom + wallH + walkH + 24 + (roadH - 34) * 0.7 };
  }

  function create(canvas, getGame, E) {
    let R = null, ctx = null;
    const S = {
      t: 0, scale: 1, H: 277, tier: getGame().cafe || 0, L: layout(277, getGame().cafe || 0),
      customers: [], baristas: [], vehicles: [], particles: [], log: [],
      machines: [], counts: null, spawnT: 1.5, passT: 2, tapJiggle: 0,
      served: 0, staffFigs: [], critters: [], birdT: 8, catT: 40, shadow: { dx: 0, alpha: 0.22 }, focus: null, clouds: Array.from({ length: 5 }, (_, i) => ({ x: i * 80 + rnd(0, 40), y: 4 + rnd(0, 18), w: rnd(16, 30), v: rnd(2, 5) })),
    };
    let dpr = 1, cssW = 360, cssH = 277;
    R = makeRenderer3D(canvas);
    if (!R) ctx = canvas.getContext('2d');

    function resize(force) {
      const r = canvas.getBoundingClientRect();
      if (r.width < 10 || r.height < 10) return;
      dpr = Math.min(3, window.devicePixelRatio || 1);
      cssW = r.width; cssH = r.height;
      let newH;
      if (R) {
        const fh = R.frame(cssW, cssH, dpr);
        S.scale = cssW / 372;
        S.visH = (fh - 30) / R.SINP;
      } else {
        canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
        S.scale = cssW / W;
        S.visH = cssH / S.scale;
      }
      newH = Math.max(S.visH, MIN_WORLD_H);
      const big = force || Math.abs(newH - S.H) > 40;
      S.H = newH;
      const oldTables = S.L.tables;
      S.L = layout(S.H, S.tier);
      if (!big) {                         // a modest change: keep everyone, re-seat them on the new layout
        for (const c of S.customers) {
          if (!c.table) continue;
          const ti = oldTables.indexOf(c.table), si = ti >= 0 ? c.table.seats.indexOf(c.seat) : -1;
          const nt = S.L.tables[ti];
          if (nt && si >= 0) { c.table = nt; c.seat = nt.seats[si]; c.seat.taken = c; if (c.state === 'sit') { c.x = c.seat.x; c.y = c.seat.y; } else if (c.path) c.path = [{ x: c.seat.x, y: S.L.queueY }, { x: c.seat.x, y: c.seat.y }]; }
          else { c.table = null; c.seat = null; c.state = 'leave'; c.path = null; }
        }
        S.baristas.forEach((b, i) => { b.home.x = S.L.registerX + 14 + i * 26; b.home.y = S.L.laneY; });
        rebuildMachines(true);
        return;
      }
      // the room changed shape: clear the floor and let it refill
      S.customers = [];
      for (const t of S.L.tables) for (const s of t.seats) s.taken = null;
      for (const b of S.baristas) { b.state = 'idle'; b.customer = null; b.machine = null; b.cup = false; b.y = S.L.laneY; b.home.y = S.L.laneY; }
      S.baristas.forEach((b, i) => { b.home.x = S.L.registerX + 14 + i * 26; b.x = b.home.x; });
      for (const f of S.staffFigs) { f.waypoint = null; f.x = S.L.registerX; f.y = S.L.laneY; }
      for (const m of S.machines) if (m.type !== 'roaster') m.busy = false;
      S.spawnT = Math.min(S.spawnT, 0.5);
      rebuildMachines(true);
    }

    function log(text) { S.log.unshift({ text, t: S.t }); S.log.length = Math.min(S.log.length, 6); }

    // Machines along the back wall: drip machines, espresso bars, roasters.
    function rebuildMachines(force) {
      const g = getGame();
      const key = g.owned.join(',') + '|' + (g.cafe || 0);
      if (!force && S.counts === key) return;
      S.counts = key;
      S.staticsDirty = true;
      const sl = S.L.slots;
      const drips = Math.min(sl.drip.length, g.owned[0]), esp = Math.min(sl.espresso.length, g.owned[1]), roast = Math.min(sl.roaster.length, g.owned[3]);
      const m = [];
      for (let i = 0; i < drips; i++) m.push({ type: 'drip', x: sl.drip[i], busy: false, anim: 0 });
      for (let i = 0; i < esp; i++) m.push({ type: 'espresso', x: sl.espresso[i], busy: false, anim: 0 });
      for (let i = 0; i < roast; i++) m.push({ type: 'roaster', x: sl.roaster[i], busy: true, anim: rnd(0, 6) });
      // keep animation phases of survivors
      for (const n of m) { const o = S.machines.find(o => o.type === n.type && o.x === n.x); if (o) { n.anim = o.anim; n.busy = o.busy; } }
      S.machines = m;
      const nb = 1 + (g.owned[2] >= 1 ? 1 : 0) + (g.owned[2] >= 5 ? 1 : 0) + (g.owned[2] >= 20 ? 1 : 0) + (g.owned[2] >= 50 ? 1 : 0);
      while (S.baristas.length < nb) {
        const i = S.baristas.length;
        S.baristas.push(person({ x: S.L.registerX + 14 + i * 26, y: S.L.laneY, home: { x: S.L.registerX + 14 + i * 26, y: S.L.laneY }, state: 'idle', cup: false, owner: i === 0, hat: null, shirt: '#F6E7CF', working: false }));
      }
      while (S.baristas.length > nb) { const b = S.baristas.pop(); if (b.customer) b.customer.state = 'queue'; if (b.machine) b.machine.busy = false; }
      S.baristas.forEach((b, i) => { b.home.x = S.L.registerX + 14 + i * 26; });
      // hired staff each get a figure with a job to do
      const roles = STAFF_ROLES.filter(r => g.staff && g.staff[r.id]);
      S.staffFigs = S.staffFigs.filter(f => roles.some(r => r.id === f.role));
      for (const r of roles) if (!S.staffFigs.some(f => f.role === r.id)) S.staffFigs.push(person({ role: r.id, apron: r.apron, shirt: '#F6E7CF', hat: null, x: S.L.registerX, y: S.L.laneY, state: 'staff', t: 0, waypoint: null, name: r.name }));
      const nv = g.owned[4] >= 30 ? 3 : g.owned[4] >= 10 ? 2 : g.owned[4] >= 1 ? 1 : 0;
      const vans = S.vehicles.filter(v => v.kind === 'van');
      while (vans.length < nv) { const v = { kind: 'van', x: rnd(-60, W + 60), lane: 1, speed: rnd(34, 44), color: '#D9642A', wheel: 0 }; S.vehicles.push(v); vans.push(v); }
      while (vans.length > nv) { const v = vans.pop(); S.vehicles.splice(S.vehicles.indexOf(v), 1); }
      while (S.vehicles.filter(v => v.kind === 'car').length < 2) S.vehicles.push({ kind: 'car', x: rnd(-80, W + 80), lane: Math.random() < 0.5 ? 1 : 2, speed: rnd(38, 60), color: pick(CARS), wheel: 0 });
    }

    // --- people -----------------------------------------------------------
    const PANTS = ['#2e2e2e', '#3b4a6b', '#5a4632', '#6b6b6b', '#8b3a3a', '#1f2f3f'];
    const STAFF_ROLES = [
      { id: 'tapper', name: 'Tapper', apron: '#D9642A' }, { id: 'runner', name: 'Order Runner', apron: '#9CC98B' },
      { id: 'clerk', name: 'Stock Clerk', apron: '#3e78c2' }, { id: 'greeter', name: 'Greeter', apron: '#d94f7a' }, { id: 'manager', name: 'Shift Manager', apron: '#F2A65A' },
    ];
    function person(extra) {
      return Object.assign({ name: pick(NAMES), skin: pick(SKIN), hair: pick(HAIR), shirt: pick(SHIRT), pants: pick(PANTS),
        hat: Math.random() < 0.22 ? pick(SHIRT) : null, glasses: Math.random() < 0.18, seed: rnd(0, 6.28),
        x: 0, y: 0, walk: 0, path: null, t: 0, holding: false, bubble: null, face: 1, dir: 'down', moving: false, sip: 0 }, extra);
    }
    function moveTo(e, tx, ty, speed, dt) {
      const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
      if (d < 0.6) { e.x = tx; e.y = ty; return true; }
      const step = Math.min(d, speed * dt);
      e.x += dx / d * step; e.y += dy / d * step;
      e.walk += dt * 11; e.moving = true;
      if (Math.abs(dx) > Math.abs(dy) * 1.2) { e.dir = 'side'; e.face = dx > 0 ? 1 : -1; } else e.dir = dy > 0 ? 'down' : 'up';
      return d - step < 0.6;
    }
    function followPath(e, speed, dt) {
      if (!e.path || !e.path.length) return true;
      if (moveTo(e, e.path[0].x, e.path[0].y, speed, dt)) e.path.shift();
      return e.path.length === 0;
    }
    const queueSpot = i => ({ x: S.L.registerX + i * 18, y: S.L.queueY });
    function queued() { return S.customers.filter(c => c.state === 'queue').sort((a, b) => a.qi - b.qi); }
    function pickupSpot(k) { return { x: S.L.registerX - 20 - k * 14, y: S.L.queueY }; }
    function reindexQueue() { queued().forEach((c, i) => { c.qi = i; }); }
    function freeSeat() { const seats = []; for (const t of S.L.tables) for (const s of t.seats) if (!s.taken) seats.push({ t, s }); return seats.length ? pick(seats) : null; }

    function spawnCustomer(rush) {
      const L = S.L;
      const fromLeft = Math.random() < 0.5;
      const q = queued().length, coming = S.customers.filter(c => c.state === 'arrive').length;
      const c = person({ drink: pick(DRINKS), x: fromLeft ? -12 : W + 12, y: L.walkY + rnd(-3, 3), state: 'arrive', qi: q });
      if (q + coming >= L.maxQueue) { c.state = 'passby'; c.path = [{ x: fromLeft ? W + 16 : -16, y: c.y }]; S.customers.push(c); return; }
      c.path = [{ x: L.doorX, y: L.walkY }, { x: L.doorX, y: L.queueY }];
      c.state = 'arrive';
      S.customers.push(c);
    }
    function spawnPasserby() {
      const fromLeft = Math.random() < 0.5;
      const c = person({ x: fromLeft ? -12 : W + 12, y: S.L.walkY + rnd(-4, 4), state: 'passby' });
      c.path = [{ x: fromLeft ? W + 16 : -16, y: c.y }];
      S.customers.push(c);
    }

    function updatePeople(dt, g, rush) {
      const L = S.L;
      const roomy = Math.max(1, Math.pow(S.H / 277, 0.85));      // taller rooms mean longer walks
      const speed = (rush ? 44 : 30) * roomy;
      for (const c of S.customers) c.moving = false;
      for (const b of S.baristas) b.moving = false;
      for (const c of S.customers) {
        if (c.state === 'sit') { c.sip -= dt; if (c.sip <= 0) c.sip = rnd(3, 7); }
        switch (c.state) {
          case 'passby': if (followPath(c, 34, dt)) c.dead = true; break;
          case 'arrive': if (followPath(c, c.y > L.interiorBottom ? speed * 1.5 : speed, dt)) { c.state = 'queue'; c.qi = queued().length - 1; reindexQueue(); c.bubble = c.drink; log(`${c.name} wants ${/^[aeiou]/.test(c.drink.name) ? 'an' : 'a'} ${c.drink.name}`); } break;
          case 'queue': { const spot = queueSpot(c.qi); if (moveTo(c, spot.x, spot.y, speed, dt)) c.dir = 'up'; break; }
          case 'ordering': if (c.wait && moveTo(c, c.wait.x, c.wait.y, speed, dt)) c.dir = 'up'; break;
          case 'served': {
            const seat = Math.random() < 0.7 ? freeSeat() : null;
            if (seat) {
              seat.s.taken = c; c.seat = seat.s; c.table = seat.t; c.state = 'toTable';
              c.path = [{ x: seat.s.x, y: L.queueY }, { x: seat.s.x, y: seat.s.y }];
            } else { c.state = 'leave'; c.path = null; }
            break;
          }
          case 'toTable': if (followPath(c, speed, dt)) { c.state = 'sit'; c.t = rnd(7, 16); c.dir = 'side'; c.face = c.x < c.table.x ? 1 : -1; c.sip = rnd(1, 3); } break;
          case 'sit': c.t -= dt; if (c.t <= 0) { c.seat.taken = null; c.table.cup = null; c.holding = false; c.state = 'leave'; c.path = null; log(`${c.name} left happy`); } break;
          case 'leave': {
            if (!c.path) c.path = c.table
              ? [{ x: c.x, y: L.bottomCorridor }, { x: L.doorX, y: L.bottomCorridor }, { x: L.doorX, y: L.walkY }, { x: Math.random() < 0.5 ? -16 : W + 16, y: L.walkY + rnd(-3, 3) }]
              : [{ x: L.doorX, y: c.y }, { x: L.doorX, y: L.walkY }, { x: Math.random() < 0.5 ? -16 : W + 16, y: L.walkY + rnd(-3, 3) }];
            if (followPath(c, c.y > L.interiorBottom ? speed * 1.5 : speed, dt)) c.dead = true;
            break;
          }
        }
      }
      if (S.customers.some(c => c.dead)) { S.customers = S.customers.filter(c => !c.dead); reindexQueue(); }

      // baristas
      const bspeed = (rush ? 70 : 46) * roomy;
      for (const b of S.baristas) {
        b.walk += dt * (b.state === 'toMachine' || b.state === 'back' ? 10 : 0);
        switch (b.state) {
          case 'idle': {
            if (moveTo(b, b.home.x, b.home.y, bspeed, dt)) b.dir = 'down';
            const head = queued().find(c => c.state === 'queue' && c.qi === 0 && Math.abs(c.x - queueSpot(0).x) < 2);
            if (!head) break;
            let m = S.machines.filter(x => !x.busy && x.type === head.drink.kind)[0] || S.machines.filter(x => !x.busy && x.type !== 'roaster')[0] || null;
            if (!m && S.machines.some(x => x.type !== 'roaster')) break;    // all busy: wait
            head.state = 'ordering'; head.qi = 99; head.wait = pickupSpot(S.customers.filter(c => c.state === 'ordering').length); reindexQueue();
            b.customer = head; b.machine = m; b.state = 'toMachine';
            if (m) m.busy = true;
            b.t = (m ? (m.type === 'espresso' ? 1.3 : 1.8) : 2.2) * (rush ? 0.5 : 1);
            break;
          }
          case 'toMachine': if (moveTo(b, b.machine ? b.machine.x : L.registerX + 10, L.laneY, bspeed, dt)) b.state = 'brewing'; break;
          case 'brewing': b.dir = 'up'; b.working = true; b.t -= dt; if (b.t <= 0) { if (b.machine) { b.machine.busy = false; b.machine.anim = 0; } b.cup = true; b.state = 'back'; b.working = false; } break;
          case 'back': if (moveTo(b, L.registerX + 4, L.laneY, bspeed, dt)) {
            const c = b.customer; b.cup = false; b.state = 'idle'; b.machine = null; b.customer = null;
            if (c && !c.dead) { c.holding = true; c.bubble = null; c.state = 'served'; c.qi = 99; reindexQueue(); S.served++;
              S.particles.push({ kind: 'text', text: '+' + E.fmtCash(E.cupPrice(g), E.cupPrice(g) < 10 ? 1 : undefined), x: L.registerX, y: L.counterY - 4, vy: -14, life: 1 });
              if (R) R.burstCoins(L.registerX + 4, L.counterY + 2, 4);
              if (Math.random() < 0.35) S.particles.push({ kind: 'text', text: 'Perfect', x: L.registerX + 30, y: L.counterY + 10, vy: -12, life: 1.2, color: '#F2A65A' });
              S.particles.push({ kind: 'text', text: '♥', x: c.x, y: c.y - 16, vy: -10, life: 1, color: '#e0506e' });
              if (c.table) c.table.cup = c.drink; }
            break;
          }
        }
        if (b.state === 'brewing' && b.machine) b.machine.anim += dt;
      }
      // staff loops
      for (const f of S.staffFigs) {
        f.moving = false; f.t -= dt;

    // birds over the roofs, the odd cat along the sidewalk

    function update(dt) {
      const g = getGame();
      S.t += dt;
      if ((g.cafe || 0) !== S.tier) { S.tier = g.cafe || 0; resize(true); }
      rebuildMachines(false);
      const rush = E.buffActive(g, 'rush');
      const cps = E.cupsPerSec(g);
      // busier shop as the chain grows; capped so it never turns into a mob
      const intensity = clamp(Math.log10(cps + 1) / 4.5, 0, 1);
      const gap = lerp(6.5, 0.8, intensity) / (rush ? 2.2 : 1);
      S.spawnT -= dt;

        if (R) { const w = R.unproject(xp, yp); if (w) { x = w.x; y = w.y; } }
        const all = S.customers.concat(S.baristas, S.staffFigs);
        let best = null, bd = 14;
        for (const p of all) { const d = Math.hypot(p.x - x, p.y - (y + 6)); if (d < bd) { bd = d; best = p; } }
        S.focus = best ? { p: best, until: S.t + 2.5 } : null;
        return !!best;
      },
      cheer(text) { S.particles.push({ kind: 'text', text, x: S.L.registerX + 20, y: S.L.counterY - 8, vy: -16, life: 1.3, color: '#9CC98B' }); if (R) R.burstCoins(S.L.registerX + 4, S.L.counterY + 2, 8); },
      clock() { const p = dayPhase(); const day = Math.floor(S.t / 480) + 1; const name = p < 0.2 ? 'Morning' : p < 0.45 ? 'Afternoon' : p < 0.62 ? 'Evening' : p < 0.9 ? 'Night' : 'Early morning'; return { day, name }; },
      tap() { S.tapJiggle = 1; },
      log: S.log,
      served: () => S.served,
      destroy() { cancelAnimationFrame(raf); if (ro) ro.disconnect(); },
    };
  }
  return { create };
})();
// ---- end scene ----------------------------------------------------------
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;
const E = BeanBaronEconomy;
const L = LucideReact;

const ACH_BY_ID = Object.fromEntries(E.ACH.map(a => [a.id, a]));

const SAVE_EVERY = 5000;

const encodeSave = s => btoa(unescape(encodeURIComponent(JSON.stringify(s))));
function decodeSave(str) {
  try {
    const s = JSON.parse(decodeURIComponent(escape(atob(str.trim()))));
    if (!s || s.v !== 1 || !Array.isArray(s.owned) || s.owned.length !== E.GENS.length) return null;
    return s;
  } catch (e) { return null; }
}
// Older saves lack newer fields; defaults fill the gaps.
function resumeFrom(save) {
  const fresh = E.newState(Date.now());
  const s = E.fitCafe({ ...fresh, ...save, buffs: { ...fresh.buffs, ...(save.buffs || {}) }, staff: save.staff || {}, gold: null, events: [], awayReport: null });
  const away = (Date.now() - (save.savedAt || Date.now())) / 1000;
  return away > AWAY_MIN ? E.applyOffline(s, away) : s;
}

// Tiny synth so the shop makes noises without shipping any audio files.
const Sound = (() => {
  let ctx = null, muted = false;
  const ensure = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function blip(freq, dur, type, gain, slide) {
    if (muted) return;
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
  }
  return {
    setMuted: m => { muted = m; if (!m) ensure(); },
    tap: () => blip(480 + Math.random() * 90, 0.07, 'triangle', 0.045, 760),
    buy: () => { blip(660, 0.1, 'square', 0.028, 900); setTimeout(() => blip(990, 0.14, 'square', 0.028, 1320), 60); },
    nope: () => blip(160, 0.12, 'sawtooth', 0.02, 110),
    gold: () => [0, 80, 160, 240].forEach((d, i) => setTimeout(() => blip(880 * Math.pow(1.2, i), 0.22, 'sine', 0.05), d)),
    chime: () => [0, 110].forEach((d, i) => setTimeout(() => blip(i ? 1318 : 1046, 0.3, 'sine', 0.045), d)),
    bell: () => { blip(2093, 0.5, 'sine', 0.035); setTimeout(() => blip(2637, 0.6, 'sine', 0.025), 40); },
  };
})();

// Procedural lo-fi café music: four chords, a lazy bass, a wandering melody
// and brushed hats, scheduled a little ahead on the audio clock.
const Music = (() => {
  let ctx = null, master = null, filter = null, noise = null, timer = null, playing = false;
  let nextTime = 0, step = 0, tempo = 84, lastNote = 7;
  const CHORDS = [[0, 4, 7, 11], [9, 12, 16, 19], [5, 9, 12, 16], [7, 11, 14, 17]];
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19];
  const freq = n => 261.63 * Math.pow(2, n / 12);
  function ensure() {
    if (ctx) return true;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
    master = ctx.createGain(); master.gain.value = 0;
    filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 2400; filter.Q.value = 0.6;
    master.connect(filter).connect(ctx.destination);
    const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    noise = buf;
    return true;
  }
  function tone(t, f, dur, type, gain, detune) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f; if (detune) o.detune.value = detune;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function hat(t, gain) {
    const src = ctx.createBufferSource(); src.buffer = noise;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
    const g = ctx.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    src.connect(hp).connect(g).connect(master); src.start(t); src.stop(t + 0.08);
  }
  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.2);
  }
  function playStep(i, t) {
    const beat = 60 / tempo, chord = CHORDS[Math.floor(i / 8) % CHORDS.length], pos = i % 8;
    if (pos === 0) for (const n of chord) { tone(t, freq(n), beat * 4, 'triangle', 0.028, 4); tone(t, freq(n), beat * 4, 'sine', 0.02, -5); }
    if (pos === 0 || pos === 4) { tone(t, freq(chord[0] - 24), beat * 1.6, 'sine', 0.09); kick(t); }
    if (pos === 6) tone(t, freq(chord[2] - 24), beat * 0.8, 'sine', 0.07);
    if (pos % 2 === 1) hat(t, pos === 3 || pos === 7 ? 0.05 : 0.025);
    if (Math.random() < 0.42) {
      const cand = SCALE.filter(n => Math.abs(n - lastNote) <= 5 && n !== lastNote);
      lastNote = cand[Math.floor(Math.random() * cand.length)];
      tone(t + (Math.random() < 0.3 ? beat * 0.25 : 0), freq(lastNote + 12), beat * (Math.random() < 0.5 ? 0.9 : 1.6), 'triangle', 0.05);
    }
  }
  function schedule() {
    if (!playing) return;
    while (nextTime < ctx.currentTime + 0.35) { playStep(step, nextTime); nextTime += 60 / tempo / 2; step++; }
  }
  return {
    start() {
      if (!ensure()) return;
      if (ctx.state === 'suspended') ctx.resume();
      if (playing) return;
      playing = true; nextTime = ctx.currentTime + 0.1; step = 0;
      master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(0.0001, ctx.currentTime); master.gain.exponentialRampToValueAtTime(0.6, ctx.currentTime + 1.5);
      timer = setInterval(schedule, 90);
    },
    stop() {
      if (!playing) return;
      playing = false; clearInterval(timer);
      master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime); master.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
    },
    setTempo(t) { tempo = t; },
    get playing() { return playing; },
  };
})();

// Cash ticks toward its real value every frame instead of jumping 30 times a second.
function SmoothCash({ value }) {
  const [shown, setShown] = useState(value);
  const target = useRef(value); target.current = value;
  const cur = useRef(value);
  useEffect(() => {
    let raf;
    const loop = () => {
      raf = requestAnimationFrame(loop);
      const t = target.current, c = cur.current;
      if (c === t) return;
      const d = t - c;
      const next = Math.abs(d) < Math.max(0.005, Math.abs(t) * 1e-7) ? t : c + d * 0.22;
      cur.current = next; setShown(next);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);
  return <span>{E.fmtCash(shown)}</span>;
}
