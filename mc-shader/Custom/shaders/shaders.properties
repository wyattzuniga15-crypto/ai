# ============================================================================
# Custom - shaders.properties
# Target: Iris 1.10.x on Minecraft 1.21.11 (Fabric), Sodium 0.8.x
#
# The full buffer layout is documented at the top of deferred.fsh and in
# NOTES.md. Formats are set explicitly rather than inheriting the RGBA8
# default, because anything carrying HDR colour or a normal needs float
# storage - RGBA8 would clamp at 1.0 and flatten every normal to 8 bits.
#
# Every directive below is on a single line on purpose. Backslash line
# continuation is a Java .properties feature and Iris's parser is not
# documented as supporting it, so wrapping a long screen list would be a
# silent misparse rather than an error.
# ============================================================================

# ---- Buffer formats --------------------------------------------------------
colortex0Format = RGBA16F
colortex1Format = RGBA16F
colortex2Format = RGBA16F
# AO is a single scalar; one 16-bit channel is all it needs.
colortex3Format = R16F
# Translucent surface colour (HDR, so float) and its normal.
colortex4Format = RGBA16F
colortex5Format = RGBA16F

# ---- Bloom mip chain -------------------------------------------------------
# Five levels. Each is a real buffer at a real resolution rather than tiles
# packed into one texture, so every downsample/upsample pass runs at its own
# level's resolution instead of rasterising a full-screen quad to touch a
# corner of it.
#
# .a carries mean log-luminance down the chain for auto-exposure - the
# downsample filter averages it along with the colour for free.
colortex6Format  = RGBA16F
colortex7Format  = RGBA16F
colortex8Format  = RGBA16F
colortex9Format  = RGBA16F
colortex10Format = RGBA16F
size.buffer.colortex6  = 0.5 0.5
size.buffer.colortex7  = 0.25 0.25
size.buffer.colortex8  = 0.125 0.125
size.buffer.colortex9  = 0.0625 0.0625
size.buffer.colortex10 = 0.03125 0.03125

# Exposure history. 8x8 rather than 1x1 so nothing depends on a 1-pixel
# viewport; only the first texel does work. Clearing is disabled in
# composite6.fsh (colortex11Clear) because this buffer IS the adaptation
# history - clearing it every frame would remove the thing that makes
# adaptation gradual.
colortex11Format = R32F
size.buffer.colortex11 = 8 8

# ---- Shadow pass -----------------------------------------------------------
# Everything that should cast a shadow, does. Light-emitting block entities are
# excluded: a glowing block casting a shadow on itself reads as a bug.
shadowTerrain = true
shadowEntities = true
shadowBlockEntities = true
shadowLightBlockEntities = false
shadowTranslucent = true

# ---- Translucent handling --------------------------------------------------
# Blending is OFF for gbuffers_water on purpose. Water is written to
# colortex4/5 and resolved in composite instead, because refraction and
# Beer-Lambert absorption both need the scene *behind* the surface, and
# blending destroys it. It also leaves depthtex0/depthtex1 as a free
# measurement of the path length through the water.
#
# The cost: only the nearest translucent surface survives per pixel, so two
# stacked panes of glass resolve as one.
blend.gbuffers_water = off

# ---- Sky ------------------------------------------------------------------
# Vanilla clouds are replaced by the raymarched layer in gbuffers_skybasic, so
# turn the vanilla geometry off rather than drawing both. Shader options are
# usable as preprocessor conditions here, so this follows the toggle.
#ifdef VOLUMETRIC_CLOUDS
clouds = off
#endif

# ---- Program gating --------------------------------------------------------
# With SSAO off the whole occlusion pass is skipped rather than running and
# writing 1.0 everywhere.
program.deferred.enabled = SSAO
# gbuffers_clouds only has work to do when vanilla clouds are being drawn.
program.gbuffers_clouds.enabled = !VOLUMETRIC_CLOUDS

# The whole bloom chain is nine passes; skip all of them when bloom is off.
program.composite1.enabled  = BLOOM || AUTO_EXPOSURE
program.composite2.enabled  = BLOOM || AUTO_EXPOSURE
program.composite3.enabled  = BLOOM || AUTO_EXPOSURE
program.composite4.enabled  = BLOOM || AUTO_EXPOSURE
program.composite5.enabled  = BLOOM || AUTO_EXPOSURE
program.composite6.enabled  = AUTO_EXPOSURE
program.composite7.enabled  = BLOOM
program.composite8.enabled  = BLOOM
program.composite9.enabled  = BLOOM
program.composite10.enabled = BLOOM

# Vanilla draws its own vignette overlay; ours would stack on top of it.
vignette = false

# ============================================================================
# Options GUI
# ============================================================================
# Each sub-screen holds only the options that belong to it. Sliders are listed
# once, in a single global list, even for options that live in a sub-screen -
# that is what Iris expects.

screen = <empty> <profile> <empty> [COLOR] [LIGHTING] [SHADOWS] [WATER] [SKY] [POST] <empty> *
screen.columns = 2

# ---- Colour ----------------------------------------------------------------
# Put first: this is the screen to reach for when the image looks wrong
# overall, rather than wrong in one specific effect.
screen.COLOR = EXPOSURE <empty> COLOR_GRADING <empty> SATURATION VIBRANCE CONTRAST WHITE_BALANCE
screen.COLOR.columns = 2

# ---- Shadows ---------------------------------------------------------------
screen.SHADOWS = shadowMapResolution shadowDistance SHADOW_QUALITY SHADOW_SOFTNESS SHADOW_BIAS_SCALE SHADOW_DISTORTION
screen.SHADOWS.columns = 2

# ---- Lighting --------------------------------------------------------------
screen.LIGHTING = SUNLIGHT_STRENGTH SKYLIGHT_STRENGTH BLOCKLIGHT_STRENGTH <empty> SSAO SSAO_QUALITY SSAO_STRENGTH SSAO_RADIUS
screen.LIGHTING.columns = 2

# ---- Water -----------------------------------------------------------------
screen.WATER = WATER_WAVES WAVE_STRENGTH WAVE_SPEED WATER_NORMAL_STRENGTH SSR SSR_QUALITY WATER_ABSORPTION <empty> WATER_REFRACTION WATER_CAUSTICS
screen.WATER.columns = 2

# ---- Sky and clouds --------------------------------------------------------
screen.SKY = CUSTOM_SKY <empty> VOLUMETRIC_CLOUDS CLOUD_QUALITY CLOUD_COVERAGE CLOUD_HEIGHT CLOUD_SPEED
screen.SKY.columns = 2

# ---- Post processing -------------------------------------------------------
screen.POST = BLOOM BLOOM_STRENGTH AUTO_EXPOSURE EXPOSURE_SPEED <empty> TONEMAP <empty> VIGNETTE VIGNETTE_STRENGTH
screen.POST.columns = 2

# Anything with a continuous range reads better as a slider than as a button
# you have to click through one value at a time.
sliders = shadowMapResolution shadowDistance SHADOW_QUALITY SHADOW_SOFTNESS SHADOW_BIAS_SCALE SHADOW_DISTORTION SUNLIGHT_STRENGTH SKYLIGHT_STRENGTH BLOCKLIGHT_STRENGTH SSAO_QUALITY SSAO_STRENGTH SSAO_RADIUS WAVE_STRENGTH WAVE_SPEED WATER_NORMAL_STRENGTH SSR_QUALITY WATER_ABSORPTION CLOUD_QUALITY CLOUD_COVERAGE CLOUD_HEIGHT CLOUD_SPEED BLOOM_STRENGTH EXPOSURE EXPOSURE_SPEED VIGNETTE_STRENGTH SATURATION VIBRANCE CONTRAST WHITE_BALANCE

# ---- Profiles --------------------------------------------------------------
# MEDIUM is the 60fps-at-12-chunks target on midrange hardware. POTATO and LOW
# drop the raymarched clouds, which is the single most expensive feature here.
profile.POTATO = shadowMapResolution=512 shadowDistance=64.0 SHADOW_QUALITY=0 SHADOW_SOFTNESS=0.4 !SSAO !SSR !WATER_WAVES !WATER_REFRACTION !WATER_CAUSTICS !VOLUMETRIC_CLOUDS !BLOOM !AUTO_EXPOSURE !VIGNETTE TONEMAP=1 COLOR_GRADING
profile.LOW = shadowMapResolution=1024 shadowDistance=96.0 SHADOW_QUALITY=0 SHADOW_SOFTNESS=0.6 !SSAO !SSR WATER_WAVES WAVE_STRENGTH=0.5 WATER_REFRACTION !WATER_CAUSTICS !VOLUMETRIC_CLOUDS BLOOM BLOOM_STRENGTH=0.2 AUTO_EXPOSURE VIGNETTE TONEMAP=1
profile.MEDIUM = shadowMapResolution=2048 shadowDistance=128.0 SHADOW_QUALITY=1 SHADOW_SOFTNESS=1.0 SSAO SSAO_QUALITY=0 SSR SSR_QUALITY=0 WATER_WAVES WATER_REFRACTION WATER_CAUSTICS VOLUMETRIC_CLOUDS CLOUD_QUALITY=0 BLOOM AUTO_EXPOSURE VIGNETTE TONEMAP=1
profile.HIGH = shadowMapResolution=4096 shadowDistance=192.0 SHADOW_QUALITY=2 SHADOW_SOFTNESS=1.5 SSAO SSAO_QUALITY=2 SSR SSR_QUALITY=2 WATER_WAVES WATER_REFRACTION WATER_CAUSTICS VOLUMETRIC_CLOUDS CLOUD_QUALITY=2 BLOOM AUTO_EXPOSURE VIGNETTE TONEMAP=1
