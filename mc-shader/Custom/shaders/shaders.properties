# ============================================================================
# Custom - shaders.properties
# Target: Iris 1.10.x on Minecraft 1.21.11 (Fabric), Sodium 0.8.x
#
# Buffer layout is documented in full at the top of composite.fsh and in
# NOTES.md. Formats are set explicitly below rather than relying on the RGBA8
# default, because everything carrying HDR colour or normals needs float.
# ============================================================================

# ---- Buffer formats --------------------------------------------------------
# colortex0: HDR scene colour. Must be float or bloom/exposure clip at 1.0.
colortex0Format = RGBA16F

# ---- Step 1 ----------------------------------------------------------------
# Pass-through skeleton. Vanilla lightmap, vanilla fog, straight copy in final.
# The remaining buffers, the shadow pass and the composite chain are added in
# later steps; declaring formats for buffers nothing writes to would just burn
# VRAM.


