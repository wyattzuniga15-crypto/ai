# ============================================================================
# block.properties - block ID assignments, read through mc_Entity.x in
# gbuffers_terrain, gbuffers_water and shadow.
#
# gbuffers_water receives ALL translucent terrain, not just water: stained
# glass, ice, slime and honey blocks all arrive in the same program. Waves,
# absorption and reflection must only apply to actual water, so water needs to
# identify itself. Anything without an entry here reports -1.0.
#
# The IDs here match the MAT_ID_* constants in lib/common.glsl.
# ============================================================================

# --- 1: water ---------------------------------------------------------------
block.1 = minecraft:water minecraft:flowing_water minecraft:bubble_column

# --- 2: ice and other clear translucents ------------------------------------
# Not waved and not absorbed through, but still reflective. Kept distinct from
# "unknown translucent" so the compositor can give them a Fresnel term.
block.2 = minecraft:ice minecraft:frosted_ice minecraft:glass
